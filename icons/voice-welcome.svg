<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="glowA" cx="0.78" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#4F7BFF" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#5B3DF5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5B3DF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.6">
      <stop offset="0" stop-color="#9B5CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9B5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9C8FF"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A8CFF"/>
      <stop offset="1" stop-color="#6A3CF0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D4FF"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#07070A"/>
  <rect width="1280" height="720" fill="url(#glowA)"/>
  <rect width="1280" height="720" fill="url(#glowB)"/>

  <!-- большая голосовая волна справа -->
  <g transform="translate(700,360)">
    <rect x="0"   y="-60"  width="34" height="120" rx="17" fill="url(#bar)" opacity="0.55"/>
    <rect x="60"  y="-120" width="34" height="240" rx="17" fill="url(#bar)" opacity="0.75"/>
    <rect x="120" y="-200" width="34" height="400" rx="17" fill="url(#bar)"/>
    <rect x="180" y="-140" width="34" height="280" rx="17" fill="url(#bar)" opacity="0.9"/>
    <rect x="240" y="-230" width="34" height="460" rx="17" fill="url(#bar)"/>
    <rect x="300" y="-160" width="34" height="320" rx="17" fill="url(#bar)" opacity="0.9"/>
    <rect x="360" y="-90"  width="34" height="180" rx="17" fill="url(#bar)" opacity="0.75"/>
    <rect x="420" y="-130" width="34" height="260" rx="17" fill="url(#bar)" opacity="0.6"/>
    <rect x="480" y="-50"  width="34" height="100" rx="17" fill="url(#bar)" opacity="0.4"/>
  </g>

  <!-- иконка + название -->
  <g transform="translate(96,206)">
    <rect width="96" height="96" rx="26" fill="url(#tile)"/>
    <g fill="#FFFFFF" transform="translate(19,0)">
      <rect x="0"  y="40" width="8" height="16" rx="4"/>
      <rect x="13" y="30" width="8" height="36" rx="4"/>
      <rect x="26" y="20" width="8" height="56" rx="4"/>
      <rect x="39" y="32" width="8" height="32" rx="4"/>
      <rect x="52" y="25" width="8" height="46" rx="4"/>
    </g>
  </g>
  <text x="90" y="410" fill="url(#title)" font-family="Helvetica Neue, Helvetica, Arial" font-weight="600" font-size="116" letter-spacing="-3">Kaizen AI</text>
  <text x="96" y="470" fill="#C3C7D6" font-family="Helvetica Neue, Helvetica, Arial" font-size="34">Скажи голосом — получи задачи</text>
</svg>
