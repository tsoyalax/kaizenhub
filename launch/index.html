<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Воронки — KaizenHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Отдельная страница KaizenHub: воронки запуска. Приложение (/) не трогает — общие только вход и хранилище аккаунта.
   Данные: data/users/<id>/launch/<воронка> = { board, at }. Без входа — только этот браузер (localStorage kz-launch). */
:root{
  --bg:#eef1f5; --col:#e3e8ef; --surface:#ffffff; --fg:#151a23; --muted:#5d6676; --line:#d5dbe5;
  --accent:#2f5bd8;
  --ok:#15803d; --ok-bg:#e3f3e9; --part:#b45309; --part-bg:#fbf0dc; --gap:#b42318; --gap-bg:#fbe7e5;
  --x1:#2f5bd8; --x2:#c2410c; --x3:#b4236b; --x4:#14683a; --x5:#7c3aed;
  --fx:#15803d; --pr:#b45309;
  --f-display:"Manrope",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --col:#161b23; --surface:#1e242e; --fg:#e7eaf0; --muted:#9aa3b2; --line:#2c3340;
  --accent:#7d9bff;
  --ok:#4ade80; --ok-bg:#15291c; --part:#fbbf24; --part-bg:#2e2512; --gap:#ff8a7e; --gap-bg:#33191a;
  --x1:#7d9bff; --x2:#fb8a4c; --x3:#f472b6; --x4:#7fe0a5; --x5:#b08cff;
  --fx:#4ade80; --pr:#fbbf24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --col:#161b23; --surface:#1e242e; --fg:#e7eaf0; --muted:#9aa3b2; --line:#2c3340;
  --accent:#7d9bff;
  --ok:#4ade80; --ok-bg:#15291c; --part:#fbbf24; --part-bg:#2e2512; --gap:#ff8a7e; --gap-bg:#33191a;
  --x1:#7d9bff; --x2:#fb8a4c; --x3:#f472b6; --x4:#7fe0a5; --x5:#b08cff;
  --fx:#4ade80; --pr:#fbbf24; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left,0px));padding-top:max(10px,env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top a.home{font-family:var(--f-display);font-weight:800;color:var(--fg);text-decoration:none;white-space:nowrap}
.top .sep{color:var(--muted)}
.boards{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.boards button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.boards button[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--gap)}
.bell{position:relative;width:36px;height:34px;display:grid;place-items:center;padding:0}
.bell svg{width:18px;height:18px}
.bell b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--gap);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.wrap{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
h2{font-size:20px;font-weight:800}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:78ch;margin:6px 0 0}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;flex-direction:column;gap:4px;max-width:1100px}
.sec-h p{margin:0;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend b{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap;border:0;cursor:default}
button.pill{cursor:pointer}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.part{color:var(--part);background:var(--part-bg)} .pill.gap{color:var(--gap);background:var(--gap-bg)}
.legend .fx{color:var(--fx)} .legend .pr{color:var(--pr)}
/* воронка */
.chain{display:flex;gap:0;overflow-x:auto;padding-bottom:12px;align-items:stretch}
.stage{flex:0 0 280px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:12px;padding:14px;border-top:4px solid var(--st);min-width:0}
@media (max-width:420px){.stage{flex-basis:80vw}}
.stage[data-s="ok"]{--st:var(--ok)} .stage[data-s="part"]{--st:var(--part)} .stage[data-s="gap"]{--st:var(--gap)}
.arrow{flex:0 0 26px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.st-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st-n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.stage h3{font-size:16px;font-weight:800}
.stage .what{font-size:12.5px;color:var(--muted);margin:0}
.blk{display:flex;flex-direction:column;gap:4px}
.blk .lbl{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.blk ul.have{margin:0;padding-left:16px;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.blk.todo{background:var(--col);border-radius:8px;padding:8px 10px}
.blk.todo .lbl{color:var(--gap)}
.stage[data-s="ok"] .blk.todo .lbl{color:var(--muted)}
ul.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
ul.chk li{display:grid;grid-template-columns:16px 1fr;gap:7px;align-items:start;font-size:12.5px}
ul.chk input{margin:2px 0 0;width:14px;height:14px;accent-color:var(--accent)}
ul.chk .tt{cursor:pointer;min-width:0;background:none;border:0;padding:0;text-align:left;font-size:12.5px}
ul.chk .tt:hover .tx{text-decoration:underline}
ul.chk li.on .tx{color:var(--muted);text-decoration:line-through}
.meta{display:inline-flex;gap:6px;margin-left:4px;font-size:10.5px;white-space:nowrap;flex-wrap:wrap}
.meta .who{font-weight:600;color:var(--accent)}
.meta .d{font-family:var(--f-mono)} .d.fx{color:var(--fx)} .d.pr{color:var(--pr)}
.meta .late{font-weight:700;color:var(--gap)} .meta .today{font-weight:700;color:var(--part)}
.addt{align-self:flex-start;background:none;border:0;padding:0;color:var(--accent);font-size:12px;cursor:pointer}
.metric{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.metric b{color:var(--fg);font-weight:600}
.cmini{font-size:12px;color:var(--muted)}.cmini b{color:var(--fg)}
/* вокруг воронки */
.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.proj{background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--c);min-width:0}
.proj .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.proj h3{font-size:16px;font-weight:800}
.proj .due{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.proj .why{font-size:12.5px;color:var(--muted);margin:0}
.proj .link{font-size:12px;color:var(--c);font-weight:600}
.proj ul.chk input{accent-color:var(--c)}
.proj .meta .who{color:var(--c)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;max-width:1100px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel h3{font-size:16px;font-weight:800}
.panel ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.note{font-size:12px;color:var(--muted);margin:0}
/* редактирование */
.ed input,.ed textarea,.ed select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:5px 8px;font-size:13px}
.ed textarea{resize:vertical;min-height:52px}
.ed .row{display:flex;gap:6px;align-items:center}
.ed .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px;flex:none}
.ed-h1{font-size:24px!important;font-weight:800;font-family:var(--f-display)}
.addblk{flex:0 0 140px;border:1px dashed var(--line);border-radius:12px;background:none;color:var(--muted);cursor:pointer;margin-left:26px}
/* отдел контента */
.cd{background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:1100px;border-top:4px solid var(--x2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--col);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.kpi b{font-family:var(--f-display);font-size:22px;font-weight:800}
.kpi small{color:var(--muted);font-size:12px}
.kpi.bad b{color:var(--gap)} .kpi.good b{color:var(--ok)}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.cnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.tbl tr.cur td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.tbl td.num{font-family:var(--f-mono)}
.tbl input{width:56px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:2px 6px;font-family:var(--f-mono);font-size:12.5px}
.fact.bad{color:var(--gap);font-weight:600}.fact.good{color:var(--ok);font-weight:600}
.scroll{overflow-x:auto}
.wtabs{display:flex;gap:4px;flex-wrap:wrap}
.wtabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.wtabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.reels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.reel{display:grid;grid-template-columns:92px 1fr auto auto auto;gap:8px;align-items:center;background:var(--col);border-radius:9px;padding:6px 8px;font-size:13px}
.reel .rd{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.reel .rd.late{color:var(--gap);font-weight:600}
.reel input.rt{border:1px solid transparent;background:none;border-radius:6px;padding:3px 6px;min-width:0;width:100%}
.reel input.rt:hover,.reel input.rt:focus{border-color:var(--line);background:var(--surface)}
.reel .rw{font-size:12px;color:var(--accent);font-weight:600}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--surface);font-weight:600}
.seg button.pub[aria-pressed="true"]{background:var(--ok);color:#fff}
.reel .rx{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px}
.radd{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.radd input,.radd select{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:5px 8px;font-size:13px}
.radd input[name=title]{flex:1 1 200px}
@media (max-width:560px){.reel{grid-template-columns:70px 1fr auto}.reel .seg{grid-column:2}}
/* окна */
.layer:empty{display:none}
.back{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:40}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:18px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 10px;font-size:14px;color:var(--fg)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck{display:flex;gap:8px;align-items:center;font-size:13.5px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.acts .l{margin-right:auto}
.send{display:flex;gap:6px;flex-wrap:wrap}
.send a{font-size:12.5px;text-decoration:none;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.err{color:var(--gap);font-size:12.5px;min-height:1em}
/* уведомления */
.drop{position:fixed;z-index:30;right:max(12px,env(safe-area-inset-right,0px));top:58px;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.18);padding:12px;display:flex;flex-direction:column;gap:10px}
.drop h4{font-size:13px;margin:4px 0 0}.drop h4.late{color:var(--gap)}.drop h4.today{color:var(--part)}
.drop ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.drop li button{width:100%;text-align:left;background:var(--col);border:0;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12.5px}
.drop li small{display:block;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:8px 14px;border-radius:10px;font-size:13px;z-index:60}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="top">
  <a class="home" href="/" title="Вернуться в KaizenHub">KaizenHub</a><span class="sep">/</span><b>Воронки</b>
  <nav class="boards" id="boards" aria-label="Воронки"></nav>
  <span class="sp"></span>
  <span class="sync" id="sync"></span>
  <button class="btn bell" id="bellBtn" aria-label="Уведомления по задачам"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><b id="bellN" hidden></b></button>
  <button class="btn" id="editBtn" aria-pressed="false">Редактировать</button>
</header>
<main class="wrap" id="root"><p class="note">Загружаю…</p></main>
<div class="layer" id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script src="/claude-shim.js"></script>
<script>
(function(){
'use strict';
// ---------- даты ----------
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const monday = s => addDays(s, -((parse(s).getDay() + 6) % 7));
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const fmt = s => { if (!s) return ''; const d = parse(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const range = (a, b) => a && b ? (a.slice(0, 7) === b.slice(0, 7) ? `${parse(a).getDate()}–${fmt(b)}` : `${fmt(a)} – ${fmt(b)}`) : b ? `до ${fmt(b)}` : a ? `с ${fmt(a)}` : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const uid = () => Math.random().toString(36).slice(2, 10);
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
function toast(t){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.append(el); setTimeout(() => el.remove(), 2600); }

// ---------- данные по умолчанию: «Воронка Игоря» (по созвону с Ромой, 13 ноября 2026) ----------
// задача: { id, t, who, start, due, fx (срок утверждён), rec (регулярная / постоянно), done }
const T = (t, who, start, due, fx, rec) => ({ id:uid(), t, who, start:start || null, due:due || null, fx:!!fx, rec:!!rec, done:false });
function seedIgor(){
  const t0 = today(), w0 = monday(t0);
  const reels = []; for (let w = -1; w < 3; w++) for (let i = 0; i < 5; i++){
    const date = addDays(w0, w * 7 + i); const past = date < t0;
    reels.push({ id:uid(), title:'', date, who:'Юля', st:past ? (i === 3 && w === 0 ? 'shot' : 'pub') : 'plan', pubAt:past && !(i === 3 && w === 0) ? date : null });
  }
  return {
    id:'igor', title:'Воронка Игоря', eyebrow:'По созвону с Ромой · 13 ноября 2026',
    lead:'Путь человека от контента до оплаты. По каждому этапу видно, что уже работает и чего не хватает. Главная дыра сейчас: заявки доходят до менеджера, но не покупают, потому что не хватает материалов.',
    fxLabel:'назвал Рома', prLabel:'моё предложение',
    stages:[
      { id:'content', name:'Контент', what:'Рилсы и карусели в Instagram, посты в Telegram, сторис. Ведут на статью.', s:'part',
        have:['Юля делает рилсы и весь остальной контент', 'Смыслы и идеи от Ромы'],
        todo:[T('Нанять автора постов и сторис стилем Игоря', 'Ты', null, '2026-11-24'), T('5 постов и 5 сторис в неделю', 'Автор', '2026-11-24', null, false, true),
          T('Юля только на рилсах', 'Юля', '2026-11-24', null, false, true), T('Озвучка и рилс от Игоря', 'Игорь', null, '2026-11-13', true),
          T('Рилс выходит в день плана, без переносов', 'Юля', null, null, false, true)],
        metric:'+10 000 подписчиков к декабрю', content:true },
      { id:'article', name:'Статья', what:'Человек читает статью и решает оставить заявку.', s:'part', have:['Новая статья выдаётся', 'Первая статья, которая продавала год'],

// ---------- хранилище: аккаунт KaizenHub (data/users/<id>/launch/<воронка>) или этот браузер ----------
const S = { boards:[], cur:'', mode:'local', store:null, uid:'', timers:{}, writing:0, edit:false, bell:false, wk:'', cw:0 };
const LKEY = 'kz-launch';
const pathOf = id => `data/users/${S.uid}/launch/${id}`;
function setSync(t){ const el = $('#sync'); if (el) el.textContent = t; }
function saveLocal(){ try { localStorage.setItem(LKEY, JSON.stringify({ boards:S.boards, cur:S.cur })); } catch(e) {} }
function save(b = board()){
  b.updated = new Date().toISOString(); saveLocal();
  if (S.mode !== 'cloud'){ setSync('Сохранено в этом браузере'); return; }
  setSync('Сохраняю…'); clearTimeout(S.timers[b.id]); S.dirty = (S.dirty || 0) + 1;
  S.timers[b.id] = setTimeout(async () => {
    S.writing++;
    try { await S.store.doc(pathOf(b.id)).set({ board:b, at:b.updated }); setSync('Сохранено в KaizenHub'); }
    catch(e) { setSync('Не сохранилось — проверьте связь'); }
    S.writing--; S.dirty = 0;
  }, 500);
}
async function boot(){
  try { const l = JSON.parse(localStorage.getItem(LKEY) || 'null'); if (l?.boards?.length){ S.boards = l.boards; S.cur = l.cur; } } catch(e) {}
  if (window.claude?.use){
    try {
      S.store = await window.claude.use('db'); const user = await window.claude.use('user'); S.uid = await user.id(); S.mode = 'cloud';
      const col = S.store.collection(`data/users/${S.uid}/launch`);
      const snap = await col.get(); const remote = snap.docs.map(d => d.data()?.board).filter(Boolean);
      if (remote.length){ S.boards = remote.sort((a, b) => String(a.created || '').localeCompare(String(b.created || ''))); }
      else { if (!S.boards.length) S.boards = [seedIgor()]; S.boards.forEach(b => save(b)); }
      col.onSnapshot(s => {   // правки с другого устройства
        if (S.writing || S.dirty || document.querySelector('#layer .modal') || document.activeElement?.matches?.('input,textarea')) return;
        const list = s.docs.map(d => d.data()?.board).filter(Boolean); if (!list.length) return;
        const was = JSON.stringify(S.boards); const merged = list.sort((a, b) => String(a.created || '').localeCompare(String(b.created || '')));
        if (JSON.stringify(merged) !== was){ S.boards = merged; saveLocal(); render(); }
      }, () => {});
      setSync('Сохранено в KaizenHub');
    } catch(e) { S.mode = 'local'; setSync('Без входа: сохраняется только в этом браузере'); }
  } else setSync('Без входа: сохраняется только в этом браузере');
  if (!S.boards.length){ S.boards = [seedIgor()]; save(S.boards[0]); }
  if (!S.boards.some(b => b.id === S.cur)) S.cur = S.boards[0].id;
  render(); remindLoop();
}
const board = () => S.boards.find(b => b.id === S.cur) || S.boards[0];

        : `<p class="why">${esc(p.why)}</p><span class="link">${esc(p.link)}</span>`}
      ${checklist('side', p.id, p.todo)}
      ${E ? `<button class="x" data-pdel="${p.id}" style="align-self:flex-end;color:var(--gap);font-size:12px">удалить проект</button>` : ''}</article>`; };
  $('#root').innerHTML = `
    <header class="${E ? 'ed' : ''}" style="display:flex;flex-direction:column;gap:6px">
      ${E ? `<input data-bf="eyebrow" value="${esc(b.eyebrow)}" placeholder="Подзаголовок, например «По созвону с Ромой»"><input class="ed-h1" data-bf="title" value="${esc(b.title)}" aria-label="Название воронки"><textarea data-bf="lead" placeholder="Коротко: что главное сейчас">${esc(b.lead)}</textarea>`
        : `${b.eyebrow ? `<div class="eyebrow">${esc(b.eyebrow)}</div>` : ''}<h1>${esc(b.title)}</h1>${b.lead ? `<p class="lead">${esc(b.lead)}</p>` : ''}`}
    </header>
    <div class="legend"><span class="pill ok">работает</span><span class="pill part">частично</span><span class="pill gap">не хватает</span>
      <span><b class="fx">Зелёная дата</b> — ${esc(b.fxLabel)}</span><span><b class="pr">Оранжевая</b> — ${esc(b.prLabel)}</span>
      <span>Нажмите на задачу — исполнитель, сроки, напоминание</span><span>${S.mode === 'cloud' ? 'Сохраняется в вашем аккаунте KaizenHub' : 'Без входа — только в этом браузере'}</span></div>
    <section class="sec"><div class="sec-h"><h2>Этапы воронки</h2></div>
      <div class="chain">${b.stages.map((st, i) => (i ? '<div class="arrow" aria-hidden="true">→</div>' : '') + stage(st, i)).join('')}${E ? '<button class="addblk" data-addstage>+ Этап</button>' : ''}</div></section>
    ${b.content ? contentHtml(b) : ''}
    <section class="sec"><div class="sec-h"><h2>Вокруг воронки</h2><p>Отдельные проекты, которые кормят воронку трафиком или закрывают продажи.</p></div>
      <div class="side">${b.side.map(proj).join('')}${E ? '<button class="addblk" data-addside style="margin:0;min-height:120px">+ Проект</button>' : ''}</div></section>
    <section class="two"><div class="panel${E ? ' ed' : ''}"><h3>Уточнить</h3>
      ${E ? `${b.ask.map((a, k) => `<div class="row"><input data-ask="${k}" value="${esc(a)}"><button class="x" data-askdel="${k}">×</button></div>`).join('')}<button class="addt" data-askadd>+ вопрос</button><input data-bf="askNote" value="${esc(b.askNote)}" placeholder="Заметка">`
        : `${b.ask.length ? `<ul>${b.ask.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : '<p class="note">Вопросов нет. Добавить — «Редактировать».</p>'}${b.askNote ? `<p class="note">${esc(b.askNote)}</p>` : ''}`}</div>
      ${E ? `<div class="panel ed"><h3>Воронка</h3><label class="f">Зелёная дата — это<input data-bf="fxLabel" value="${esc(b.fxLabel)}"></label><label class="f">Оранжевая — это<input data-bf="prLabel" value="${esc(b.prLabel)}"></label>
        <div class="acts"><button class="btn" data-copyboard>Копия как новая воронка</button>${S.boards.length > 1 ? '<button class="btn danger" data-delboard>Удалить воронку</button>' : ''}</div></div>` : ''}
    </section>`;
  paintBell();
}

// ---------- уведомления: колокольчик, уведомления браузера, напоминание исполнителю ----------
function alerts(){
  const b = board(); const items = allTasks(b).filter(x => !x.t.done && x.t.due);
  return { late:items.filter(x => urgency(x.t) === 'late'), today:items.filter(x => urgency(x.t) === 'today'), soon:items.filter(x => urgency(x.t) === 'soon') };
}
function paintBell(){
  const a = alerts(); const n = a.late.length + a.today.length; const el = $('#bellN'); el.hidden = !n; el.textContent = n;
  if (S.bell) openBell();
}
function openBell(){
  S.bell = true; const a = alerts(); const who = S.bellWho || '';
  const f = l => who ? l.filter(x => x.t.who === who) : l;
  const li = x => `<li><button data-task="${x.scope}|${x.pid}|${x.t.id}">${esc(x.t.t)}<small>${esc(x.where)} · ${esc(x.t.who || 'не назначено')} · ${fmt(x.t.due)}</small></button></li>`;
  const grp = (cls, title, l) => l.length ? `<h4 class="${cls}">${title} · ${l.length}</h4><ul>${l.map(li).join('')}</ul>` : '';
  let d = $('#drop'); if (!d){ d = document.createElement('div'); d.id = 'drop'; d.className = 'drop'; document.body.append(d); }
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  d.innerHTML = `<div style="display:flex;gap:8px;align-items:center"><b style="flex:1">Задачи по срокам</b><select id="bellWho" aria-label="Исполнитель" style="border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px 6px;font-size:12.5px"><option value="">Все</option>${people(board()).map(p => `<option ${p === who ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div>
    ${grp('late', 'Просрочено', f(a.late))}${grp('today', 'Сегодня', f(a.today))}${grp('', 'В ближайшие 2 дня', f(a.soon))}
    ${!f(a.late).length && !f(a.today).length && !f(a.soon).length ? '<p class="note">Горящих задач нет.</p>' : ''}
    ${perm === 'default' ? '<button class="btn" data-notify>Включить уведомления в браузере</button>' : perm === 'granted' ? '<p class="note">Уведомления браузера включены: о просроченном и задачах на сегодня, пока страница открыта.</p>' : perm === 'denied' ? '<p class="note">Уведомления браузера запрещены в настройках сайта.</p>' : ''}`;
}
function closeBell(){ S.bell = false; $('#drop')?.remove(); }
function remindLoop(){
  const run = () => {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const a = alerts(); const day = today(); let sent = {}; try { sent = JSON.parse(localStorage.getItem('kz-launch-sent') || '{}'); } catch(e) {}
    [...a.late, ...a.today].forEach(x => { const k = `${x.t.id}:${day}`; if (sent[k]) return; sent[k] = 1;
      try { new Notification(urgency(x.t) === 'late' ? 'Просрочено' : 'Срок сегодня', { body:`${x.t.t} — ${x.t.who || 'не назначено'} (${x.where})`, tag:x.t.id }); } catch(e) {} });
    try { localStorage.setItem('kz-launch-sent', JSON.stringify(sent)); } catch(e) {}
  };
  run(); setInterval(run, 30 * 60 * 1000);
}
const reminderText = (b, t) => `Напоминание по воронке «${b.title}»: ${t.t}${t.due ? ` — срок ${fmt(t.due)}` : ''}${t.start ? ` (с ${fmt(t.start)})` : ''}.`;

// ---------- окно задачи: исполнитель, начало, срок, утверждён, постоянно, напоминание ----------
function openTask(scope, pid, tid){
  const b = board(); const owner = listOf(b, scope, pid); if (!owner) return;
  const t = tid ? owner.todo.find(x => x.id === tid) : null; const v = t || { t:'', who:'', start:null, due:null, fx:false, rec:false, done:false };
  const ppl = people(b);
  $('#layer').innerHTML = `<div class="back" data-close></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="tkT">
    <h2 id="tkT">${t ? 'Задача' : 'Новая задача'} <span class="note" style="font-weight:500">· ${esc(owner.name)}</span></h2>
    <form id="tkForm" style="display:flex;flex-direction:column;gap:10px" novalidate>
      <label class="f">Что сделать<input id="tkT1" value="${esc(v.t)}" maxlength="300" autocomplete="off"></label>
      <label class="f">Исполнитель<input id="tkWho" value="${esc(v.who)}" list="tkPpl" placeholder="Например, Юля" autocomplete="off"><datalist id="tkPpl">${ppl.map(p => `<option value="${esc(p)}">`).join('')}</datalist></label>
      <div class="f2"><label class="f">Начало<input type="date" id="tkStart" value="${v.start || ''}"></label><label class="f">Срок (дедлайн)<input type="date" id="tkDue" value="${v.due || ''}"></label></div>
      <label class="ck"><input type="checkbox" id="tkFx" ${v.fx ? 'checked' : ''}> Срок утверждён <span class="note">(${esc(b.fxLabel)}; иначе — ${esc(b.prLabel)})</span></label>
      <label class="ck"><input type="checkbox" id="tkRec" ${v.rec ? 'checked' : ''}> Постоянная задача (без даты окончания)</label>
      ${t ? `<label class="ck"><input type="checkbox" id="tkDone" ${v.done ? 'checked' : ''}> Готово</label>` : ''}
      ${t ? `<div class="f">Напомнить исполнителю<div class="send"><a target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(location.origin + location.pathname)}&text=${encodeURIComponent(reminderText(b, v))}">Telegram</a><a target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(reminderText(b, v) + ' ' + location.origin + location.pathname)}">WhatsApp</a><a href="#" data-copyrem>Копировать текст</a></div></div>` : ''}
      <div class="err" id="tkErr"></div>
      <div class="acts">${t ? '<button type="button" class="btn danger l" id="tkDel">Удалить</button>' : ''}<button type="button" class="btn" data-close>Отмена</button><button class="btn pri">${t ? 'Сохранить' : 'Добавить'}</button></div>
    </form></div>`;
  $('#tkT1').focus();
  $('#tkForm').onsubmit = e => {
    e.preventDefault(); const title = $('#tkT1').value.trim(); if (!title){ $('#tkErr').textContent = 'Напишите, что сделать'; return; }
    const start = $('#tkStart').value || null, due = $('#tkDue').value || null;
    if (start && due && start > due){ $('#tkErr').textContent = 'Начало позже срока'; return; }
    const data = { t:title, who:$('#tkWho').value.trim(), start, due, fx:$('#tkFx').checked, rec:$('#tkRec').checked, done:t ? $('#tkDone').checked : false };
    if (t) Object.assign(t, data); else owner.todo.push({ id:uid(), ...data });
    $('#layer').innerHTML = ''; save(); render(); toast(t ? 'Сохранено' : `Задача добавлена${data.who ? ` — ${data.who}` : ''}`);
  };
  const del = $('#tkDel'); if (del) del.onclick = () => { if (!confirm(`Удалить «${t.t}»?`)) return; owner.todo = owner.todo.filter(x => x !== t); $('#layer').innerHTML = ''; save(); render(); };
  const cp = document.querySelector('[data-copyrem]'); if (cp) cp.onclick = ev => { ev.preventDefault(); navigator.clipboard?.writeText(reminderText(b, v)).then(() => toast('Текст скопирован'), () => toast('Не удалось скопировать')); };
}

// ---------- события ----------
document.addEventListener('click', e => {
  const el = e.target; const b = board();
  if (el.closest('#bellBtn')){ S.bell ? closeBell() : openBell(); return; }
  if (S.bell && !el.closest('#drop') && !el.closest('[data-task]')) closeBell();
  if (el.closest('[data-close]')){ $('#layer').innerHTML = ''; return; }
  if (el.closest('#editBtn')){ S.edit = !S.edit; render(); return; }
  const bd = el.closest('[data-board]'); if (bd){ S.cur = bd.dataset.board; S.wk = ''; saveLocal(); render(); return; }
  if (el.closest('[data-newboard]')){ const n = prompt('Название новой воронки', 'Новая воронка'); if (!n || !n.trim()) return;
    const nb = emptyBoard(n.trim().slice(0, 80)); nb.created = new Date().toISOString(); S.boards.push(nb); S.cur = nb.id; S.edit = true; save(nb); render(); return; }
  if (el.closest('[data-copyboard]')){ const n = prompt('Название копии', `${b.title} (копия)`); if (!n || !n.trim()) return;
    const nb = emptyBoard(n.trim().slice(0, 80), b); nb.created = new Date().toISOString(); S.boards.push(nb); S.cur = nb.id; save(nb); render(); toast('Копия создана: этапы и проекты без задач'); return; }
  if (el.closest('[data-delboard]')){ if (!confirm(`Удалить воронку «${b.title}» со всеми задачами?`)) return;
    S.boards = S.boards.filter(x => x !== b); S.cur = S.boards[0].id; saveLocal(); if (S.mode === 'cloud') S.store.doc(pathOf(b.id)).delete().catch(() => {}); S.edit = false; render(); return; }
  const ts = el.closest('[data-task]'); if (ts){ const [sc, pid, tid] = ts.dataset.task.split('|'); closeBell(); openTask(sc, pid, tid); return; }
  const at = el.closest('[data-addtask]'); if (at){ const [sc, pid] = at.dataset.addtask.split('|'); openTask(sc, pid, null); return; }
  const cy = el.closest('[data-cycle]'); if (cy){ const st = b.stages.find(x => x.id === cy.dataset.cycle); st.s = { gap:'part', part:'ok', ok:'gap' }[st.s]; save(); render(); return; }
  if (el.closest('[data-notify]')){ Notification.requestPermission().then(() => { openBell(); remindLoop(); }); return; }
  if (el.closest('[data-goal]')){ const g = b.content.goal; const t = prompt('Цель: сколько нужно (например, 10000)', g.target || ''); if (t === null) return;
    const f = prompt('Сколько сейчас (факт)', g.fact || 0); if (f === null) return; g.target = Math.max(0, +t || 0); g.fact = Math.max(0, +f || 0); save(); render(); return; }
  // рилсы
  const wk = el.closest('[data-wk]'); if (wk){ S.wk = wk.dataset.wk; render(); return; }
  const rs = el.closest('[data-rst]'); if (rs){ const [id, st] = rs.dataset.rst.split('|'); const r = b.content.reels.find(x => x.id === id); r.st = st; r.pubAt = st === 'pub' ? (r.pubAt || (r.date <= today() ? today() : r.date)) : null; save(); render(); return; }
  const rd = el.closest('[data-rdel]'); if (rd){ b.content.reels = b.content.reels.filter(x => x.id !== rd.dataset.rdel); save(); render(); return; }
  const sh = el.closest('[data-cshift]'); if (sh){ b.content.start = addDays(b.content.start, +sh.dataset.cshift * 7); S.wk = ''; save(); render(); return; }
  if (el.closest('[data-planweek]')){ const c = b.content; const n = Math.max(1, +prompt('Сколько рилсов на неделю?', c.reelsPerWeek) || 0); if (!n) return; c.reelsPerWeek = n;
    const who = $('#reelAdd [name=who]').value.trim(); for (let i = 0; i < n; i++) c.reels.push({ id:uid(), title:'', date:addDays(S.wk, Math.min(6, Math.round(i * 7 / n))), who, st:'plan', pubAt:null });
    save(); render(); toast(`Запланировано рилсов: ${n}`); return; }
  // редактирование
  const ha = el.closest('[data-haveadd]'); if (ha){ b.stages.find(x => x.id === ha.dataset.haveadd).have.push(''); save(); render(); return; }
  const hd = el.closest('[data-havedel]'); if (hd){ const [sid, k] = hd.dataset.havedel.split('|'); b.stages.find(x => x.id === sid).have.splice(+k, 1); save(); render(); return; }
  if (el.closest('[data-addstage]')){ b.stages.push({ id:uid(), name:'Новый этап', what:'', s:'gap', have:[], todo:[], metric:'' }); save(); render(); return; }
  const sd = el.closest('[data-sdel]'); if (sd){ const st = b.stages.find(x => x.id === sd.dataset.sdel); if (!confirm(`Удалить этап «${st.name}»?`)) return; b.stages = b.stages.filter(x => x !== st); save(); render(); return; }
  if (el.closest('[data-addside]')){ const cs = ['--x1', '--x2', '--x3', '--x4', '--x5']; b.side.push({ id:uid(), name:'Новый проект', c:cs[b.side.length % 5], why:'', link:'', todo:[] }); save(); render(); return; }
  const pd = el.closest('[data-pdel]'); if (pd){ const p = b.side.find(x => x.id === pd.dataset.pdel); if (!confirm(`Удалить «${p.name}»?`)) return; b.side = b.side.filter(x => x !== p); save(); render(); return; }
  if (el.closest('[data-askadd]')){ b.ask.push(''); save(); render(); return; }
  const ad = el.closest('[data-askdel]'); if (ad){ b.ask.splice(+ad.dataset.askdel, 1); save(); render(); return; }
});
document.addEventListener('change', e => {
  const el = e.target; const b = board();
  if (el.id === 'bellWho'){ S.bellWho = el.value; openBell(); return; }
  if (el.dataset.done){ const [sc, pid, tid] = el.dataset.done.split('|'); const t = listOf(b, sc, pid).todo.find(x => x.id === tid); t.done = el.checked; save(); render(); return; }
  if (el.dataset.fact){ const [w, k] = el.dataset.fact.split('|'); b.content.facts[w] = { ...(b.content.facts[w] || {}), [k]:Math.max(0, +el.value || 0) }; save(); render(); return; }
  if (el.dataset.rtitle !== undefined){ const r = b.content.reels.find(x => x.id === el.dataset.rtitle); r.title = el.value.trim(); save(); return; }
  if (el.matches('[data-cstart]') && el.value){ b.content.start = monday(el.value); S.wk = ''; save(); render(); return; }
  if (el.matches('[data-cweeks]')){ b.content.weeks = Math.max(1, Math.min(12, +el.value || 4)); save(); render(); return; }
  if (el.dataset.scontent){ b.stages.forEach(s => { s.content = s.id === el.dataset.scontent && el.checked; }); save(); render(); return; }
  // поля в режиме редактирования
  if (el.dataset.bf){ b[el.dataset.bf] = el.value.trim(); if (el.dataset.bf === 'title') render(); save(); return; }
  if (el.dataset.sf){ const [sid, f] = el.dataset.sf.split('|'); b.stages.find(x => x.id === sid)[f] = el.value.trim(); save(); return; }
  if (el.dataset.pf){ const [pid, f] = el.dataset.pf.split('|'); b.side.find(x => x.id === pid)[f] = el.value.trim(); save(); return; }
  if (el.dataset.have){ const [sid, k] = el.dataset.have.split('|'); b.stages.find(x => x.id === sid).have[+k] = el.value.trim(); save(); return; }
  if (el.dataset.ask !== undefined){ b.ask[+el.dataset.ask] = el.value.trim(); save(); return; }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'reelAdd') return; e.preventDefault(); const f = e.target.elements; const b = board();
  const date = f.namedItem('date').value; if (!date){ toast('Укажите дату'); return; }
  b.content.reels.push({ id:uid(), title:f.namedItem('title').value.trim(), date, who:f.namedItem('who').value.trim(), st:'plan', pubAt:null });
  if (!inWeek(date, S.wk)) S.wk = monday(date) >= b.content.start ? weekStarts(b.content).find(w => inWeek(date, w)) || S.wk : S.wk;
  save(); render(); setTimeout(() => $('#reelAdd [name=title]')?.focus(), 0);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ $('#layer').innerHTML = ''; closeBell(); } });
window.kzLaunch = { S, board, seedIgor, weekStats, alerts, save, render };
boot();
})();
</script>
</body>
</html>
