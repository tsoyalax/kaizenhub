async function openProfile(first){
  // профиль хранится в аккаунте (его видят коллеги) и дублируется в вашей команде
  const me = userById(ME) || { id:ME };
  const acc = cloud.user ? await cloud.user.me().catch(() => null) : null;
  if (acc && GUEST) ui.meAcc = acc;
  const v = { name:(GUEST ? acc?.name : me.name) || acc?.name || '', email:acc?.email || me.email || '',
    title:(GUEST ? acc?.title : me.title) || acc?.title || '', contact:(GUEST ? acc?.contact : me.contact) || acc?.contact || '', avatar:acc?.avatar || me.avatar || '' };
  layer.innerHTML = `<div class="backdrop" ${first ? '' : 'data-close'}></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">${first ? 'Добро пожаловать в Конвейер' : 'Ваш профиль'}</h2>
    ${first ? '<p class="lead">Сначала представьтесь. Коллег пригласите позже во вкладке «Команда».</p>' : ''}
    <div class="prof-head">${avHtml({ name:v.name || v.email, avatar:v.avatar }, 'av av-lg')}<div><b>${esc(v.name || 'Без имени')}</b>
      <small>${acc ? (v.avatar ? 'Фото из аккаунта Google' : 'Фото появится, если входить через Google') : 'Войдите в аккаунт, чтобы коллеги видели ваш профиль'}</small></div></div>
    <form class="form" id="mForm" novalidate>
      <div class="field"><label for="mName">Имя и фамилия</label><input id="mName" value="${esc(v.name)}" autocomplete="name" maxlength="120"></div>
      <div class="field"><label for="mEmail">${acc ? 'Почта аккаунта' : 'Рабочий email'}</label><input id="mEmail" type="email" value="${esc(v.email)}" autocomplete="email" ${acc ? 'readonly' : ''}></div>
      <div class="two">
        <div class="field"><label for="mTitle2">Должность</label><input id="mTitle2" value="${esc(v.title)}" placeholder="Например, дизайнер" maxlength="120"></div>
        <div class="field"><label for="mContact">Telegram или телефон</label><input id="mContact" value="${esc(v.contact)}" placeholder="@username" maxlength="200"></div>
      </div>
      <p class="hint" style="margin:0">Имя, фото, должность и контакт видят коллеги по проектам и команде.</p>
      ${first ? `<label class="check"><input type="checkbox" id="mDemo" checked> Показать демо-проекты, чтобы посмотреть, как всё работает. Их можно удалить в любой момент.</label>` : ''}
      <div class="err" id="mErr"></div>
      <div class="actions">${!first && window.kzSignOut ? '<button type="button" class="ghost danger m-out" id="mOut">Выйти из аккаунта</button>' : ''}${first ? '' : '<button type="button" class="ghost" data-close>Отмена</button>'}<button class="primary" id="mSave">${first ? 'Начать работу' : 'Сохранить'}</button></div>
    </form></div>`;
  $('#mName').focus();
  $('#mForm').onsubmit = async e => {
    e.preventDefault();
    const f = { name:$('#mName').value.trim(), title:$('#mTitle2').value.trim(), contact:$('#mContact').value.trim() };
    if (!f.name) return $('#mErr').textContent = 'Укажите имя';
    $('#mSave').disabled = true;
    if (acc){
      try { await cloud.user.updateProfile(f); if (GUEST) ui.meAcc = { ...acc, ...f }; }
      catch(err) { $('#mSave').disabled = false; return $('#mErr').textContent = 'Не удалось сохранить профиль. Проверьте связь и попробуйте ещё раз.'; }
    }
    if (!GUEST){
      Object.assign(me, { name:f.name, title:f.title, contact:f.contact, email:acc ? acc.email : $('#mEmail').value.trim() });
      if (acc?.avatar) me.avatar = acc.avatar;
      if (first){ if (!$('#mDemo').checked) db.projects = db.projects.filter(p => !p.demo); db.onboarded = true; }
    }
    layer.innerHTML = ''; commit(); if (!first) toast('Профиль сохранён');
  };
}

function renderDrawer(){

        <div><label for="st-${s.id}">Статус</label><select id="st-${s.id}" data-sstatus="${s.id}">${Object.entries(STATUS).map(([k,v]) => `<option value="${k}" ${s.status===k?'selected':''}>${v}</option>`).join('')}</select></div>

      </div>${isMaint(s) ? '' : execFlags(p, s)}` : ''}</li>`;

      <section class="d-box"><h3>Команда</h3><div class="d-g">

// записать карточки черновика в db.cardTpls и убрать карточки удалённых подэтапов этого шаблона
function storeCards(d){
  db.cardTpls = db.cardTpls || {};
  const keep = new Set(); const changed = [];
  d.stages.forEach(st => (st.subs || []).forEach(x => {
    const k = cardKey(d.id, x.name); keep.add(k);
    const was = db.cardTpls[k]; const sig = c => c ? JSON.stringify([c.d || '', c.reg || '', c.vid || '', c.c || [], c.b || []]) : '';
    if (cardHas(x.card)){
      const nc = { sub:x.name, d:x.card.d || '', reg:x.card.reg || '', vid:x.card.vid || '', c:[...(x.card.c || [])], b:cleanBlocks(x.card.b), at:new Date().toISOString() };
      if (sig(was) !== sig(nc)) changed.push({ sub:x.name, card:nc });
      db.cardTpls[k] = nc;
    } else delete db.cardTpls[k];
  }));
  Object.keys(db.cardTpls).forEach(k => { if (k.startsWith(d.id + '|') && !keep.has(k)) delete db.cardTpls[k]; });
  return changed;
}
// скопировать в проект карточки подэтапов из его шаблона (только тем подэтапам, у которых карточки ещё нет)
function copyCards(p){
  if (!p || p._ext) return 0;
  const T = db.cardTpls || {}; let n = 0;
  p.stages.forEach(st => (st.subs || []).forEach(x => {
    const c = T[cardKey(p.template_id, x.name)];
    if (!cardHas(c) || taskFor(p.id, st.id, x.id)) return;
    const t = makeTask({ project_id:p.id, stage_id:st.id, substage_id:x.id, title:x.name, description:c.d || '', assignee_id:null, checklist:c.c || [] });
    t.regulation_link = c.reg || ''; t.video_url = c.vid || ''; t.blocks = clone(c.b || []);
    if (x.done) t.checklist.forEach(it => { it.done = true; it.completed_at = new Date().toISOString(); it.completed_by = meName(); });
    syncTaskToSub(t); db.tasks.push(t); n++;
  }));
  return n;
}
// Карточка шаблона изменилась — обновляем эту карточку во всех активных проектах процесса.
//  Описание, регламент и видео заменяются. Чек-лист выстраивается по шаблону, отмеченные пункты остаются отмеченными
//  (отмеченные пункты, которых нет в шаблоне, не теряются). Сданные этапы и полностью выполненные чек-листы не открываются заново.
function syncCardToProjects(tplId, subName, c, skipTaskId){
  if (!tplId || !c) return 0;
  let n = 0;
  // все проекты этого шаблона, кроме архива; в сданных этапах и завершённых проектах обновляются только описание, ссылки и видео
  db.projects.filter(p => p.template_id === tplId && p.state !== 'archived' && !p._ext).forEach(p => p.stages.forEach(st => {
    const closed = st.status === 'done' || p.state === 'completed';
    (st.subs || []).forEach(x => {
      if (norm(x.name) !== norm(subName)) return;
      let t = taskFor(p.id, st.id, x.id);
      if (t && t.id === skipTaskId) return;
      if (!t){
        if (!cardHas(c) || closed) return;
        t = makeTask({ project_id:p.id, stage_id:st.id, substage_id:x.id, title:x.name, description:c.d || '', assignee_id:null, checklist:c.c || [] });
        t.regulation_link = c.reg || ''; t.video_url = c.vid || ''; t.blocks = clone(c.b || []);
        if (x.done) t.checklist.forEach(it => { it.done = true; it.completed_at = new Date().toISOString(); it.completed_by = meName(); });
        db.tasks.push(t); syncTaskToSub(t); n++; addLog(p, `Карточка «${x.name}» создана по шаблону`); return;
      }
      const sig = () => JSON.stringify([t.description, t.regulation_link, t.video_url, t.checklist.map(i => [i.text, i.done]), t.blocks || []]);
      const before = sig();
      t.description = c.d || ''; t.regulation_link = c.reg || ''; t.video_url = c.vid || ''; t.blocks = clone(c.b || []);
      if (!closed && !taskProgress(t).done){
        const byText = new Map(t.checklist.map(i => [norm(i.text), i]));
        const next = (c.c || []).map((txt, k) => { const o = byText.get(norm(txt)); if (o){ byText.delete(norm(txt)); return { ...o, text:txt, position:k }; }
          return { id:uid(), text:txt, done:false, position:k, completed_at:null, completed_by:null }; });
        byText.forEach(o => { if (o.done) next.push({ ...o, position:next.length }); });
        t.checklist = next; syncTaskToSub(t);
      }
      if (sig() !== before){ n++; addLog(p, `Карточка «${x.name}» обновлена по шаблону`); }
    });
  }));
  return n;
}
// обновить активные проекты шаблона: недостающие подэтапы и карточки (уже заполненные карточки не трогаем)
// =====================================================================
//  СИНХРОНИЗАЦИЯ ШАБЛОНА С ПРОЕКТАМИ
//  Этап проекта помнит этап шаблона (s.tsid), подэтап — подэтап шаблона (x.tsub). По этой связи в идущих проектах:
//  • переименование этапа/подэтапа в шаблоне переименовывает его (отметки и карточки сохраняются);
//  • новый этап шаблона встаёт на своё место, если проект ещё не прошёл это место; новые подэтапы добавляются;
//  • удалённый из шаблона этап/подэтап убирается, если в нём ничего не начато и не отмечено, иначе остаётся «своим»;
//  • пустые не начатые этапы вне шаблона (без подэтапов и карточек) убираются;
//  • этап шаблона, который удалили в проекте вручную, обратно не добавляется (p.tplSkip).
//  Завершённые и архивные проекты не меняются.
// =====================================================================
function ensureTplIds(){
  let n = 0;
  (db.templates || []).forEach(t => t.stages.forEach(st => { if (!st.id){ st.id = uid(); n++; } (st.subs || []).forEach(x => { if (!x.id){ x.id = uid(); n++; } }); }));
  return n;
}
const ptasks = p => (p._ext ? ext.tasks : (db.tasks || [])).filter(t => t.project_id === p.id);
const taskBusy = t => !!t && (t.checklist.some(i => i.done) || !!t.result_link || !!(t.mats || []).length);
function linkToTemplate(p, tpl){
  // этапы: живая связь, иначе — по названию (первый свободный этап шаблона)
  const used = new Set();
  p.stages.forEach(s => { if (s.tsid && tpl.stages.some(t => t.id === s.tsid) && !used.has(s.tsid)) used.add(s.tsid); else if (s.tsid) s._lost = true; });
  p.stages.forEach(s => {
    if (s.tsid && !s._lost) return;
    if (s.custom && !s.tsid) return;
    const t = tpl.stages.find(x => !used.has(x.id) && norm(x.name) === norm(s.name));
    if (t){ s.tsid = t.id; used.add(t.id); delete s._lost; }
  });
  // этап шаблона без пары — связываем по месту: несвязанный этап проекта между теми же соседями (переименовали вручную)
  tpl.stages.forEach((t, ti) => {
    if (used.has(t.id)) return;
    let lo = -1, hi = p.stages.length;
    for (let k = ti - 1; k >= 0; k--){ const j = p.stages.findIndex(st => st.tsid === tpl.stages[k].id && !st._lost); if (j >= 0){ lo = j; break; } }
    for (let k = ti + 1; k < tpl.stages.length; k++){ const j = p.stages.findIndex(st => st.tsid === tpl.stages[k].id && !st._lost); if (j >= 0){ hi = j; break; } }
    const c = p.stages.slice(lo + 1, hi).find(st => (!st.tsid || st._lost) && !st.custom && (st.subs || []).length);
    if (c){ c.tsid = t.id; used.add(t.id); delete c._lost; }
  });
  // подэтапы внутри связанных этапов
  p.stages.forEach(s => {
    const t = tpl.stages.find(x => x.id === s.tsid); if (!t || s._lost) return;
    const u = new Set();
    (s.subs || []).forEach(x => { if (x.tsub && (t.subs || []).some(y => y.id === x.tsub) && !u.has(x.tsub)) u.add(x.tsub); else if (x.tsub) x._lost = true; });
    (s.subs || []).forEach(x => {
      if (x.tsub && !x._lost) return;
      const ts = (t.subs || []).find(y => !u.has(y.id) && norm(y.name) === norm(x.name));
      if (ts){ x.tsub = ts.id; u.add(ts.id); delete x._lost; }
    });
  });
}
function syncProjectWithTemplate(p, tpl){
  if (!p || !tpl || p._ext || p.state !== 'active') return 0;
  const before = JSON.stringify([p.stages, ptasks(p).map(t => [t.id, t.title])]);
  linkToTemplate(p, tpl);
  const T = id => tpl.stages.find(t => t.id === id);
  const skip = new Set(p.tplSkip || []);
  const removeTasks = (pred) => { const ids = new Set(ptasks(p).filter(pred).map(t => t.id)); if (ids.size) db.tasks = db.tasks.filter(t => !ids.has(t.id)); };
  // 1) этапы: переименование, согласование, подэтапы
  p.stages.forEach(s => {
    const t = T(s.tsid); if (!t || s._lost) return;
    if (s.name !== t.name){ addLog(p, `Этап «${s.name}» переименован в «${t.name}» по шаблону`); s.name = t.name; }
    s.approval = !!t.approval; s.gate = !!t.gate || !!s.gateOwn;
    const old = s.subs || []; const next = [];
    (t.subs || []).forEach(ts => {
      let x = old.find(y => y.tsub === ts.id && !y._lost);
      if (x){
        if (x.name !== ts.name){ const tk = ptasks(p).find(k => k.stage_id === s.id && k.substage_id === x.id); if (tk && norm(tk.title) === norm(x.name)) tk.title = ts.name; x.name = ts.name; }
        x.files = !!ts.files || !!x.filesOwn;
        next.push(x);
      } else next.push({ id:uid(), name:ts.name, done:s.status === 'done', tsub:ts.id, files:!!ts.files });
    });
    old.forEach((x, i) => {
      if (next.includes(x)) return;
      if (x.tsub){                                                 // подэтап убрали из шаблона
        const tk = ptasks(p).find(k => k.stage_id === s.id && k.substage_id === x.id);
        if (!x.done && !taskBusy(tk)){ if (tk) removeTasks(k => k.id === tk.id); addLog(p, `Подэтап «${x.name}» убран по шаблону`); return; }
        delete x.tsub;                                              // в нём уже есть работа — остаётся своим
      }
      next.splice(Math.min(i, next.length), 0, x);
    });
    old.forEach(x => delete x._lost);
    s.subs = next;
  });
  // 2) этапы, которых больше нет в шаблоне, и пустые этапы вне шаблона
  const busy = st => st.status !== 'not_started' || (st.subs || []).some(x => x.done) || ptasks(p).some(k => k.stage_id === st.id && taskBusy(k));
  const keep = p.stages.filter(st => {
    if (p.stages.length < 2) return true;
    if (st.tsid && (st._lost || !T(st.tsid))){
      if (!busy(st)){ removeTasks(k => k.stage_id === st.id); addLog(p, `Этап «${st.name}» убран по шаблону`); return false; }
      delete st.tsid; delete st._lost; st.custom = true; return true;
    }
    if (!st.tsid && !st.custom && st.status === 'not_started' && !(st.subs || []).length && !ptasks(p).some(k => k.stage_id === st.id)){
      addLog(p, `Пустой этап «${st.name}» вне шаблона убран`); return false;
    }
    return true;
  });
  if (keep.length) p.stages = keep;
  // 3) новые этапы шаблона — на своё место, если проект ещё не прошёл его
  tpl.stages.forEach((t, ti) => {
    if (p.stages.some(st => st.tsid === t.id) || skip.has(t.id)) return;
    let idx = 0;
    for (let k = ti - 1; k >= 0; k--){ const j = p.stages.findIndex(st => st.tsid === tpl.stages[k].id); if (j >= 0){ idx = j + 1; break; } }
    if (p.stages.slice(idx).some(st => st.status !== 'not_started') && idx < p.stages.length) return;
    if (idx >= p.stages.length && p.state !== 'active') return;
    const prev = p.stages[idx - 1]; const start = prev ? prev.due_date : p.start_date; const n = stageDaysFor(t);
    p.stages.splice(idx, 0, { id:uid(), position:idx, name:t.name, days:n, approval:!!t.approval, gate:!!t.gate, assignee_id:null, status:'not_started',
      planned_start:start, due_date:addDays(start, n), started_at:null, completed_at:null, tsid:t.id,
      subs:(t.subs || []).map(ts => ({ id:uid(), name:ts.name, done:false, tsub:ts.id, files:!!ts.files })) });
    addLog(p, `Добавлен этап «${t.name}» по шаблону`);
  });
  p.stages.forEach(st => delete st._lost);
  const changed = JSON.stringify([p.stages, ptasks(p).map(t => [t.id, t.title])]) !== before;
  if (changed){ normalizeChain(p); ensureActive(p); syncState(p); }
  const cards = copyCards(p);
  return changed || cards ? 1 : 0;
}
// все свои проекты по всем шаблонам; вызывается при загрузке и при сохранении шаблона
function syncAllTemplates(tplId){
  if (GUEST) return 0;
  ensureTplIds();
  let n = 0;
  db.projects.forEach(p => { if (!tplId || p.template_id === tplId) n += syncProjectWithTemplate(p, tplById(p.template_id)); });
  return n;
}
function applyTplToProjects(t){
  let subs = 0, cards = 0, projs = 0;
  activeOf(t.id).forEach(p => {
    let ch = false;
    t.stages.forEach(ts => { const s = stageByName(p, ts.name); if (!s) return;
      const before = (s.subs || []).length; s.subs = mergeSubs(s.subs, ts.subs || [], s.status === 'done', true);
      const extra = (s.subs.length > before) ? s.subs.length - before : 0; subs += extra; if (extra) ch = true; });
    const k = copyCards(p); cards += k; if (k) ch = true;
    if (ch){ projs++; addLog(p, `Обновлено по шаблону «${t.name}»`); }
  });
  return { subs, cards, projs };
}

const tdrag = { kind:null, i:-1, j:-1, row:null, spot:null };
function dropSpot(e){
  const under = (typeof document.elementFromPoint === 'function' && document.elementFromPoint(e.clientX, e.clientY)) || e.target;
  const z = under?.closest?.(`[data-dz="${tdrag.kind}"]`); if (!z) return null;
  if (tdrag.kind === 'sub' && +z.dataset.i !== tdrag.i) return null;   // подэтапы переставляем внутри своего этапа
  const box = tdrag.kind === 'stage' ? z.querySelector('.trow') : z; const r = box.getBoundingClientRect();
  const after = e.clientY > r.top + r.height / 2; const idx = +(tdrag.kind === 'stage' ? z.dataset.i : z.dataset.j);
  return { box, to: after ? idx + 1 : idx, after };
}
const clearDrop = () => document.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
document.addEventListener('pointerdown', e => {

  tdrag.row = g.closest(tdrag.kind === 'stage' ? '.tstage' : '.tsub'); tdrag.row.classList.add('dragging'); document.body.classList.add('is-sorting');
  try { g.setPointerCapture?.(e.pointerId); } catch(x) {}
});

});
function endSort(apply){
  if (!tdrag.kind) return;
  const sp = tdrag.spot; clearDrop(); tdrag.row?.classList.remove('dragging'); document.body.classList.remove('is-sorting');
  const kind = tdrag.kind; tdrag.kind = null;

// ---------- Подтверждение (вместо window.confirm, который блокируется на опубликованной странице) ----------
function askConfirm({ title, text, ok, danger = true }){
  return new Promise(resolve => {
    const box = $('#confirmBox');
    box.innerHTML = `<div class="cfm-back"></div>
      <div class="modal cfm" role="alertdialog" aria-modal="true" aria-labelledby="cfmT" aria-describedby="cfmD">
        <h2 id="cfmT">${esc(title)}</h2><p class="lead" id="cfmD">${esc(text)}</p>
        <div class="actions"><button class="ghost" id="cfmNo">Отмена</button><button class="primary${danger ? ' btn-danger' : ''}" id="cfmOk">${esc(ok)}</button></div>
      </div>`;
    const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); e.preventDefault(); done(false); } };
    const done = v => { document.removeEventListener('keydown', onKey, true); box.innerHTML = ''; resolve(v); };
    document.addEventListener('keydown', onKey, true);
    box.querySelector('#cfmNo').onclick = () => done(false);
    box.querySelector('.cfm-back').onclick = () => done(false);
    box.querySelector('#cfmOk').onclick = () => done(true);
    box.querySelector('#cfmNo').focus();
  });
}

}

// ---------- разбор чисел, дат, таблиц ----------
function parseNum(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).replace(/[\s\u00a0\u202f]/g, '').replace(/[^\d,.\-]/g, '');
  if (!s || s === '-') return null;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc > -1) s = /,\d{1,2}$/.test(s) ? s.replace(',', '.') : s.replace(/,/g, '');
  const n = parseFloat(s); return isFinite(n) ? n : null;
}
function parseDateAny(v){
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return iso(v);
  if (typeof v === 'number' && v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 864e5)); return iso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if ((m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})/))) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  return null;
}
async function readTable(file){
  await loadScript(XLSX_URL);
  const buf = await file.arrayBuffer(); let wb;
  if (/\.(csv|txt)$/i.test(file.name)){
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('\uFFFD')) text = new TextDecoder('windows-1251').decode(buf);   // выгрузки из 1С и Битрикс24
    const first = text.split(/\r?\n/)[0] || '';
    const FS = [';', '\t', ','].sort((a,b) => first.split(b).length - first.split(a).length)[0];
    wb = XLSX.read(text, { type:'string', FS, raw:true });
  } else wb = XLSX.read(buf, { type:'array', cellDates:true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:true, blankrows:false });
  // строка заголовков — первая, где хотя бы две ячейки с текстом
  const hi = Math.max(0, aoa.findIndex(r => r.filter(c => typeof c === 'string' && c.trim()).length >= 2));
  const headers = (aoa[hi] || []).map((h,i) => String(h || '').trim() || `Колонка ${i+1}`);
  const rows = aoa.slice(hi + 1).filter(r => r.some(c => c !== '' && c != null)).map(r => r.map(c => c instanceof Date ? iso(c) : c));
  return { headers, rows };
}

const CHANNELS = [
  [/(facebook|\bfb\b|meta|instagram|insta|инстаграм|фейсбук)/i,'Facebook / Instagram'],
  [/(google|adwords|gads|youtube|гугл)/i,'Google Ads'],

];
function canonChannel(s){
  const t = String(s ?? '').trim();
  if (!t) return 'Без источника';
  for (const [re, n] of CHANNELS) if (re.test(t)) return n;
  return t.length > 40 ? t.slice(0, 40) + '…' : t;

// ---------- расчёт ----------
const ratio = (a, b) => b ? a / b : null;
function crmRows(rep){
  const c = rep.crm; if (!c) return [];
  const { date, amount, status, source } = c.map;
  const won = new Set(c.won || []);
  return c.raw.map(r => {
    const st = status != null ? String(r[status] ?? '').trim() : '';
    const a = amount != null ? (parseNum(r[amount]) || 0) : 0;
    return { d: date != null ? parseDateAny(r[date]) : null, a, src: source != null ? r[source] : '', won: status != null ? won.has(st) : a > 0 };
  }).filter(r => (!rep.from || !r.d || r.d >= rep.from) && (!rep.to || !r.d || r.d <= rep.to));
}
// отчёт из старой версии или импорта может быть неполным — достраиваем пустые части
function fixReport(r){ if (!r) return r; r.spend = Array.isArray(r.spend) ? r.spend : []; r.imports = Array.isArray(r.imports) ? r.imports : [];
  if (r.crm && (!r.crm.map || !Array.isArray(r.crm.raw))) r.crm = null; return r; }
function computeReport(rep){
  fixReport(rep);
  const margin = (rep.margin ?? 100) / 100;
  const rows = crmRows(rep);
  const bySrc = rep.crm?.map?.source != null;
  const map = new Map();
  const ch = k => { if (!map.has(k)) map.set(k, { name:k, spend:0, impressions:0, clicks:0, adLeads:0, leads:0, sales:0, revenue:0 }); return map.get(k); };
  rows.forEach(r => { if (!bySrc) return; const c = ch(canonChannel(r.src)); c.leads++; if (r.won){ c.sales++; c.revenue += r.a; } });
  (rep.spend || []).forEach(e => {
    const c = ch(canonChannel(e.source || e.campaign));
    c.spend += +e.spend || 0; c.impressions += +e.impressions || 0; c.clicks += +e.clicks || 0; c.adLeads += +e.leads || 0;
  });
  const won = rows.filter(r => r.won);
  const T = { spend:0, impressions:0, clicks:0, adLeads:0, leads:rows.length, sales:won.length, revenue:won.reduce((m,r) => m + r.a, 0) };
  rep.spend.forEach(e => { T.spend += +e.spend || 0; T.impressions += +e.impressions || 0; T.clicks += +e.clicks || 0; T.adLeads += +e.leads || 0; });
  const hasCrm = !!rep.crm;
  const kpi = (c, withRevenue) => ({
    romi: withRevenue && c.spend ? (c.revenue * margin - c.spend) / c.spend : null,
    roas: withRevenue ? ratio(c.revenue, c.spend) : null,
    cpl: c.spend ? ratio(c.spend, (hasCrm && (withRevenue || c.leads)) ? c.leads : c.adLeads) : null,
    cpa: withRevenue && c.spend ? ratio(c.spend, c.sales) : null,
    cr: withRevenue ? ratio(c.sales, c.leads) : null,
    ctr: ratio(c.clicks, c.impressions), crClick: ratio(c.leads || c.adLeads, c.clicks), aov: withRevenue ? ratio(c.revenue, c.sales) : null
  });
  const channels = [...map.values()].map(c => ({ ...c, ...kpi(c, bySrc), revenue: bySrc ? c.revenue : null, sales: bySrc ? c.sales : null }))
    .sort((a,b) => (b.spend + (b.revenue || 0)) - (a.spend + (a.revenue || 0)));
  const notices = [];
  if (hasCrm && !bySrc) notices.push('В выгрузке CRM не выбрана колонка источника: выручка посчитана общей суммой, ROMI по каналам недоступен.');
  if (bySrc) channels.forEach(c => {
    if (c.spend > 0 && c.leads === 0) notices.push(`«${c.name}»: есть расход, но нет лидов в CRM. Проверьте UTM-метки и названия источников.`);
    if (c.spend === 0 && c.leads > 0) notices.push(`«${c.name}»: ${c.leads} ${plural(c.leads,'лид','лида','лидов')} без расходов — органика или неучтённая реклама.`);
  });
  const undated = rep.crm?.map?.date != null ? rows.filter(r => !r.d).length : 0;
  if (undated) notices.push(`${undated} ${plural(undated,'строка','строки','строк')} CRM без даты: включены без фильтра по периоду.`);
  return { totals:{ ...T, ...kpi(T, hasCrm) }, channels, notices, hasCrm, hasSpend: rep.spend.length > 0, bySrc };
}

const CUR = ['₽', '$', '€', '₸'];
const money2 = (n, cur) => n == null ? '—' : `${Math.round(n).toLocaleString('ru-RU')} ${cur}`;
const money1 = (n, cur) => n == null ? '—' : `${n < 100 ? n.toLocaleString('ru-RU',{maximumFractionDigits:1}) : Math.round(n).toLocaleString('ru-RU')} ${cur}`;

function mdLite(text){
  const out = []; let list = false;
  String(text || '').split('\n').forEach(line => {
    const l = line.trim().replace(/\*\*/g, '');
    if (/^[-•*]\s+/.test(l)){ if (!list){ out.push('<ul>'); list = true; } out.push(`<li>${esc(l.replace(/^[-•*]\s+/, ''))}</li>`); return; }
    if (list){ out.push('</ul>'); list = false; }
    if (/^#{1,4}\s+/.test(l)) out.push(`<h4>${esc(l.replace(/^#{1,4}\s+/, ''))}</h4>`);
    else if (l) out.push(`<p>${esc(l)}</p>`);
  });
  if (list) out.push('</ul>');
  return out.join('');
}

// ---------- графики (SVG, цвета из темы через CSS-классы) ----------
const cut = (s, n = 20) => s.length > n ? s.slice(0, n) + '…' : s;
function chartSpendRevenue(chs, cur){

  }).join('');

    <svg viewBox="0 0 ${W} ${list.length * rowH + 14}" role="img" aria-label="Расход и выручка по каналам">${bars}</svg></figure>`;

function chartRomi(chs){

  if (!list.length) return '';
  const max = Math.max(...list.map(c => Math.abs(c.romi))) || 1; const neg = list.some(c => c.romi < 0);
  const rowH = 32, W = 640, L = 180, R = 70, bw = W - L - R, zero = neg ? L + bw / 2 : L, span = neg ? bw / 2 - 40 : bw;

}
function chartFunnel(t){
  const steps = [['Показы', t.impressions], ['Клики', t.clicks], ['Лиды', t.leads || t.adLeads], ['Продажи', t.sales]].filter(s => s[1] > 0);
  if (steps.length < 2) return '';
  const max = Math.log10(steps[0][1] + 1);
  const W = 640, rowH = 42;
  const rows = steps.map(([n, v], i) => {
    const w = Math.max(220, Math.log10(v + 1) / max * (W - 20)); const x = (W - w) / 2; const y = 6 + i * rowH;
    const k = i ? v / steps[i-1][1] : null;
    return `<rect x="${x}" y="${y}" width="${w}" height="30" rx="7" class="ch-fn${i}"/>
      <text x="${W/2}" y="${y + 19}" text-anchor="middle" class="ch-fnt${i}${i < 2 ? ' inv' : ''}">${n}: ${nf(v)}${k != null ? `, ${pctf(k, k < 0.1 ? 1 : 0)} от предыдущего` : ''}</text>`;

function autoAttach(rep, hints){
  if (rep.project_id) return;
  const hay = norm(hints.join(' '));
  const cand = db.projects.filter(p => p.state !== 'archived')
    .map(p => ({ p, score: (hay.includes(norm(p.name)) ? 2 : 0) + (p.client && hay.includes(norm(p.client)) ? 1 : 0) }))
    .filter(x => x.score).sort((a,b) => b.score - a.score)[0];
  if (cand){ rep.project_id = cand.p.id; addLog(cand.p, `AI-отчёт «${rep.title}» привязан к проекту автоматически`); toast(`Отчёт привязан к проекту «${cand.p.name}»`); }
}
function setCrm(rep, file, table){

}
function refreshStatuses(rep, autoWon){
  const c = rep.crm; if (!c) return;
  if (c.map.status == null){ c.statuses = []; return; }
  const counts = new Map();
  c.raw.forEach(r => { const s = String(r[c.map.status] ?? '').trim(); if (s) counts.set(s, (counts.get(s) || 0) + 1); });
  c.statuses = [...counts].sort((a,b) => b[1] - a[1]).slice(0, 40).map(([name, count]) => ({ name, count }));
  if (autoWon) c.won = c.statuses.filter(s => WON_RE.test(s.name) && !LOST_RE.test(s.name)).map(s => s.name);
}

const SHOT_PROMPT = platform => `На изображениях — скриншоты рекламного кабинета${platform ? ` (${platform})` : ' (Facebook Ads, Google Ads, Яндекс Директ, VK Реклама или другого)'}: таблица кампаний, групп или объявлений с расходами и показателями.
Извлеки строки таблицы. Верни ТОЛЬКО JSON без пояснений и без markdown:
{"platform":"Facebook Ads | Google Ads | Яндекс Директ | VK Реклама | TikTok Ads | другое название","currency":"RUB | USD | EUR | KZT | …","period":"период отчёта, если виден, иначе пустая строка","rows":[{"campaign":"название","spend":число,"impressions":число или null,"clicks":число или null,"leads":число или null}],"total_spend":число или null,"warnings":["что не удалось прочитать или в чём есть сомнение"]}
Правила: числа без пробелов, символов валют и разделителей тысяч, десятичная часть через точку; «1,2 тыс.» = 1200, «1,2 млн» = 1200000. Строку «Итого / Total / Всего» не включай в rows — её расход положи в total_spend. leads — колонка «Результаты», «Лиды», «Конверсии» или «Conversions»; если её нет — null. Не придумывай значения, которых не видно на изображении. Если одна и та же строка видна на нескольких скриншотах — включи её один раз.`;
async function recognizeShots(rep, files, platform){
  const sample = await getSample();
  if (!sample) throw { code:'images_unavailable' };
  const lim = await sample.limits().catch(() => null);
  if (!lim?.images) throw { code:'images_unavailable' };
  const imgs = [...files].filter(f => lim.images.mediaTypes.includes(f.type)).slice(0, lim.images.maxCount);
  if (!imgs.length) throw { code:'image_rejected' };
  const res = await sample.json(SHOT_PROMPT(platform), { images:imgs, modelTier:'default', cache:false });
  const rows = (res?.rows || []).filter(x => x && (x.campaign || parseNum(x.spend) != null));
  if (!rows.length) throw { message:'На скриншоте не нашлось строк с расходами. Пришлите таблицу кампаний крупнее.' };
  const curMap = { RUB:'₽', USD:'$', EUR:'€', KZT:'₸' };
  const sum = rows.reduce((m,x) => m + (parseNum(x.spend) || 0), 0);
  const total = parseNum(res.total_spend);
  const warnings = [...(res.warnings || [])].filter(Boolean).map(String);
  if (total && Math.abs(sum - total) / total > 0.01)
    warnings.push(`Сумма строк (${nf(sum)}) не совпадает с итогом кабинета (${nf(total)}): часть строк могла не попасть на скриншот.`);
  return addSpendRows(rep, rows.map(x => ({ ...x, source: res.platform || platform })),
    { type:'image', name:[...files].map(f => f.name).join(', '), platform: res.platform || platform, currency: curMap[res.currency] || res.currency || '', warnings, total });
}

function fillDemo(rep){

  const srcs = [['facebook / cpc', 0.38, 0.12, 52000], ['google / cpc', 0.27, 0.17, 61000], ['yandex / cpc', 0.25, 0.07, 47000], ['organic', 0.10, 0.2, 55000]];

  const rows = [];
  for (let i = 0; i < 240; i++){
    let k = rnd(), s = srcs.at(-1); for (const t of srcs){ if (k < t[1]){ s = t; break; } k -= t[1]; }
    const won = rnd() < s[2], lost = !won && rnd() < 0.6;
    rows.push([addDays(from, Math.floor(rnd() * 30)), `Заявка ${1000 + i}`, won ? 'Успешно реализовано' : lost ? 'Закрыто и не реализовано' : 'Переговоры',

async function handleFile(input){
  const rep = repById(ui.repId); const files = input.files; const file = files?.[0]; if (!rep || !file) return;
  if (input.id === 'shotFile'){
    ui.repBusy = { ...(ui.repBusy || {}), shots:true }; ui.shotErr = ''; render();
    try {
      const n0 = rep.spend.length;
      await recognizeShots(rep, files, ui.shotPlatform || '');
      touch(rep); toast(`Распознано строк: ${rep.spend.length - n0}. Сверьте цифры в таблице.`);
    } catch(e) { ui.shotErr = sampleErr(e); }
    ui.repBusy.shots = false; commit(); return;
  }
  try {
    if (input.id === 'crmFile'){ ui.repBusy = { ...(ui.repBusy || {}), crm:'Читаю файл…' }; render(); }
    const table = await readTable(file);
    if (!table.rows.length) throw new Error('В файле не нашлось строк с данными');
    if (input.id === 'crmFile'){ setCrm(rep, file, table); toast(`Загружено строк: ${table.rows.length}`); }
    else {
      const map = {}; SPEND_FIELDS.forEach(([k,, re]) => map[k] = detectCol(table.headers, re));
      if (map.spend == null) throw new Error('Не нашлась колонка с расходом. Назовите её «Расход» или «Spend».');
      const guess = canonChannel(file.name);
      const plat = guess !== cut(file.name.trim(), 40) ? guess : (ui.shotPlatform || '');
      const rows = table.rows.map(r => Object.fromEntries(SPEND_FIELDS.map(([k]) => [k, map[k] != null ? r[map[k]] : null])))
        .filter(x => parseNum(x.spend) != null && !/^(итого|всего|total)/i.test(String(x.campaign || '')));
      addSpendRows(rep, rows, { type:'file', name:file.name, platform:plat });
      toast(`Импортировано строк расходов: ${rows.length}`);
    }
    touch(rep);
  } catch(e) { toast(e.message || 'Не удалось прочитать файл'); }
  if (ui.repBusy) ui.repBusy.crm = ''; commit();
}

const GENERIC_CHECK = ['Изучил бриф и регламент','Подготовил черновой вариант','Прошёл внутреннее ревью','Внёс правки','Сдал результат по ссылке'];
const demoPreset = name => TASK_PRESETS[norm(name)] || { c:GENERIC_CHECK };   // только для демо-данных
// ---------- Шаблоны карточек подэтапов ----------
//  db.cardTpls[«процесс|подэтап»] = { d, reg, vid, c:[пункты], sub, at } — по нему создаются новые карточки этого подэтапа.
//  Нет шаблона — карточка создаётся пустой, без чек-листа.
const cardKey = (tplId, subName) => `${tplId || '*'}|${norm(subName)}`;
// карточка подэтапа берётся только из шаблона своего процесса — карточки других шаблонов не подставляются
function cardTplFor(p, subName){
  const T = db.cardTpls || {};
  return T[cardKey(p?.template_id, subName)] || null;
}
const taskPreset = (name, p) => { const c = p && !p._ext ? cardTplFor(p, name) : null; return c ? { d:c.d || '', c:c.c || [], reg:c.reg || '', vid:c.vid || '', b:c.b || [] } : { d:'', c:[], b:[] }; };
function saveCardTpl(p, subName, t){
  if (!p || p._ext || !subName) return;
  db.cardTpls = db.cardTpls || {};
  db.cardTpls[cardKey(p.template_id, subName)] = { sub:subName, d:t.description || '', reg:t.regulation_link || '', vid:t.video_url || '', c:t.checklist.map(i => i.text), b:clone(t.blocks || []), at:new Date().toISOString() };
}
// Один раз: уже заполненные карточки подэтапов становятся шаблонами (демо-заготовки пропускаем)
function migrateCardTpls(){
  if (db.cardTplsInit) return;
  db.cardTpls = db.cardTpls || {};
  const best = new Map();
  (db.tasks || []).forEach(t => {
    const p = db.projects.find(x => x.id === t.project_id); const s = p?.stages.find(x => x.id === t.stage_id);
    const sub = s?.subs?.find(x => x.id === t.substage_id); if (!sub) return;
    const items = t.checklist.map(i => i.text); const pr = demoPreset(sub.name);
    const isDemo = (t.description || '') === (pr.d || '') && items.join('\n') === (pr.c || []).join('\n') && !t.regulation_link && !t.video_url;
    if (isDemo || (!items.length && !t.description && !t.regulation_link && !t.video_url)) return;
    const k = cardKey(p.template_id, sub.name); const score = items.length * 10 + (t.description || '').length;
    if (!db.cardTpls[k] && (!best.has(k) || best.get(k).score < score)) best.set(k, { score, p, sub, t });
  });
  best.forEach(({ p, sub, t }) => saveCardTpl(p, sub.name, t));
  db.cardTplsInit = true;
}
const taskById = id => (db.tasks || []).find(t => t.id === id) || ext.tasks.find(t => t.id === id);
const taskFor = (pid, sid, subId) => (projById(pid)?._ext ? ext.tasks : (db.tasks || [])).find(t => t.project_id === pid && t.stage_id === sid && t.substage_id === subId);
function taskProgress(t){
  const total = t.checklist.length, n = t.checklist.filter(i => i.done).length;
  return { n, total, pct: total ? Math.round(n / total * 100) : 0, done: total > 0 && n === total };
}
const meName = () => userById(ME)?.name || 'Вы';
function makeTask({ project_id, stage_id, substage_id = null, title, description = '', assignee_id = null, checklist = [] }){
  return { id:uid(), project_id, stage_id, substage_id, title, description, regulation_link:'', result_link:'', video_url:'',
    assignee_id, checklist: checklist.map((x,i) => ({ id:uid(), text:x, done:false, position:i, completed_at:null, completed_by:null })),
    completed_at:null, created_at:new Date().toISOString() };
}
// Прогресс задачи → подэтап. Возвращает true, если подэтап поменялся.
function syncTaskToSub(t){
  const p = projById(t.project_id); const s = p?.stages.find(x => x.id === t.stage_id);
  const { done, total } = taskProgress(t);
  if (!total){ t.completed_at = null; return false; }   // пустой чек-лист не открывает и не закрывает подэтап
  const was = !!t.completed_at;
  t.completed_at = done ? (t.completed_at || new Date().toISOString()) : null;
  if (p && done !== was) addLog(p, `Задача «${t.title}»: ${done ? 'чек-лист выполнен на 100%' : 'снова в работе'}`);
  const x = s?.subs?.find(y => y.id === t.substage_id);
  if (!x || x.done === done) return false;
  x.done = done;
  if (done && s.status === 'not_started' && currentStage(p)?.id === s.id && p.start_date <= today()){ s.status = 'in_progress'; s.started_at = today(); }
  addLog(p, `Подэтап «${x.name}» (${s.name}) ${done ? 'закрыт задачей' : 'снова открыт: в задаче есть невыполненные пункты'}`);
  if (done && s.status !== 'done' && s.subs.every(y => y.done)) setTimeout(() => toast(`Все подэтапы «${s.name}» выполнены. Этап можно закрыть в карточке проекта.`), 50);
  return true;
}
// Создать задачи для подэтапов этапа, у которых их ещё нет
// проект открыт исполнителям — у подэтапов с карточкой в шаблоне сразу есть задача (задание, чек-лист, материалы):
// иначе исполнитель видит только галочку «Отметьте, когда сделаете» — шаблонов карточек у него нет
function ensureSharedTasks(){
  if (GUEST || typeof ownShared !== 'function') return 0;
  let n = 0;
  ownShared().forEach(p => {
    if (p._ext || p.state !== 'active') return;
    p.stages.forEach(s => {
      if (isMaint(s)) return;
      const need = (s.subs || []).filter(x => !taskFor(p.id, s.id, x.id) && cardTplFor(p, x.name));
      if (need.length) n += tasksFromSubs(p, { ...s, subs:need });
    });
  });
  return n;
}
function tasksFromSubs(p, s){
  let n = 0;
  (s.subs || []).forEach(x => {
    if (taskFor(p.id, s.id, x.id)) return;
    const pr = taskPreset(x.name, p);
    const t = makeTask({ project_id:p.id, stage_id:s.id, substage_id:x.id, title:x.name, description:pr.d || '', assignee_id:s.assignee_id, checklist:pr.c });
    t.regulation_link = pr.reg || ''; t.video_url = pr.vid || ''; t.blocks = clone(pr.b || []);
    if (x.done) t.checklist.forEach(i => { i.done = true; i.completed_at = new Date().toISOString(); i.completed_by = meName(); });
    syncTaskToSub(t); (p._ext ? ext.tasks : db.tasks).push(t); n++;
  });
  if (n) addLog(p, `Созданы задачи по подэтапам этапа «${s.name}»: ${n}`);
  return n;
}
function seedDemoTasks(){
  db.projects.filter(p => p.demo && p.state === 'active').forEach(p => {
    const s = currentStage(p); if (!s) return;
    (s.subs || []).forEach(x => {
      const pr = demoPreset(x.name);
      const t = makeTask({ project_id:p.id, stage_id:s.id, substage_id:x.id, title:x.name, description:pr.d || '', assignee_id:s.assignee_id, checklist:pr.c });
      const k = x.done ? t.checklist.length : s.status === 'not_started' ? 0 : Math.floor(Math.random() * (t.checklist.length - 1));
      t.checklist.forEach((i, j) => { if (j < k){ i.done = true; i.completed_at = new Date(Date.now() - (k - j) * 36e5).toISOString(); i.completed_by = 'Демо'; } });
      t.completed_at = taskProgress(t).done ? new Date().toISOString() : null;
      db.tasks.push(t);

const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';
function videoEmbed(url){
  const u = String(url || '').trim(); let m;
  if (!u) return null;
  if (u.startsWith('blob:')) return { kind:'video', src:u };
  if (!safeUrl(u)) return null;
  if ((m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/))) return { kind:'iframe', src:`https://www.youtube-nocookie.com/embed/${m[1]}` };
  if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return { kind:'iframe', src:`https://player.vimeo.com/video/${m[1]}` };
  if ((m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return { kind:'iframe', src:`https://drive.google.com/file/d/${m[1]}/preview` };
  if ((m = u.match(/loom\.com\/share\/(\w+)/))) return { kind:'iframe', src:`https://www.loom.com/embed/${m[1]}` };
  if (/\.(mp4|webm|mov|m4v|ogg)(\?|#|$)/i.test(u)) return { kind:'video', src:u };
  return { kind:'link', src:u };
}

function watchIT(){
  if (!cloud.store || !cloud.uid || IT.subs.length) return;
  const on = snap => {
    IT.list = snap.docs.map(d => { try { const b = d.data(); return { ...JSON.parse(b.json), _owner:b.ownerId, _members:b.memberIds || [] }; } catch(e) { return null; } }).filter(t => t && !t.deleted);
    syncItMembers();
    if (ui.view === 'mytasks' || ui.view === 'assign') render(); else paintBell();
  };
  IT.subs.push(cloud.store.collection('it').where('memberIds', 'array-contains', GUEST ? cloud.uid : OWNER()).onSnapshot(on, () => {}));
}
const itLocal = () => !cloud.store || !cloud.uid;
const itAll = () => itLocal() ? (db.itasks || []) : IT.list;
async function itSave(t){
  t.updated_at = new Date().toISOString();
  if (itLocal()){ db.itasks = db.itasks || []; const i = db.itasks.findIndex(x => x.id === t.id); if (i >= 0) db.itasks[i] = t; else db.itasks.push(t); commit(); return; }
  const owner = t._owner || OWNER(); const acc = accOf(userById(t.assignee_id));
  const members = [...new Set([owner, ...(t._members || []).filter(x => x !== owner), ...(acc && !t._members ? [acc] : [])])];
  const { _owner, _members, ...json } = t;
  const i = IT.list.findIndex(x => x.id === t.id); const keep = { ...t, _owner:owner, _members:members };
  if (i >= 0) IT.list[i] = keep; else IT.list.push(keep);                  // сразу показываем, база догонит
  try { await cloud.store.doc(`it/${t.id}`).set({ ownerId:owner, memberIds:members, json:JSON.stringify(json) }); }
  catch(e) { toast('Не удалось сохранить задачу. Проверьте связь и попробуйте ещё раз.'); }
}
// исполнитель вошёл в приложение позже, чем ему поставили задачу, — открываем ему задачу
function syncItMembers(){
  if (GUEST || itLocal()) return;
  IT.list.forEach(t => {
    const acc = accOf(userById(t.assignee_id)); if (!acc || t._members.includes(acc) || (t._owner && t._owner !== OWNER())) return;
    const members = [...new Set([...t._members.filter(x => x === t._owner), acc])];
    const { _owner, _members, ...json } = t; t._members = members;
    cloud.store.doc(`it/${t.id}`).set({ ownerId:t._owner, memberIds:members, json:JSON.stringify(json) }).catch(() => {});
  });
}
async function itDelete(t){
  if (itLocal()){ db.itasks = (db.itasks || []).filter(x => x.id !== t.id); commit(); return; }
  IT.list = IT.list.filter(x => x.id !== t.id);
  // удаления база не рассылает сразу: сначала помечаем задачу удалённой (это видят все), потом удаляем
  const { _owner, _members, ...json } = t;
  try { await cloud.store.doc(`it/${t.id}`).set({ ownerId:_owner || OWNER(), memberIds:_members || [OWNER()], json:JSON.stringify({ ...json, deleted:true }) });
    await cloud.store.doc(`it/${t.id}`).delete(); } catch(e) { toast('Не удалось удалить задачу'); }
}

function dayProjectItems(who){
  const out = [];
  const projects = [...(GUEST ? [] : db.projects), ...ext.projects].filter(p => p.state === 'active');
  projects.forEach(p => {
    const c = currentStage(p); if (!c) return;
    const mine = p._ext ? myTeamIds(p) : null;
    if (isMaint(c)){
      (c.rtasks || []).forEach(r => { const w = r.assignee_id;
        if (p._ext){ if (!mine.includes(w)) return; } else if (who && w !== who) return;
        out.push({ kind:'p', id:`r|${p.id}|${r.id}`, p, s:c, r, x:null, t:null, who:w, done:false, own:r.due_date, due:r.due_date, title:r.title }); });
      return;
    }
    const tasks = (p._ext ? ext.tasks : (db.tasks || [])).filter(t => t.project_id === p.id && t.stage_id === c.id);
    const rows = (c.subs || []).map(x => ({ x, t:tasks.find(t => t.substage_id === x.id) || null }))
      .concat(tasks.filter(t => !t.substage_id || !(c.subs || []).some(x => x.id === t.substage_id)).map(t => ({ x:null, t })));
    rows.forEach(({ x, t }) => {
      const w = whoId(p, c, t);
      if (p._ext){ if (!mine.includes(w)) return; }
      else if (who && w !== who) return;
      const pr = t ? taskProgress(t) : null;
      const done = t ? (pr.total ? pr.done : !!x?.done) : !!x?.done;
      out.push({ kind:'p', id:t ? t.id : `${p.id}|${c.id}|${x.id}`, p, s:c, x, t, who:w, done, own:(t?.due_date || x?.due_date || ''), due:(t?.due_date || x?.due_date || c.due_date), title:t ? t.title : x.name });

function saveTaskDraft(){

  const badBk = (d.blocks || []).find(b => (b.type === 'link' || b.type === 'video') && String(b.value || '').trim() && !safeUrl(b.value));
  if (badBk) return err(`Блок «${badBk.title || BLOCK_T[badBk.type]}»: ссылка должна начинаться с https://`);
  const p = projById(t.project_id);
  const old = new Map(t.checklist.map(i => [i.id, i]));

    description:d.description.trim(), regulation_link:d.regulation_link.trim(), video_url:d.video_url.trim(), blocks:cleanBlocks(d.blocks) });

    const tpl = tplById(p.template_id); const st = p.stages.find(x => x.id === t.stage_id); const ts = tpl && st && tpl.stages.find(x => norm(x.name) === norm(st.name));

      const at = (st.subs || []).findIndex(x => x.id === subX.id); (ts.subs = ts.subs || []).splice(Math.min(at < 0 ? ts.subs.length : at, ts.subs.length), 0, { id:uid(), name:subX.name });

}

// =====================================================================
//  ОБЛАЧНОЕ СОХРАНЕНИЕ В АККАУНТЕ CLAUDE
//  Данные лежат в личном разделе data/users/<id> хранилища приложения:
//  его видит только владелец аккаунта. localStorage остаётся кэшем,
//  чтобы приложение открывалось мгновенно и работало при обрыве связи.
//  Каждая сущность — отдельный документ (meta, p_*, t_*, r_*); большие
//  делятся на части по ~60 тыс. символов (лимит документа 256 КБ).
// =====================================================================
const cloud = { status:'local', col:null, ready:false, owner:null, org:null, hashes:new Map(), baseMeta:null, timer:null, pending:false, writing:false, dirty:false, lastSaved:null, err:'' };
const CHUNK = 60000;
const cloudCanon = b => JSON.stringify([b.k, b.kind, b.base ?? null, b.part ?? null, b.of ?? null, b.v ?? null, b.json]);
const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };

function cloudDocs(){

    if (json.length <= CHUNK){ out.set(key, { k:key, kind, json }); return; }
    const n = Math.ceil(json.length / CHUNK), v = hashStr(json);
    for (let i = 0; i < n; i++){ const k = i ? `${key}~${i}` : key; out.set(k, { k, kind, base:key, part:i, of:n, v, json:json.slice(i * CHUNK, (i + 1) * CHUNK) }); }
  };
  put('meta', 'meta', { ...(db.metaRest || {}), ver:db.ver, onboarded:db.onboarded, users:db.users, templates:db.templates, categories:db.categories || [], prefs:db.prefs || {}, cardTpls:db.cardTpls || {}, cardTplsInit:!!db.cardTplsInit, savedAt:db.savedAt || Date.now(),
    order:{ projects:db.projects.map(p => p.id), reports:(db.reports || []).map(r => r.id) } });
  db.projects.forEach(p => put('p_' + p.id, 'project', p));
  (db.tasks || []).forEach(t => put('t_' + t.id, 'task', t));

}
// Собираем данные из документов; если какая-то большая сущность пришла не целиком — ждём следующего снимка
function cloudAssemble(docs){
  const ent = new Map();
  for (const [k, b] of docs){
    const base = b.base || k; const e = ent.get(base) || { kind:b.kind, parts:[], of:b.of || 1, v:b.v };
    e.parts[b.part || 0] = b; ent.set(base, e);

  for (const e of ent.values()){
    if (e.parts.length < e.of || [...Array(e.of).keys()].some(i => !e.parts[i] || e.parts[i].v !== e.v)) return null;

function cloudApply(r){

  db.metaRest = Object.fromEntries(Object.entries(r.meta).filter(([k]) => !KNOWN.includes(k)));

    projects:r.projects, tasks:r.tasks, reports:r.reports });

// Слияние с облаком: из облака берём всё, что изменили на другом устройстве или вкладке,
// а свои правки (проекты, задачи, отчёты и поля настроек, изменённые здесь с последней сверки) оставляем свои.
// Так вкладка со старыми данными больше не затирает чужие изменения своими устаревшими копиями.
const META_FIELDS = ['ver','onboarded','users','templates','categories','prefs','cardTpls','cardTplsInit'];
const metaOf = () => ({ ver:db.ver, onboarded:db.onboarded, users:db.users, templates:db.templates, categories:db.categories || [], prefs:db.prefs || {}, cardTpls:db.cardTpls || {}, cardTplsInit:!!db.cardTplsInit });
function mergeRemote(remote, base, baseMeta, only){

  for (const k of base.keys()){ const bk = k.split('~')[0]; if (bk !== 'meta' && !local.has(bk) && (!only || only.has(bk))) gone.add(bk); }

    const out = remoteList.filter(x => !gone.has(pre + x.id)).map(x => { const l = loc.get(x.id); loc.delete(x.id); return l || x; });
    return out.concat([...loc.values()]);

  if (baseMeta && (!only || only.has('meta'))){ const lm = metaOf(); META_FIELDS.forEach(f => { if (JSON.stringify(lm[f] ?? null) !== JSON.stringify(baseMeta[f] ?? null)){ remote.meta[f] = lm[f]; metaMine++; } }); }

const metaBase = m => Object.fromEntries(META_FIELDS.map(f => [f, m?.[f]]));
// владелец данных: я сам или владелец команды, в которой я руководитель
const OWNER = () => cloud.owner || cloud.uid;
// аккаунт сотрудника команды: вошедший — свой; запись владельца ('me') — аккаунт владельца
const accOf = u => u ? (u.account_id || (u.id === 'me' ? OWNER() : null)) : null;
// руководитель в пространстве владельца: находим (или заводим) свою запись в команде — она и есть «Вы»
function adoptOrgMe(){

  const mid = cloud.org?.memberId;
  if (!u && mid){ u = db.users.find(x => x.id === mid && !x.account_id); if (u){ u.account_id = cloud.uid; u.status = 'active'; u.joined_at = new Date().toISOString(); u.invite = null; changed = true; } }
  if (!u){ u = { id:'u' + uid(), name:cloud.org?.name || 'Руководитель', email:cloud.org?.email || '', role:'pm', dept:'Аккаунтинг (PM)', capacity:5, status:'active', account_id:cloud.uid, joined_at:new Date().toISOString() }; db.users.push(u); changed = true; }
  if (!u.lead){ u.lead = true; changed = true; }

}
function switchOrg(owner){

function markDirty(){

  const d = readDirty(); let n = d.size;

function scheduleCloud(){

async function flushCloud(){

      if (cloud.hashes.get(k) !== start.get(k)){ cloud.dirty = true; continue; }   // пока писали, документ изменили на другом устройстве — сначала сольём
      await cloud.col.doc(k).set(body); cloud.hashes.set(k, s);       // по одной записи на документ

function onCloudSnapshot(snap){

      // с прошлого раза здесь остались несохранённые правки: берём только их, остальное — из облака
      // (раньше «своими» считались и копии, пересчитанные при открытии, — старое устройство затирало облако)
      const n = mergeRemote(remote, new Map(saved.h), saved.m, dirty);

function mergeSnapshot(snap, opts = {}){
  const meta = snap.meta || {}, clone = o => JSON.parse(JSON.stringify(o));
  const tplMap = {};

    const cur = tplById(t.id);
    if (cur && norm(cur.name) === norm(t.name)){ Object.assign(cur, clone(t)); return; }
    const same = db.templates.find(x => norm(x.name) === norm(t.name));
    if (same){ tplMap[t.id] = same.id; return; }
    const id = cur ? 't' + uid() : t.id; tplMap[t.id] = id; db.templates.push({ ...clone(t), id });
  });
  const tid = id => tplMap[id] || id;
  const userMap = {};
  (meta.users || []).forEach(u => {
    if (u.id === ME) return;
    const mail = (u.email || '').toLowerCase();
    const have = (mail && db.users.find(x => (x.email || '').toLowerCase() === mail)) || db.users.find(x => x.id === u.id);
    if (have){ userMap[u.id] = have.id; return; }
    const { account_id, invite, ...rest } = u; db.users.push(clone(rest));
  });
  const um = id => id ? (userMap[id] || (userById(id) ? id : null)) : null;
  const demoIds = new Set(opts.keepDemo ? [] : db.projects.filter(p => p.demo).map(p => p.id));
  db.projects = db.projects.filter(p => !demoIds.has(p.id));
  db.tasks = (db.tasks || []).filter(t => !demoIds.has(t.project_id));
  db.reports = (db.reports || []).filter(r => !demoIds.has(r.project_id));
  const put = (list, x) => { const i = list.findIndex(y => y.id === x.id); if (i >= 0) list[i] = x; else list.push(x); };
  (snap.projects || []).forEach(p0 => {
    const p = clone(p0); delete p.share; delete p._ext; delete p.demo;
    p.template_id = tid(p.template_id); p.pm_id = um(p.pm_id) || ME; p.worker_id = um(p.worker_id);
    p.stages.forEach(s => { s.assignee_id = um(s.assignee_id); });
    put(db.projects, p);
  });
  (snap.tasks || []).forEach(t0 => { const t = clone(t0); t.assignee_id = um(t.assignee_id); if (projById(t.project_id)) put(db.tasks, t); });
  db.reports = db.reports || []; (snap.reports || []).forEach(r => put(db.reports, clone(r)));
  db.cardTpls = db.cardTpls || {};
  Object.entries(meta.cardTpls || {}).forEach(([k, v]) => { const i = k.indexOf('|'); const nk = i < 0 ? k : tid(k.slice(0, i)) + k.slice(i); if (!db.cardTpls[nk]) db.cardTpls[nk] = clone(v); });
  db.onboarded = true; ui.clients = []; ui.pms = []; migrateLinks();
  return { projects:(snap.projects || []).length, tasks:(snap.tasks || []).length, demo:demoIds.size };
}

// сравниваем содержимое, а не порядок ключей, в котором хранилище вернуло документ
const sharedCanon = (path, b) => path.includes('/tasks/') ? String(b.json) : JSON.stringify([b.ownerId ?? null, (b.members || []).map(m => `${m.id}:${m.role}`).sort(), b.json]);

function mergeLogs(a = [], b = []){

const shareCount = p => (p?.share?.members?.length || 0) + (p?.share?.guests?.length || 0);

  const out = new Map();

  const add = (p, ownerId, members) => {
    const body = { ...trimLog(p), _team:p._ext ? (p._team || []) : team };
    let json = JSON.stringify(body);
    if (json.length > 200000) json = JSON.stringify({ ...body, log:(p.log || []).slice(0, 20) });
    out.set(`sp/${p.id}`, { ownerId, members, memberIds:members.map(m => m.id), json });

    ['sub', 'req'].forEach(f => { if (os[f] && stampOf(os[f]) > stampOf(ts[f])){ ts[f] = JSON.parse(JSON.stringify(os[f])); changed = true;
      if (os[f].status === 'accepted' || os[f].status === 'approved') accepted = true; } });
  });

function onSharedProject(pid, snap){

  const next = { ...remote, share:local.share, log:mergeLogs(local.log, remote.log) };
  const keepMine = mergeStageFields(next, local);               // у меня новее — оставляем и досылаем

function onSharedTasks(pid, snap){

  const un2 = cloud.store.collection(`data/users/${cloud.uid}/links/joined`).onSnapshot(snap => {
    const pids = new Set(snap.docs.map(d => d.id));
    for (const [pid, uns] of mine.jsubs) if (!pids.has(pid)){ uns.forEach(f => f()); mine.jsubs.delete(pid); mine.j.delete(pid); }
    for (const pid of pids){
      if (mine.jsubs.has(pid)) continue;
      const st = { b:null, join:undefined }; mine.j.set(pid, st);
      mine.jsubs.set(pid, [
        cloud.store.doc(`sp/${pid}`).onSnapshot(x => { if (x.metadata?.hasPendingWrites) return; st.b = x.exists ? x.data() : null; rebuildExt(); }, () => {}),
        cloud.store.doc(`sp/${pid}/joins/${cloud.uid}`).onSnapshot(x => { st.join = x.exists ? x.data() : null; rebuildExt(); }, () => {}),
      ]);
    }
    rebuildExt();
  }, () => {});
  shared.subs.set('__mineLinks', [un2]);
}
function rebuildExt(){
  const src = new Map(mine.q);
  for (const [pid, st] of mine.j){
    if (src.has(pid) || !st.b || !st.join || st.b.ownerId === cloud.uid || st.b.ownerId === OWNER()) continue;   // нет проекта или владелец закрыл мне доступ
    src.set(pid, { b:st.b, role:st.join.role || 'worker', link:true });
  }
  const next = []; let resend = false;
  for (const [pid, { b, role, link }] of src){
    const path = `sp/${pid}`; const s = sharedCanon(path, b);
    const old = ext.projects.find(p => p.id === pid);
    if (old && old._ext.role === role && (shared.hashes.get(path) === s || shared.pending || shared.writing)){ next.push(old); continue; }
    shared.hashes.set(path, s);
    let p; try { p = JSON.parse(b.json); } catch(e) { continue; }
    p._ext = { ownerId:b.ownerId, role, members:b.members || [], link:!!link };
    if (old){ p.log = mergeLogs(old.log, p.log); if (mergeStageFields(p, old)) resend = true; }
    next.push(p);
  }
  const gone = ext.projects.filter(p => !next.some(n => n.id === p.id)).map(p => p.id);
  ext.projects = next; ext.tasks = ext.tasks.filter(t => !gone.includes(t.project_id));
  if (resend) scheduleShared();
  if (gone.length && ui.view === 'mine' && gone.includes(ui.myProject)) toast('Доступ к проекту закрыт владельцем');
  syncSharedSubs(); afterSharedApply();
  if (ext.projects.length && !ui.mineSeen && !GUEST){ ui.mineSeen = true; toast(`С вами поделились проектами: ${ext.projects.length}. Они во вкладке «Мои проекты»`); }
}

//  data/users/<id>/links/joined/<pid> — личный список проектов, открытых этим человеком по ссылке
const APP_URL = location.origin + location.pathname;
const inviteUrl = code => `${APP_URL}?invite=${code}`;
const inviteFrom = t => { const x = String(t || '').trim(); const m = x.match(/invite[=:\/]([a-z0-9]{8,32})/i) || x.match(/^([a-z0-9]{8,32})$/i); return m ? m[1].toLowerCase() : null; };
const URL_INVITE = (() => { try { return inviteFrom(location.search) || inviteFrom(location.hash) || inviteFrom(document.referrer); } catch(e) { return null; } })();
const newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(14)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');

function joinBoxHtml(){
  return `<div class="join-box"><h2>${GUEST ? 'Ваши проекты' : 'Мои проекты'}</h2>
    <p>${ext.projects.length ? '' : 'Здесь появятся проекты, к которым вам открыли доступ. '}Если вам прислали ссылку-приглашение, а проект не открылся сам, вставьте ссылку сюда.</p>
    <form id="joinForm"><input id="joinIn" placeholder="https://ваш-сайт/?invite=…" aria-label="Ссылка-приглашение" autocomplete="off"><button class="primary">Открыть проект</button></form>
    <div class="err" id="joinErr" aria-live="polite">${esc(ui.joinErr || '')}</div></div>`;
}
async function acceptInvite(code){
  ui.joinErr = '';
  const err = m => { ui.joinErr = m; const el = $('#joinErr'); if (el) el.textContent = m; else toast(m); };
  if (!code) return err('Не нашёл в ссылке код приглашения. Скопируйте ссылку целиком.');
  if (!cloud.store || !cloud.uid) return err('Чтобы открыть проект, войдите в аккаунт и откройте ссылку снова.');
  try {
    const inv = await cloud.store.doc(`inv/${code}`).get();
    if (!inv.exists) return err('Ссылка недействительна: владелец отключил её или она скопирована не полностью.');
    if (inv.data().kind === 'team') return await acceptTeam(code, inv.data());
    const { pid, ownerId, role } = inv.data();
    if (ownerId === cloud.uid || ownerId === OWNER()){ toast('Это ссылка на ваш собственный проект. Отправьте её коллеге.'); return; }
    const jr = cloud.store.doc(`sp/${pid}/joins/${cloud.uid}`);
    const was = await jr.get();
    if (!was.exists) await jr.set({ role:role || 'worker', code, at:new Date().toISOString() });
    await cloud.store.doc(`data/users/${cloud.uid}/links/joined/${pid}`).set({ ownerId, at:new Date().toISOString() });
    ui.myProject = pid; ui.view = 'mine'; if (layer.querySelector('#joinForm')) layer.innerHTML = '';
    try { history.replaceState(null, '', location.pathname); } catch(e) {}
    toast(was.exists ? 'Проект уже у вас: открываю' : 'Готово: проект открыт');
    render();
  } catch(e) {
    err(e?.code === 'invalid_argument' || e?.code === 'not_granted'
      ? 'Не получилось открыть проект: не удалось записать данные. Проверьте, что ссылка не отключена, и попробуйте ещё раз.'
      : 'Не получилось открыть проект. Проверьте связь и попробуйте ещё раз.');
  }
}

function onJoins(pid, snap){
  const p = db.projects.find(x => x.id === pid); if (!p) return;
  const list = snap.docs.map(d => ({ id:d.id, role:d.data().role || 'worker', at:d.data().at || '' }));
  const key = l => (l || []).map(g => g.id + ':' + g.role).sort().join(',');
  if (key(list) === key(p.share?.guests)) return;
  const fresh = list.filter(g => !(p.share?.guests || []).some(x => x.id === g.id));
  p.share = p.share || { members:[] }; p.share.guests = list;
  if (fresh.length && !snap.metadata?.fromCache){ addLog(p, `По ссылке вошли участники: ${fresh.length}`); toast(`В проект «${p.name}» вошли по ссылке: ${fresh.length}`); }
  save(); render(); if (ui.shareId === pid) renderShareMembers();
  addLinkedPeople();
}
async function createLink(pid, role){
  const p = projById(pid); if (!p || p._ext) return;
  p.share = p.share || { members:[] }; p.share.links = p.share.links || [];
  const code = newCode(); const at = new Date().toISOString();
  p.share.links.push({ code, role, at }); addLog(p, 'Создана ссылка-приглашение'); save();
  for (let i = 0; i < 30 && !shared.hashes.has(`sp/${pid}`); i++){ if (!shared.writing) await flushShared(); else await new Promise(r => setTimeout(r, 250)); }
  try {
    if (!shared.hashes.has(`sp/${pid}`)) throw { code:'unavailable' };
    await cloud.store.doc(`inv/${code}`).set({ pid, ownerId:OWNER(), role, at });
    renderShareLinks(); copyLink(code);
  } catch(e) {
    p.share.links = p.share.links.filter(l => l.code !== code); save(); renderShareLinks();
    toast('Не удалось создать ссылку. Попробуйте ещё раз.');
  }
}
async function revokeLink(pid, code){
  const p = projById(pid);
  try { await cloud.store.doc(`inv/${code}`).delete(); } catch(e) { toast('Не удалось отключить ссылку, попробуйте ещё раз'); return; }
  p.share.links = (p.share.links || []).filter(l => l.code !== code); addLog(p, 'Ссылка-приглашение отключена'); commit(); renderShareLinks();
  toast('Ссылка отключена. Те, кто уже вошёл, сохраняют доступ, пока вы их не уберёте.');
}
function copyLink(code){
  const url = inviteUrl(code);
  const fallback = () => { const i = document.querySelector(`[data-lnin="${code}"]`); if (i){ i.focus(); i.select(); } toast('Ссылка выделена: нажмите Ctrl+C (⌘C), чтобы скопировать'); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(() => toast('Ссылка скопирована. Отправьте её человеку в любом мессенджере.'), fallback);
  else fallback();
}
function renderShareLinks(){

// человек открыл ссылку в команду
async function acceptTeam(code, inv){
  if (inv.ownerId === cloud.uid){ toast('Это ссылка в вашу собственную команду. Отправьте её сотруднику.'); return; }
  if (inv.role === 'lead'){
    // руководитель: вписываем себя (база проверяет ссылку), запоминаем команду и открываем проекты владельца
    const at = new Date().toISOString();
    await cloud.store.doc(`team/${inv.ownerId}/managers/${cloud.uid}`).set({ code, at });
    await cloud.store.doc(`team/${inv.ownerId}/members/${cloud.uid}`).set({ code, memberId:inv.memberId || '', role:'lead', at }).catch(() => {});
    await cloud.store.doc(`data/users/${cloud.uid}/links/lead/${inv.ownerId}`).set({ memberId:inv.memberId || '', at });
    cloud.store.doc(`inv/${code}`).delete().catch(() => {});        // ссылка одноразовая
    try { history.replaceState(null, '', location.pathname); } catch(e) {}
    toast('Готово: доступ руководителя открыт. Открываю проекты…');
    switchOrg(inv.ownerId); return 'reload';
  }
  const jr = cloud.store.doc(`team/${inv.ownerId}/members/${cloud.uid}`);
  const was = await jr.get();
  if (!was.exists) await jr.set({ code, memberId:inv.memberId || '', at:new Date().toISOString() });
  await cloud.store.doc(`data/users/${cloud.uid}/links/teams/${inv.ownerId}`).set({ at:new Date().toISOString() });
  ui.view = 'mine'; if (layer.querySelector('#joinForm')) layer.innerHTML = '';
  try { history.replaceState(null, '', location.pathname); } catch(e) {}
  toast(was.exists ? 'Вы уже в этой команде' : 'Готово: вы в команде. Проекты, где вы назначены, появятся во «Моих проектах»');
  render();
}

// у владельца: кто вошёл в команду по ссылке
function watchTeam(){
  if (GUEST || !cloud.store || shared.subs.has('__team')) return;
  shared.subs.set('__team', [cloud.store.collection(`team/${OWNER()}/members`).onSnapshot(s => { team.snap = s; processTeamJoins(); }, () => {})]);
}
function processTeamJoins(){
  if (!cloud.ready || GUEST) return;
  let changed = false;
  for (const d of team.snap?.docs || []){
    const acc = d.id, b = d.data() || {};
    const u = db.users.find(x => x.id !== ME && x.invite?.code && x.invite.code === b.code);
    const had = db.users.find(x => x.account_id === acc);
    if (!u && b.code && b.code === db.prefs?.teamLink?.code && !had && acc !== cloud.uid && acc !== OWNER()){ commonJoins.add(acc); continue; }
    if (!u || had === u) continue;
    if (had){ if (!had.viaLink) continue; mergeMember(had, u); }   // человек уже был в команде через ссылку на доску
    u.account_id = acc; u.status = 'active'; u.joined_at = new Date().toISOString();
    cloud.store.doc(`inv/${u.invite.code}`).delete().catch(() => {});   // ссылка одноразовая
    u.invite = null; changed = true;
    toast(`${u.name} принял(а) приглашение и вошёл(ла) в приложение`);
  }
  if (changed){ commit(); refreshProfiles(true); }
  addLinkedPeople(); addCommonJoins();
}
// вошедшие по общей ссылке: привязываем к сотруднику с той же почтой (ещё без входа) или добавляем исполнителем
const commonJoins = new Set(); let commonBusy = false;
async function addCommonJoins(){
  if (commonBusy || !commonJoins.size || !cloud.user) return;
  commonBusy = true;
  try {
    const ids = [...commonJoins].filter(a => !db.users.some(u => u.account_id === a));
    const prof = ids.length ? await cloud.user.profiles(ids).catch(() => ({})) : {};
    const names = [];
    ids.forEach(a => {
      if (db.users.some(u => u.account_id === a)) return;
      const pr = prof[a] || {}; const mail = String(pr.email || '').toLowerCase();
      let u = mail && db.users.find(x => x.id !== ME && !x.account_id && String(x.email || '').toLowerCase() === mail);
      if (u){ if (u.invite?.code){ cloud.store.doc(`inv/${u.invite.code}`).delete().catch(() => {}); u.invite = null; } }
      else { u = { id:'u' + uid(), name:pr.name || pr.email || 'Исполнитель', email:pr.email || '', role:'specialist', dept:'Другое', capacity:3, avatar:pr.avatar || '', title:pr.title || '', contact:pr.contact || '' }; db.users.push(u); }
      u.account_id = a; u.status = 'active'; u.joined_at = new Date().toISOString(); names.push(u.name);
    });
    commonJoins.clear();
    if (names.length){ commit(); toast(names.length === 1 ? `${names[0]} вошёл(ла) по ссылке для исполнителей и добавлен(а) в «Команду»` : `По ссылке для исполнителей вошли: ${names.join(', ')}`); }
  } finally { commonBusy = false; }
}
// переносим назначения с одной записи сотрудника на другую (один человек — одна запись)
function mergeMember(from, to){
  db.projects.forEach(p => { p.stages.forEach(s => { if (s.assignee_id === from.id) s.assignee_id = to.id; });
    if (p.pm_id === from.id) p.pm_id = to.id; if (p.worker_id === from.id) p.worker_id = to.id; });
  (db.tasks || []).forEach(t => { if (t.assignee_id === from.id) t.assignee_id = to.id; });
  db.users = db.users.filter(x => x !== from);
}
// люди, вошедшие по ссылке на доску или добавленные в «Поделиться», появляются в «Команде»,
// чтобы их можно было назначать ответственными в любых проектах
let linkBusy = false;
async function addLinkedPeople(){
  if (GUEST || !cloud.ready || !cloud.user || linkBusy) return;
  const ids = new Set();
  db.projects.forEach(p => [...(p.share?.guests || []), ...(p.share?.members || []).filter(m => !m.auto)].forEach(m => ids.add(m.id)));
  const missing = [...ids].filter(a => a !== cloud.uid && a !== OWNER() && !db.users.some(u => u.account_id === a));
  if (!missing.length) return;
  linkBusy = true;
  try {
    const prof = await cloud.user.profiles(missing).catch(() => ({}));
    let added = 0;
    missing.forEach(a => {
      if (db.users.some(u => u.account_id === a)) return;
      const pr = prof[a] || {};
      db.users.push({ id:'u' + uid(), name:pr.name || pr.email || 'Участник', email:pr.email || '', role:'specialist', dept:'Другое', capacity:3,
        status:'active', account_id:a, avatar:pr.avatar || '', title:pr.title || '', contact:pr.contact || '', joined_at:new Date().toISOString(), viaLink:true });
      added++;
    });
    if (added){ commit(); toast(added === 1 ? 'В «Команду» добавлен человек, вошедший по ссылке' : `В «Команду» добавлено вошедших по ссылке: ${added}`); }
  } finally { linkBusy = false; }
}

// проекты, где сотрудник из команды назначен, открываются ему автоматически
function syncAutoShares(){
  if (typeof cloud === 'undefined' || !cloud.uid || GUEST) return false;
  const acc = new Map(db.users.filter(u => u.account_id && u.id !== ME).map(u => [u.id, u.account_id]));
  let changed = false;
  db.projects.forEach(p => {
    const want = new Set();
    if (p.state !== 'archived' && acc.size){
      const ids = [p.pm_id, p.worker_id, ...p.stages.map(s => s.assignee_id), ...(db.tasks || []).filter(t => t.project_id === p.id).map(t => t.assignee_id)];
      ids.forEach(id => { const a = acc.get(id); if (a) want.add(a); });
    }
    const cur = p.share?.members || [];
    if (!want.size && !cur.some(m => m.auto)) return;
    const manual = cur.filter(m => !m.auto);
    const auto = cur.filter(m => m.auto && want.has(m.id) && !manual.some(x => x.id === m.id));
    want.forEach(a => { if (!manual.some(x => x.id === a) && !auto.some(x => x.id === a)) auto.push({ id:a, role:'worker', auto:true, at:new Date().toISOString() }); });
    const next = [...manual, ...auto];
    if (JSON.stringify(next) !== JSON.stringify(cur)){ p.share = { ...(p.share || {}), members:next }; changed = true; }
  });
  return changed;
}

// профили коллег: фото, должность и контакт, которые человек заполнил сам
let profAt = 0;
async function refreshProfiles(force){
  if (!cloud.user || GUEST || (!force && Date.now() - profAt < 30000)) return;
  profAt = Date.now();
  const linked = db.users.filter(u => u.account_id);
  try {
    const [me, prof] = await Promise.all([cloud.user.me(), linked.length ? cloud.user.profiles(linked.map(u => u.account_id)) : {}]);
    let changed = false;
    const put = (u, pr) => { if (!u || !pr) return;
      for (const [k, v] of [['avatar', pr.avatar], ['title', pr.title], ['contact', pr.contact], ['name', pr.name]]){
        if (v && u[k] !== v){ u[k] = v; changed = true; } }
      if (!u.email && pr.email){ u.email = pr.email; changed = true; } };
    const meU = userById(ME); put(meU, { ...me, name:meU?.name ? '' : me.name });   // своё имя в команде вы задаёте сами
    linked.forEach(u => put(u, prof[u.account_id]));
    if (changed) commit();
  } catch(e) { /* профили — не критично */ }
}

function dashHtml(){
  const act = db.projects.filter(p => p.state === 'active');
  const risk = k => act.filter(p => projectRisk(p) === k).length;
  const red = risk('red'), hot = risk('yellow'), client = risk('blue');
  const since = addDays(today(), -30);
  const fresh = act.filter(p => p.start_date && p.start_date >= since).length;
  const done30 = db.projects.filter(p => p.state === 'completed' && (p.stages.at(-1)?.completed_at || '') >= since).length;
  const week = act.filter(p => { const u = urg(p.deadline || plannedEnd(p)); return u.d !== null && u.d >= 0 && u.d <= 7; }).length;
  const h = new Date().getHours(); const hi = h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';

      <span class="kd-l">${label}</span><b class="kd-n">${n}</b><span class="kd-sub">${sub}</span>${ico(icon)}</button>`;
  return `<div class="kd-hello"><h2>${hi}${nm ? `, ${esc(nm)}` : ''}!</h2>
      <p><b>${red}</b> ${plural(red, 'проект просрочен', 'проекта просрочено', 'проектов просрочено')}, <b>${hot}</b> горят, <b>${week}</b> ${plural(week, 'финиш', 'финиша', 'финишей')} на этой неделе</p></div>
    <div class="kd-cards">
      ${card('', 'Активные проекты', act.length, `<em>+${fresh}</em> за 30 дней`, '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>')}
      ${card('red', 'Просрочено', red, `<em>${hot}</em> горят`, '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')}
      ${card('blue', 'У клиента', client, 'на согласовании', '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>')}
      ${card('done', 'Завершено', done30, 'за 30 дней', '<path d="M20 6 9 17l-5-5"/>')}
    </div>`;
}
document.addEventListener('click', e => {
  const c = e.target.closest?.('[data-kdrisk]'); if (!c) return;
  const k = c.dataset.kdrisk; ui.risk = ui.risk === k ? '' : k; render();
});
const MORE_ICON = MI('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>');
const moreViews = () => ['review', 'mytasks', 'assign', 'mine', 'reports', 'team', 'archive', 'templates'].filter(v => v !== 'mine' || !$('#mineTab').hidden);
function renderMobileNav(){
  const nav = $('#mnav'); if (!nav) return;
  if (GUEST){ nav.innerHTML = guestViews().map(v => `<button data-mview="${v}" aria-current="${ui.view === v ? 'page' : 'false'}">${MNAV[v][1]}<span>${MNAV[v][0]}</span></button>`).join(''); return; }
  const inMore = !MNAV_MAIN.includes(ui.view);
  nav.innerHTML = MNAV_MAIN.map(v => `<button data-mview="${v}" aria-current="${ui.view === v ? 'page' : 'false'}">${MNAV[v][1]}<span>${MNAV[v][0]}</span></button>`).join('')
    + `<button data-mmore aria-current="${inMore ? 'page' : 'false'}" aria-haspopup="dialog">${inMore ? MNAV[ui.view][1] : MORE_ICON}<span>${inMore ? MNAV[ui.view][0] : 'Ещё'}</span></button>`;
  const f = $('#fToggle'); if (f){ const k = ui.pms.length + ui.clients.length; f.classList.toggle('on', !!k); const nb = f.querySelector('.f-n'); if (nb) nb.textContent = k || ''; }
}
function openMore(){
  const all = GUEST ? [] : [{ id:'', name:'Основное', color:spColor(''), icon:spIcon(''), cur:!SPACE && !ORG },
    ...spaces.list.map(x => ({ id:x.id, name:x.name, color:spColor(x.id), icon:spIcon(x.id), cur:x.id === SPACE })),
    ...spaces.orgs.map(o => ({ id:'o:' + o.id, name:`Проекты: ${o.name}`, color:spColorsCache()['o:' + o.id] || hashColor(o.id), icon:'users', cur:ORG === o.id }))];
  layer.innerHTML = `<div class="backdrop" data-close></div><div class="modal more-sheet" role="dialog" aria-modal="true" aria-label="Меню">
    ${sideFoot()}
    <div class="mlist">${moreViews().map(v => `<button data-mview="${v}" aria-current="${ui.view === v ? 'page' : 'false'}">${MNAV[v][1]}<span>${MNAV[v][0]}</span></button>`).join('')}</div>
    ${all.length > 1 || (cloud.store && cloud.uid) ? `<div class="m-spaces"><div class="side-spl"><span>Пространства</span><button class="link" data-sidespset>Настроить</button></div>
      <div class="m-splist">${all.map(x => `<button class="m-sp${x.cur ? ' cur' : ''}" data-sidesp="${x.id}" style="--c:${x.color}" aria-pressed="${x.cur}"><span class="side-sp-ico">${spIco(x.icon)}</span><span>${esc(x.name)}</span></button>`).join('')}</div></div>` : ''}
  </div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-mview]');
  if (b){ if (layer.querySelector('.more-sheet')) layer.innerHTML = ''; ui.view = b.dataset.mview; ui.draft = null; render(); scrollTo(0, 0); return; }
  if (e.target.closest('[data-mmore]')){ openMore(); return; }
  if (e.target.closest('#fToggle')){ $('#filters').classList.toggle('open'); $('#fToggle').setAttribute('aria-expanded', $('#filters').classList.contains('open')); }
});
// кнопка «Фильтры» рядом с поиском (видна только на телефоне)
$('#q').insertAdjacentHTML('afterend', '<button class="ghost f-toggle" id="fToggle" aria-expanded="false" aria-controls="tags" title="PM и клиенты"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5Z"/></svg><span>Фильтры</span><b class="f-n"></b></button>');
$('#density').insertAdjacentHTML('afterend', '<button class="ghost sel-toggle" id="selToggle" aria-pressed="false" title="Выбрать несколько проектов"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg><span>Выбрать</span></button>');

try { db = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!db || !db.projects || !db.users) db = (SPACE || ORG) ? emptySpace() : seed();
migrate();
if (!db.reports) db.reports = [];
if (!db.tasks){ db.tasks = []; seedDemoTasks(); save(); }
migrateCardTpls();
db.tasks = db.tasks.filter(t => projById(t.project_id));   // задачи удалённых проектов
migrateLinks();
repairStageOrder();
syncDoneStages();
(db.reports || []).forEach(fixReport);
replanAll();
localSave();
setInterval(() => { if (!GUEST && replanAll()) commit(); }, 3600e3);
restoreView();
{ let m = null; try { m = localStorage.getItem(MODE_KEY); } catch(e) {}
  if (URL_INVITE && m !== 'owner') m = 'guest';
  if (m === 'guest') setMode('guest');
  if (m) render(); else app.innerHTML = '<div class="empty">Загрузка…</div>';   // первый визит: ждём, кто открыл приложение
  if (m === 'owner'){ ownerBooted = true; if (!db.onboarded) openProfile(true); } }
initCloud();
</script>
