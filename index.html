  box.innerHTML = list.map(r => `<li><button class="sh-hit" data-shadd="${r.id}"><b></b><small></small><span>Добавить</span></button></li>`).join('')
    || (q ? '<li class="hint">Никого не нашли в вашей организации</li>' : '');
  list.forEach((r, i) => { const b = box.children[i].querySelector('button'); b.querySelector('b').textContent = r.name; b.querySelector('small').textContent = r.email || ''; });
}
function shareChanged(p, text){ addLog(p, text); commit(); scheduleShared(); renderShareMembers(); }
document.addEventListener('input', e => { if (e.target.id === 'shQ') shareSearch(e.target.value.trim()); });
document.addEventListener('change', e => {
  if (e.target.id === 'shRole'){ ui.shareRole = e.target.value; return; }
  const r = e.target.dataset?.shrole; if (!r) return;
  const p = projById(ui.shareId); const m = (p.share.members || []).find(x => x.id === r); if (m){ m.role = e.target.value; shareChanged(p, 'Изменена роль участника'); }
});
document.addEventListener('click', e => {
  const sh = e.target.closest('[data-share]'); if (sh){ e.stopPropagation(); openShare(sh.dataset.share); return; }
  const add = e.target.closest('[data-shadd]');
  if (add){ const p = projById(ui.shareId); p.share = p.share || { members:[] }; p.share.members = p.share.members || [];
    if (!p.share.members.some(m => m.id === add.dataset.shadd)) p.share.members.push({ id:add.dataset.shadd, role:ui.shareRole || 'worker', at:new Date().toISOString() });
    shareChanged(p, 'Проектом поделились с участником'); $('#shQ').value = ''; shareSearch(''); toast('Доступ открыт'); return; }
  const del = e.target.closest('[data-shdel]');
  if (del){ const p = projById(ui.shareId); p.share.members = (p.share.members || []).filter(m => m.id !== del.dataset.shdel); shareChanged(p, 'Участник убран из проекта'); shareSearch($('#shQ')?.value.trim() || ''); }
});

// =====================================================================
//  МОБИЛЬНАЯ НАВИГАЦИЯ: нижнее меню, лист «Ещё», свёрнутые фильтры
// =====================================================================
const MI = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const MNAV = {
  matrix:['Матрица', MI('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>')],
  kanban:['Канбан', MI('<rect x="3" y="3" width="5" height="15" rx="1.5"/><rect x="10" y="3" width="5" height="10" rx="1.5"/><rect x="17" y="3" width="4" height="18" rx="1.5"/>')],
  production:['Произв.', MI('<path d="M3 12h4l3-8 4 16 3-8h4"/>')],
  load:['Загрузка', MI('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>')],
  mine:['Мои проекты', MI('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>')],
  reports:['AI-отчёты', MI('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>')],
  team:['Команда', MI('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>')],
  templates:['Шаблоны', MI('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>')],
};
const MNAV_MAIN = ['matrix', 'kanban', 'production', 'load'];
const MORE_ICON = MI('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>');
const moreViews = () => ['mine', 'reports', 'team', 'templates'].filter(v => v !== 'mine' || !$('#mineTab').hidden);
function renderMobileNav(){
  const nav = $('#mnav'); if (!nav) return;
  const inMore = !MNAV_MAIN.includes(ui.view);
  nav.innerHTML = MNAV_MAIN.map(v => `<button data-mview="${v}" aria-current="${ui.view === v ? 'page' : 'false'}">${MNAV[v][1]}<span>${MNAV[v][0]}</span></button>`).join('')
    + `<button data-mmore aria-current="${inMore ? 'page' : 'false'}" aria-haspopup="dialog">${inMore ? MNAV[ui.view][1] : MORE_ICON}<span>${inMore ? MNAV[ui.view][0] : 'Ещё'}</span></button>`;
  const f = $('#fToggle'); if (f) f.classList.toggle('on', !!(ui.pms.length || ui.clients.length));
}
function openMore(){
  layer.innerHTML = `<div class="backdrop" data-close></div><div class="modal more-sheet" role="dialog" aria-modal="true" aria-label="Другие разделы">
    <div class="mlist">${moreViews().map(v => `<button data-mview="${v}" aria-current="${ui.view === v ? 'page' : 'false'}">${MNAV[v][1]}${MNAV[v][0]}</button>`).join('')}</div></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-mview]');
  if (b){ if (layer.querySelector('.more-sheet')) layer.innerHTML = ''; ui.view = b.dataset.mview; ui.draft = null; render(); scrollTo(0, 0); return; }
  if (e.target.closest('[data-mmore]')){ openMore(); return; }
  if (e.target.closest('#fToggle')){ $('#filters').classList.toggle('open'); $('#fToggle').setAttribute('aria-expanded', $('#filters').classList.contains('open')); }
});
// кнопка «Фильтры» рядом с поиском (видна только на телефоне)
$('#q').insertAdjacentHTML('afterend', '<button class="ghost f-toggle" id="fToggle" aria-expanded="false" aria-controls="filters">Фильтры<i aria-hidden="true"></i></button>');

try { db = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!db || !db.projects || !db.users) db = seed();
migrate();
if (!db.reports) db.reports = [];
if (!db.tasks){ db.tasks = []; seedDemoTasks(); save(); }
migrateCardTpls();
db.tasks = db.tasks.filter(t => projById(t.project_id));   // задачи удалённых проектов
localSave();
{ let m = null; try { m = localStorage.getItem(MODE_KEY); } catch(e) {}
  if (URL_INVITE && m !== 'owner') m = 'guest';
  if (m === 'guest') setMode('guest');
  if (m) render(); else app.innerHTML = '<div class="empty">Загрузка…</div>';   // первый визит: ждём, кто открыл приложение
  if (m === 'owner'){ ownerBooted = true; if (!db.onboarded) openProfile(true); } }
initCloud();
</script>
