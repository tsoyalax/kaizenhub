<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("agency-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KaizenHub – Конвейер проектов БЕТА (deploy))</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F3F3F5; --fbg:#FFFFFF; --fbg-h:#F8F9FA; --row:#FFFFFF; --ink:#17171C; --muted:#71717A; --line:#E9ECEF; --line-strong:#D4D4D8;
  /* светлая тема: серая подложка + белые блоки (в тёмной эти значения сброшены ниже) */
  --fbd:#E2E8F0; --seg-on:#F1F3F5; --tbl-bg:#FFFFFF; --side-bg:#F1F3F5; --side-bd:#E5E7EB; --top-bg:rgba(255,255,255,.8);
  --pl-r-bg:#FEE2E2; --pl-r:#991B1B; --pl-b-bg:#E0F2FE; --pl-b:#0369A1; --pl-g-bg:#DCFCE7; --pl-g:#15803D; --pl-m-bg:#F3E8FF; --pl-m:#6B21A8;
  --pl-n-bg:#F3F4F6; --pl-n:#4B5563; --pl-y-bg:#FEF3C7; --pl-y:#92400E; --pl-d-bg:#ECFDF5; --pl-d:#047857;
  --accent:#17171C; --accent-ink:#FFFFFF; --brand:#6A5AE0; --link:#2F6BFF; --focus:#2F6BFF; --soft:#EAF1FF;
  --card-hi:transparent; --shadow:none;
  --g:#16A34A; --g-bg:#E7F8EE; --y:#E07800; --y-bg:#FFF3E0; --r:#E5383B; --r-bg:#FFECEC;
  --tick-on:#A1A1AA; --tick-off:#E7E7EA;
  --b:#2F6BFF; --b-bg:#EAF1FF; --w:#16A34A; --m:#7C3AED; --m-bg:#F1EAFF; --n:#A1A1AA; --n-bg:#F4F4F5; --d:#71717A; --d-bg:#F7F7F8;
  --radius:12px; --cell-w:140px;
  font-family:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F0F12; --surface:#16161A; --surface-2:#1E1E23; --row:#16161A; --ink:#EDEDEF; --muted:#A1A1AA; --line:#26262C; --line-strong:#3A3A42;
    --accent:#EDEDEF; --accent-ink:#0F0F12; --brand:#7C6CF6; --link:#8DA2F7; --focus:#8DA2F7; --soft:#1C2033;
    --card-hi:transparent; --shadow:none;
    --g:#4ADE80; --g-bg:#11241A; --y:#FBBF24; --y-bg:#2A2110; --r:#F87171; --r-bg:#2C1416; --tick-on:#EDEDEF; --tick-off:color-mix(in srgb,#EDEDEF 16%,transparent); --fbg:#16161A; --fbg-h:#1E1E23; --b:#60A5FA; --b-bg:#13203A; --w:#4ADE80; --m:#B197FC; --m-bg:#231D3B;
    --n:#71717A; --n-bg:#1F1F24; --d:#8A8A93; --d-bg:#18181C;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F0F12; --surface:#16161A; --surface-2:#1E1E23; --row:#16161A; --ink:#EDEDEF; --muted:#A1A1AA; --line:#26262C; --line-strong:#3A3A42;
  --accent:#EDEDEF; --accent-ink:#0F0F12; --brand:#7C6CF6; --link:#8DA2F7; --focus:#8DA2F7; --soft:#1C2033;
  --card-hi:transparent; --shadow:none;
  --g:#4ADE80; --g-bg:#11241A; --y:#FBBF24; --y-bg:#2A2110; --r:#F87171; --r-bg:#2C1416; --tick-on:#EDEDEF; --tick-off:color-mix(in srgb,#EDEDEF 16%,transparent); --fbg:#16161A; --fbg-h:#1E1E23; --b:#60A5FA; --b-bg:#13203A; --w:#4ADE80; --m:#B197FC; --m-bg:#231D3B;
  --n:#71717A; --n-bg:#1F1F24; --d:#8A8A93; --d-bg:#18181C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

/* ---------- Шапка ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:0 28px;padding:0 28px;min-height:60px}
.brand{font-weight:600;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;padding:14px 0}
.brand-mark{display:flex;gap:3px}
.brand-mark i{width:6px;height:6px;border-radius:50%;display:block}
.tabs{display:flex;gap:2px;align-self:stretch;overflow-x:auto}
.tabs button{border:0;background:none;padding:0 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;position:relative;font-size:14.5px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center;padding:10px 0}

/* ---------- Кнопки ---------- */
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 15px;font-weight:500;cursor:pointer;white-space:nowrap;font-size:14.5px}
.primary:hover{opacity:.88}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 13px;cursor:pointer;font-size:14px}
.ghost:hover{border-color:var(--line-strong)}
.link{background:none;border:0;padding:2px 0;color:var(--link);cursor:pointer;font-size:13.5px;font-weight:500}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.danger{color:var(--r)}
.icon-btn{position:relative;width:36px;height:36px;border:0;background:none;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.badge{position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--r);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center}

/* ---------- Фильтры ---------- */
.filters{padding:18px 28px 0;display:grid;gap:10px}
.filters #q{flex:0 1 320px}
.filters label.inl select{height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;font-size:13.5px;color:var(--ink)}
.filters .row > label.inl:first-of-type{margin-left:auto}
.f-toggle{display:inline-flex;align-items:center;gap:6px;height:36px;font-size:13.5px}
.f-toggle i{display:none}
.f-n{min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--surface);font-size:11px;display:none;place-items:center;padding:0 5px}
.f-toggle.on .f-n{display:inline-grid}
.filters:not(.open) #tags{display:none}
#tags{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
#activeF:empty,.filters.open #activeF{display:none}
.tag.on-x{background:var(--surface-2);border-color:var(--line-strong)}
.tag.on-x span{opacity:.6;margin-left:2px}
#chips .chip{padding:4px 11px 4px 9px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row input[type=search],.row select{height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 11px;min-width:0;font-size:14px}
.row input[type=search]:focus,.row select:focus{border-color:var(--line-strong);outline:0}
.row input[type=search]{flex:1 1 240px;max-width:360px}
.row label.inl{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 10px;cursor:pointer;font-size:13.5px}
.chip:hover{border-color:var(--line-strong)}
.chip b{font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink)}
.chip[data-risk="red"][aria-pressed="true"]{background:var(--r-bg);border-color:var(--r);box-shadow:none}
.chip[data-risk="yellow"][aria-pressed="true"]{background:var(--y-bg);border-color:var(--y);box-shadow:none}
.chip[data-risk="blue"][aria-pressed="true"]{background:var(--b-bg);border-color:var(--b);box-shadow:none}
.chip[data-risk="green"][aria-pressed="true"]{background:var(--g-bg);border-color:var(--g);box-shadow:none}
.chip[data-risk="gray"][aria-pressed="true"]{background:var(--n-bg)}
.sw{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sw.red{background:var(--r)}.sw.yellow{background:var(--y)}.sw.blue{background:var(--b)}.sw.green{background:var(--g)}.sw.gray{background:var(--n)}.sw.done{background:transparent;box-shadow:inset 0 0 0 1.5px var(--n)}.sw.all{background:conic-gradient(var(--r) 0 25%,var(--y) 0 50%,var(--b) 0 75%,var(--g) 0)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tlabel{color:var(--muted);font-size:13px;margin:0 2px 0 6px}
.tlabel:first-child{margin-left:0}
.tag{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.tag:hover{border-color:var(--line-strong)}
.tag[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tag small{opacity:.6;margin-left:4px}
.seg-toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--surface)}
.seg-toggle button{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg-toggle button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:500}

main{padding:16px 28px 48px}
.empty{padding:56px 16px;text-align:center;color:var(--muted)}
.empty .primary{margin-top:14px}
.hint{color:var(--muted);font-size:13px}

/* ---------- Матрица ---------- */
.grp{margin-top:24px}
.grp h2{font-size:14px;font-weight:600;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.grp h2 span{color:var(--muted);font-weight:400}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.mx{border-collapse:separate;border-spacing:0;min-width:100%}
.mx th,.mx td{padding:0;border-bottom:1px solid var(--line);vertical-align:top}
.mx tr:last-child>*{border-bottom:0}
.mx thead th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:left;padding:10px;white-space:nowrap;background:var(--surface)}
.mx thead th .num{color:var(--n);margin-right:6px;font-weight:500}
.mx .pcol{font-weight:400;position:sticky;left:0;z-index:2;background:var(--surface);min-width:230px;max-width:270px;border-right:1px solid var(--line)}
.mx thead .pcol{z-index:3}
.prow{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;cursor:pointer}
.prow:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
.prow b{display:block;font-weight:500;font-size:14px;line-height:1.35}
.prow small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.prow .late{color:var(--r)}
.hp{display:inline-block;font-size:11px;font-weight:500;color:var(--r);background:var(--r-bg);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px}
.mx td{padding:5px 3px}
.mx td:last-child{padding-right:8px}
.cell{display:flex;flex-direction:column;gap:1px;width:var(--cell-w);min-height:66px;text-align:left;border:0;border-radius:9px;padding:7px 10px;cursor:pointer;position:relative;background:var(--n-bg);color:var(--ink);transition:opacity .15s}
.cell::before{content:"";position:absolute;right:9px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--n)}
.cell .sn{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.cell .st{font-size:11.5px;font-weight:500;color:var(--muted)}
.cell .dl{font-size:13px;font-weight:600;line-height:1.25}
.cell .who{font-size:12px;color:var(--muted);margin-top:auto}
.cell .who.none{opacity:.7}
.cell .who.inherit{opacity:.75;font-style:italic}
.cell .age{font-size:11.5px;color:var(--muted)}
.cx .age{display:block;font-size:12.5px;color:var(--muted)}
.subnow{display:block;font-size:12px;color:var(--b);font-weight:500;line-height:1.3}
.cell .subnow{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cx td small.subnow,.pf-item small.subnow,.pm-chip small.subnow,.card .meta.subnow,.pc-stagebox .subnow{color:var(--b)}
.cell-wrap .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .who i{font-style:normal;font-size:10px;opacity:.6}
.cell-wrap{position:relative;width:var(--cell-w)}
.cell-as{position:absolute;left:0;right:0;bottom:2px;height:26px;opacity:0;cursor:pointer;font-size:13px}
td:has(.cell-as:hover) .who,td:has(.cell-as:focus-visible) .who{text-decoration:underline;text-underline-offset:2px;color:var(--ink);opacity:1}
td:has(.cell-as:focus-visible) .cell{outline:2px solid var(--focus);outline-offset:1px}
.prow-people{display:flex;flex-wrap:wrap;gap:2px 10px;padding:0 14px 10px;font-size:12.5px;color:var(--muted)}
.prow-people label{display:inline-flex;align-items:center;gap:4px;min-width:0}
.prow-people select{border:0;background:transparent;color:var(--ink);font-size:12.5px;padding:2px 0;max-width:120px;cursor:pointer;text-decoration:underline dotted var(--line-strong);text-underline-offset:3px}
.prow-people select:hover{text-decoration-color:var(--ink)}
.cell.cur{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cell.dim{opacity:.2}
.s-green{background:var(--g-bg)}.s-green::before{background:var(--g)}.s-green .st{color:var(--g)}
.s-yellow{background:var(--y-bg)}.s-yellow::before{background:var(--y)}.s-yellow .st{color:var(--y)}
.s-red{background:var(--r-bg)}.s-red::before{background:var(--r)}.s-red .st,.s-red .dl{color:var(--r)}
.s-blue{background:var(--b-bg)}.s-blue::before{background:var(--b)}.s-blue .st{color:var(--b)}
.s-gray{background:var(--n-bg)}.s-gray .dl{font-weight:400;color:var(--muted)}
.s-done{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}.s-done::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--n)}.s-done .dl{font-weight:400;color:var(--muted)}
.cell.blank{background:none;box-shadow:none;cursor:default}.cell.blank::before{display:none}

/* ---------- Компактный режим ---------- */
table.cx{width:100%;border-collapse:collapse;min-width:800px;table-layout:fixed}
.cx col.c7{width:27%}.cx col.c1{width:25%}.cx col.c6{width:16%}.cx col.c2{width:17%}.cx col.c5{width:18%}.cx col.c3{width:15%}.cx col.c4{width:17%}
.cx .start small,.cx .due small{white-space:nowrap}
.cx th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:left;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.cx td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis}
.cx tbody tr:last-child td{border-bottom:0}
.cx tbody tr{cursor:pointer}
.cx tbody tr:hover td,.cx tbody tr:focus-visible td{background:var(--surface-2)}
.cx tbody tr:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.cx td:first-child{font-weight:500}
.cx small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.cx .pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cx .pill .sw{width:6px;height:6px}
.cx .due small.dl-over{color:var(--r)}
.cx .due small.dl-warn{color:var(--y)}
.cx .due small.dl-client{color:var(--b)}
.cx .due small.dl-m{color:var(--m)}
.cx .st-age.slow{color:var(--y)}
.pbar{display:flex;gap:2px;height:6px;margin:4px 0 5px}
.pseg{flex:1;min-width:4px;border-radius:2px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.pseg.p-done{background:var(--tick-on);box-shadow:none}
.pseg.p-green{background:var(--g);box-shadow:none}.pseg.p-yellow{background:var(--y);box-shadow:none}.pseg.p-red{background:var(--r);box-shadow:none}.pseg.p-blue{background:var(--b);box-shadow:none}.pseg.p-gray{background:var(--n);box-shadow:none}

/* ---------- Канбан ---------- */
.kb-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.kb-head select,.fn-head-row select{height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 11px;font-size:14px}
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 268px;min-width:0;width:268px;background:var(--surface-2);border:1px solid transparent;border-radius:var(--radius);padding:8px;min-height:160px}
.col.over{border-color:var(--ink);border-style:dashed}
.col h3{font-size:13.5px;font-weight:600;margin:4px 6px 10px;display:flex;align-items:flex-start;gap:6px;min-height:26px}
.col h3 .cnt{padding-top:1px}
.col h3 .cname{flex:1;min-width:0;line-height:1.3}
.col h3 .cnt{color:var(--muted);font-weight:400}
.col-tools{display:flex;gap:0;opacity:0;transition:opacity .12s}
.col:hover .col-tools,.col:focus-within .col-tools{opacity:1}
@media (hover:none){.col-tools{opacity:1}}
.col-tools button{width:26px;height:26px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.col-tools button:hover{background:var(--surface);color:var(--ink)}
.col-tools svg{width:14px;height:14px}
.col.extra{background:transparent;border:1px dashed var(--line-strong)}
.col-add{flex:0 0 200px;min-height:160px;border:1px dashed var(--line-strong);background:transparent;border-radius:var(--radius);cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px}
.col-add:hover{color:var(--ink);border-color:var(--ink)}
.col-add span{font-size:22px;line-height:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:grab}
.card:hover{border-color:var(--line-strong)}
.card.dragging{opacity:.45}
.card .t{font-weight:500;line-height:1.35;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.card .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.card .stline{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:6px;background:var(--n-bg);color:var(--muted)}
.pill.s-green{color:var(--g)}.pill.s-yellow{color:var(--y)}.pill.s-red{color:var(--r)}.pill.s-blue{color:var(--b)}
.pill::before{display:none}
.card .ctrl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.card .ctrl .wide{grid-column:1/-1}
.card select,.stg select,.stg input,.field input,.field select,.field textarea{height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 9px;font-size:13.5px;width:100%;min-width:0}
.card select:focus,.stg select:focus,.stg input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--line-strong);outline:0}
.field textarea{height:auto;min-height:170px;padding:9px;line-height:1.5;resize:vertical}

/* ---------- Производство ---------- */
.fn-head-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 18px}
.fn-sum{color:var(--muted);font-size:13.5px}
.fn{display:grid;gap:10px}
.fn-stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}

.fn-subs .arr{color:var(--line-strong);border:0;padding:0}
.fn-actions{display:flex;gap:16px;margin:12px 0 0 40px;flex-wrap:wrap}
.fn-list{list-style:none;margin:12px 0 0 40px;padding:0;border-top:1px solid var(--line)}

.fn-list .pn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:8px}
.fn-list .pn small{color:var(--muted);font-weight:400}
.fn-list .prog{font-size:12.5px;color:var(--muted);white-space:nowrap}
.fn-list .subs{grid-column:1/-1}
@media (max-width:640px){.fn-top{grid-template-columns:28px 1fr}.fn-stats{grid-column:2;justify-content:flex-start;text-align:left}.fn-bar,.fn-subs,.fn-actions,.fn-list{margin-left:0}}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.sub-chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px 3px 7px;border:1px solid var(--line);border-radius:999px;cursor:pointer;user-select:none}

.stg .sub-chk input,.fn-list .sub-chk input{width:14px;height:14px;padding:0;border:0;flex:none}
.stg label.sub-chk{display:inline-flex;margin:0;font-size:13px;color:inherit}
.sub-chk:has(input:checked){color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}

/* ---------- Загрузка ---------- */
.dash{display:grid;gap:14px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.panel h2{font-size:15px;font-weight:600;margin:0 0 2px}

.lrow{display:grid;grid-template-columns:minmax(150px,210px) 1fr minmax(130px,170px);gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.who-cell{display:flex;gap:10px;align-items:center;min-width:0}
.who-cell div{min-width:0}
.who-cell b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-cell small{display:block;color:var(--muted);font-size:12.5px}
.av{width:30px;height:30px;flex:none;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--muted);overflow:hidden}

.sh-tag.auto{background:var(--b-bg);color:var(--b)}
.trackwrap{position:relative;padding:4px 0}
.track{height:8px;background:var(--surface-2);border-radius:4px;display:flex;overflow:hidden}
.seg{height:100%}
.seg.red{background:var(--r)}.seg.yellow{background:var(--y)}.seg.blue{background:var(--b)}.seg.green{background:var(--g)}.seg.up{background:repeating-linear-gradient(45deg,var(--surface-2) 0 3px,var(--line-strong) 3px 5px)}
.cap{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);border-radius:1px}
.lstat{font-size:13px;text-align:right}

.lstat .over{color:var(--r)}.lstat .full{color:var(--y)}.lstat .free{color:var(--g)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:10px}

table.heat{border-collapse:separate;border-spacing:3px;width:100%;min-width:560px}

.heat td.h1{background:var(--g-bg);color:var(--g)}.heat td.h2{background:var(--y-bg);color:var(--y)}.heat td.h3{background:var(--r-bg);color:var(--r)}
.heat th.name{min-width:150px;color:var(--ink);font-weight:500}
.ulist{list-style:none;margin:0;padding:0}

.ulist small{color:var(--muted);display:block;font-size:12.5px}
@media (max-width:640px){.lrow{grid-template-columns:1fr auto}.lrow .trackwrap{grid-column:1/-1;grid-row:2}}

/* ---------- Команда ---------- */

}

  padding:calc(env(safe-area-inset-top,0px) + 18px) 24px calc(env(safe-area-inset-bottom,0px) + 28px);box-shadow:-12px 0 40px rgba(10,10,14,.12)}

.ce{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-bottom:4px}

.timeline{list-style:none;margin:0;padding:0;position:relative}
.stg{position:relative;padding:0 0 16px 30px}
.stg::before{content:"";position:absolute;left:9px;top:22px;bottom:2px;width:1px;background:var(--line-strong)}
.stg:last-child::before{display:none}
.stg .dot{position:absolute;left:0;top:2px;width:19px;height:19px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--n);display:grid;place-items:center;color:var(--muted);font-size:10.5px;font-weight:600}
.stg.k-green .dot{box-shadow:inset 0 0 0 1.5px var(--g);color:var(--g)}.stg.k-yellow .dot{box-shadow:inset 0 0 0 1.5px var(--y);color:var(--y)}.stg.k-red .dot{box-shadow:inset 0 0 0 1.5px var(--r);color:var(--r)}.stg.k-blue .dot{box-shadow:inset 0 0 0 1.5px var(--b);color:var(--b)}.stg.k-done .dot{background:var(--ink);box-shadow:none;color:var(--surface)}
.stg.focus{outline:1.5px solid var(--focus);outline-offset:6px;border-radius:8px}
.stg .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stg .r1 b{font-weight:500}
.stg .note{font-size:12.5px;color:var(--muted);margin:1px 0 6px}
.stg .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.stg .g{grid-template-columns:1fr 1fr}}
.log{list-style:none;margin:0;padding:0;font-size:13.5px}
.log li{padding:7px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:118px 1fr;gap:10px}
.log time{color:var(--muted);font-size:12.5px}
.d-foot{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:22px}

.modal{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,calc(100% - 24px));max-height:calc(100% - 40px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 24px 60px rgba(10,10,14,.18)}
.modal h2{margin:0 0 6px;font-size:18px;font-weight:600}

.form{display:grid;gap:12px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;max-width:calc(100% - 32px)}

/* ---------- Шаблоны ---------- */

/* меню-панель в стиле Arc */
.side-btn{flex:none;margin-right:-14px}

body.side-pinned .side-btn{color:var(--ink)}

#taskLayer .backdrop{z-index:30}

.player.mini{width:min(100%,360px);margin-top:0}
.vthumb{position:relative;flex:none;width:min(100%,220px);aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#111;cursor:pointer;padding:0}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85;transition:opacity .15s}
.vthumb:hover img{opacity:1}
.vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;font-size:15px;padding-left:3px}
.vmeta{display:grid;gap:3px;font-size:13px;align-content:start;min-width:140px}
.vmeta b{font-weight:600}.vmeta .link{justify-self:start;font-size:13px}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
.ck{list-style:none;margin:0;padding:0}
.ck li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.ck li small{grid-column:1;color:var(--muted);font-size:12px;padding-left:28px}
.ck.sortable li{grid-template-columns:20px minmax(0,1fr);column-gap:6px}
.ck.sortable li .grip{grid-row:1}
.ck.sortable li small{grid-column:2}
.ckb li input.ckb-chk{flex:none;width:18px;height:18px;min-width:18px;margin:0 4px;padding:0;border:0;accent-color:var(--g);cursor:pointer}
.ckb li input.is-done{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.ck-box{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px}
.ck-box input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--g);flex:none;cursor:pointer}
.ck li.on .ck-txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.ck-tools{grid-row:1;grid-column:2;display:flex;gap:2px;opacity:.35}
.ck li:hover .ck-tools,.ck li:focus-within .ck-tools{opacity:1}
.ck-tools button{width:26px;height:26px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--muted)}
.ck-tools button:hover{background:var(--surface-2);color:var(--ink)}
.ck-tools button:disabled{visibility:hidden}
.ck-add{display:flex;gap:8px;margin-top:10px}
.ck-add input{flex:1;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;font-size:14px}

/* ---------- Производство → Проект ---------- */
.pf{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.pf-list{position:sticky;top:76px;display:grid;gap:8px;max-height:calc(100vh - 100px);grid-template-rows:auto minmax(0,1fr)}
.pf-list input{height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 11px;font-size:14px;width:100%}
.pf-items{overflow-y:auto;display:grid;gap:4px;align-content:start;padding-right:2px}
.pf-item{display:grid;gap:3px;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:8px 10px;cursor:pointer}
.pf-item:hover{background:var(--surface)}
.pf-item.on{background:var(--surface);border-color:var(--ink)}
.pf-name{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px;line-height:1.3}
.pf-item small{color:var(--muted);font-size:12.5px;padding-left:16px}
.pf-mini{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-left:16px}
.pf-mini i{display:block;height:100%;background:var(--ink)}
.pf-mini.big{height:6px;margin:0;width:180px}
.pf-select{display:none;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 11px;font-size:14px;max-width:100%}
.pf-main{min-width:0}
.pf-head{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.pf-head h2{margin:0;font-size:20px;font-weight:600}
.pf-head small{color:var(--muted);font-size:13px}
.pf-pos{display:grid;gap:4px;justify-items:end;font-size:14px}
.pf-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.pf-col{flex:0 0 250px;min-width:0;background:var(--surface-2);border:1px solid transparent;border-radius:var(--radius);padding:10px}
.pf-col.cur{background:var(--surface);border:2px solid var(--ink);padding:9px}
.pf-col.passed{opacity:.72}
.pf-col header{display:grid;gap:3px;margin:2px 4px 10px}
.pf-col header div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pf-col header b{font-weight:600;font-size:14px}
.pf-col header small{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center}
.pf-now{font-size:11px;font-weight:600;background:var(--ink);color:var(--surface);border-radius:6px;padding:1px 7px}
.pf-cards{display:grid;gap:8px}
.pf-card{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:pointer;position:relative}
.pf-card:hover{border-color:var(--line-strong)}
.pf-card b{font-weight:500;font-size:14px;line-height:1.35}
.pf-card small{color:var(--muted);font-size:12.5px}
.pf-card .tk-bar{margin-top:2px}
.pf-card.done{background:var(--g-bg);border-color:var(--g)}
.pf-card.done .tk-bar i{background:var(--g)}
.pf-card.here{border:2px solid var(--b);padding:9px 10px;box-shadow:0 0 0 4px var(--b-bg)}
.pf-tick{cursor:pointer}
.pf-tick-row{display:flex;gap:8px;align-items:flex-start}
.pf-tick-row input{width:16px;height:16px;margin:2px 0 0;flex:none;accent-color:var(--g);cursor:pointer}
.pf-status{margin-top:6px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;font-size:13px;max-width:100%}
.pf-here{justify-self:start;font-size:11px;font-weight:600;color:#fff;background:var(--b);border-radius:6px;padding:1px 7px}
.pf-add{display:flex;gap:6px;margin-top:8px}
.pf-add input{flex:1;min-width:0;height:32px;border:1px dashed var(--line-strong);border-radius:8px;background:transparent;padding:0 9px;font-size:13px}
.pf-add input:focus{border-style:solid;outline:0;background:var(--surface)}
.pf-add .ghost{padding:0 10px;height:32px}
@media (max-width:860px){
  .pf{grid-template-columns:1fr}
  .pf-list{display:none}
  .pf-select{display:block}
  .pf-pos{justify-items:start}
}

/* ---------- Облачное сохранение ---------- */
#cloudBtn::after{content:"";position:absolute;right:6px;bottom:7px;width:7px;height:7px;border-radius:50%;background:var(--n);box-shadow:0 0 0 2px var(--surface)}
#cloudBtn[data-state="saved"]::after,.cdot[data-state="saved"]{background:var(--g)}
#cloudBtn[data-state="saving"]::after,#cloudBtn[data-state="loading"]::after,.cdot[data-state="saving"],.cdot[data-state="loading"]{background:var(--y)}
#cloudBtn[data-state="error"]::after,.cdot[data-state="error"]{background:var(--r)}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--n);display:inline-block;margin-right:8px;vertical-align:1px}
.cloud-pop{padding:12px 14px}
.cloud-pop h3{margin:2px 0 8px}
.cloud-pop p{margin:0 0 8px;font-size:14px;line-height:1.5}

/* ---------- Карточка подэтапа: просмотр / редактирование ---------- */
.tk-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.tk-headtxt{flex:1;min-width:0}
.tk-headtxt small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:2px}
.tk-headtxt h2{margin:0;font-size:20px;font-weight:600;line-height:1.3}
.tk-head .ghost{flex:none}
.tk-reg{display:inline-flex;text-decoration:none;color:var(--ink);margin-top:8px}
.tk-role{margin:16px 0 0}
.tk-form{gap:14px}
.tk-form textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px;font-size:14px;line-height:1.5;resize:vertical;min-height:130px}
.tk-form .row input{flex:1;min-width:180px}
.ckb{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px}
.ckb li{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:4px 6px;background:var(--surface)}
.ckb li input{flex:1;min-width:0;height:32px;border:1px solid transparent;border-radius:7px;background:transparent;padding:0 7px;font-size:14px}
.ckb li input:focus{border-color:var(--line-strong);outline:0}
.ckb li button{width:30px;height:30px;flex:none;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--muted)}
.ckb li button:hover{background:var(--surface-2);color:var(--ink)}
.ckb li button:disabled{visibility:hidden}
.ckb .grip{flex:none}
.ckb-x{opacity:0;transition:opacity .12s}
.ckb li:hover .ckb-x,.ckb-x:focus-visible{opacity:1}
.ckb-x:hover{color:var(--r)!important}
@media (hover:none){.ckb-x{opacity:.6}}
.ckb-done{color:var(--g);font-size:13px}
.ckb-add input{flex:1;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;font-size:14px}
.tk-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}

/* ---------- Шеринг ---------- */
.pf-row{position:relative}
.pf-row .pf-item{width:100%;padding-right:40px}
.pf-share{position:absolute;right:6px;top:7px;z-index:1;height:28px;min-width:28px;padding:0 6px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:3px;font-size:12px}
.pf-share svg{width:14px;height:14px}
.pf-share:hover{background:var(--surface-2);color:var(--ink)}
.pf-share.on{color:var(--b)}
.pf-sharebtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px}
.pf-sharebtn svg{width:14px;height:14px}
.share-modal .row input{flex:1;min-width:160px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;font-size:14px}
.share-modal .row select{height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 8px;font-size:14px}
.sh-res,.sh-mem{list-style:none;margin:8px 0;padding:0;display:grid;gap:4px}
.sh-hit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;cursor:pointer}
.sh-hit:hover{border-color:var(--ink)}
.sh-hit b{font-weight:500}.sh-hit small{grid-column:1;color:var(--muted);font-size:12.5px}
.sh-hit span{grid-row:1/3;grid-column:2;align-self:center;color:var(--link);font-size:13.5px;font-weight:500}
.sh-mem li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.sh-who{flex:1;min-width:0}.sh-who b{display:block;font-weight:500;font-size:14px}.sh-who small{color:var(--muted);font-size:12.5px}
.sh-mem select{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 6px;font-size:13px}
.sh-h{font-size:14px;font-weight:600;margin:14px 0 2px}
.mine-h{margin:0;font-size:18px;font-weight:600}
body.guest .tabs button:not([data-view="mine"]):not([data-view="mytasks"]):not([data-view="review"]),body.guest #filters,body.guest #newBtn,body.guest #cloudBtn{display:none!important}
.sh-link{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.sh-link input{flex:1;min-width:180px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);padding:0 8px;font-size:13px}
.sh-link small{color:var(--muted);font-size:12.5px;flex-basis:100%}
.sh-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:11.5px;font-weight:500;vertical-align:1px}
.join-box{max-width:520px;margin:32px auto;padding:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-align:left}
.join-box h2{margin:0 0 6px;font-size:18px;font-weight:600}
.join-box p{margin:0 0 12px;color:var(--muted);font-size:14px}
.join-box form{display:flex;flex-wrap:wrap;gap:8px}
.join-box input{flex:1;min-width:200px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);padding:0 10px;font-size:14px}
.join-box .err{color:var(--r);font-size:13.5px;margin-top:8px;min-height:1em}
/* =====================================================================
   МОБИЛЬНАЯ ВЕРСИЯ (телефон до 640px)
   ===================================================================== */
.dash>*{min-width:0}
.mnav,.more-sheet{display:none}
@media (max-width:640px){
  body{font-size:15px}
  input,select,textarea{font-size:16px!important}                 /* iOS не приближает поле при фокусе */
  .top{min-height:54px;padding:0 10px 0 14px;gap:0 8px}
  .brand{padding:10px 0;font-size:16px}
  .top .tabs{display:none}
  .top-actions{padding:8px 0;gap:2px}
  .icon-btn{width:40px;height:40px}
  /* «Новый проект» — круглая кнопка над нижним меню */
  #newBtn{position:fixed;z-index:15;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:56px;height:56px;padding:0;border-radius:50%;
    font-size:0;box-shadow:0 8px 24px rgba(10,10,14,.22)}
  #newBtn::before{content:"+";font-size:30px;line-height:1;font-weight:400}
  /* нижнее меню */
  .mnav{display:flex;position:fixed;z-index:14;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
    padding:0 4px env(safe-area-inset-bottom,0px)}
  .mnav button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    height:60px;padding:0 2px;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer}
  .mnav button svg{width:22px;height:22px}
  .mnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mnav button[aria-current="page"]{color:var(--ink)}
  .mnav button[aria-current="page"] svg{stroke-width:2.4}
  body.guest .mnav{display:flex}
  main{padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 150px)}
  body.guest main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 90px)}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}
  body.guest .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 76px)}
  /* фильтры: одна строка статусов + поиск, остальное по кнопке */
  .filters{padding:12px 12px 0;gap:10px}
  #chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px;padding:0 12px 2px;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  #chips .chip{flex:none}
  .filters .row{gap:8px}
  #q{flex:1 1 0;min-width:0;width:auto}
  .f-toggle{display:inline-flex;align-items:center;gap:6px;position:relative;height:40px}
  .f-toggle i{width:7px;height:7px;border-radius:50%;background:var(--r);display:none}
  .f-toggle.on i{display:block}
  .filters:not(.open) label.inl,.filters:not(.open) #density,.filters:not(.open) #tags,.filters:not(.open) #reset{display:none!important}
  .filters .row > label.inl:first-of-type{margin-left:0}
  .filters #q{flex:1 1 0;min-width:0}
  .filters.open .row > label.inl{flex:1 1 100%}
  #tags{padding:0;border:0;background:none}
  .filters.open label.inl{flex:1 1 100%;display:flex;justify-content:space-between;align-items:center}
  .filters.open label.inl select{flex:1 1 100%;width:100%}
  #tags{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 2px}
  #tags>*{flex:none;white-space:nowrap}
  /* окна — снизу, как в приложениях */
  .modal,.tk-modal{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:92dvh;border-radius:18px 18px 0 0;
    border-left:0;border-right:0;border-bottom:0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
  .modal::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line-strong);margin:-8px auto 12px}
  .modal .actions{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);margin:14px -16px calc(-18px - env(safe-area-inset-bottom,0px));
    padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);border-top:1px solid var(--line);display:flex;gap:8px}
  .modal .actions>button{flex:1;min-height:44px}
  .modal .two{grid-template-columns:1fr}
  .drawer{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);border-left:0}
  .pop{left:8px;right:8px;width:auto;top:calc(env(safe-area-inset-top,0px) + 58px);max-height:75dvh}
  /* таблицы и доски */
  .mx .pcol{min-width:150px;max-width:170px}
  .kb,.pf-board{scroll-snap-type:x mandatory;margin:0 -12px;padding:0 12px 12px;scroll-padding:0 12px}
  .col,.pf-col{flex:0 0 84vw;width:84vw;scroll-snap-align:start}
  .kb-head select,.fn-head-row select,.rp-head select{flex:1 1 100%;height:42px}
  .fn-head-row{flex-wrap:wrap}
  .pf-head{flex-direction:column;align-items:stretch}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat{padding:12px}
  .stat b{font-size:21px}
  .panel{padding:14px}
  .team-head .primary,.rp-head .primary{min-height:40px}
  .share-modal .row{flex-wrap:wrap}
  .share-modal .row input{flex:1 1 100%}
  .share-modal .row select,.share-modal .row .primary{flex:1;min-height:42px}
  .sh-link input{flex:1 1 100%}
  .join-box{margin:16px 0;padding:16px}
  .join-box form>*{flex:1 1 100%;min-height:44px}
  .ghost,.primary{min-height:38px}
  .tk-head{flex-wrap:wrap}
  .tk-headtxt{flex:1 1 calc(100% - 52px);order:0}
  .tk-head .close{order:1}
  .tk-head .ghost{order:2}
  .tk-headtxt h2{font-size:18px}
  .mnav button{font-size:10.5px;letter-spacing:-.01em}
}
/* лист «Ещё» */
@media (max-width:640px){
  .more-sheet{display:block}
  .more-sheet .mlist{display:grid;gap:4px;margin:4px 0 0}
  .more-sheet .mlist button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 6px;border-radius:10px;font-size:16px;color:var(--ink);cursor:pointer}
  .more-sheet .mlist button svg{width:22px;height:22px;color:var(--muted)}
  .more-sheet .mlist button[aria-current="page"]{background:var(--surface-2);font-weight:600}
}
/* ---------- Главная на телефоне: карточки проектов ---------- */
.pc-list{display:grid;gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative}
.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--n)}
.pc.r-red::before{background:var(--r)}.pc.r-yellow::before{background:var(--y)}.pc.r-blue::before{background:var(--b)}.pc.r-green::before{background:var(--g)}.pc.r-done::before{background:var(--line-strong)}
.pc-main{display:grid;gap:4px;width:100%;text-align:left;border:0;background:none;padding:12px 14px 10px 16px;cursor:pointer;color:var(--ink);font:inherit}
.pc-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.pc-top b{font-size:15.5px;font-weight:600;line-height:1.3}
.pc-badge{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted)}
.b-red{background:var(--r-bg);color:var(--r)}.b-yellow{background:var(--y-bg);color:var(--y)}.b-blue{background:var(--b-bg);color:var(--b)}.b-green{background:var(--g-bg);color:var(--g)}
.pc-sub{color:var(--muted);font-size:13px}
.pc-now{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin-top:6px}
.pc-now b{font-size:15px;font-weight:600}
.pc-lbl{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.pc-state{font-size:13.5px;color:var(--muted)}
.s-redt{color:var(--r);font-weight:600}.s-yellowt{color:var(--y);font-weight:600}.s-bluet{color:var(--b);font-weight:600}.s-greent{color:var(--g);font-weight:600}.s-grayt{color:var(--muted);font-weight:600}.s-donet{color:var(--ink);font-weight:600}
.pc-none{color:var(--y)}

.mc-tt{flex:1;min-width:0;display:grid;gap:3px}

.mc-badges .mc-dl{margin-left:0}

.mc .mc-subnow{color:var(--muted);font-size:12.5px;margin-top:-2px}
/* ---------- Телефон: Производство — текущий проект и выдвижной список ---------- */
.pm-head{padding:8px;gap:2px;grid-template-columns:minmax(0,1fr)}

.pm-cnt svg{width:18px;height:18px}
.pm-nav .pm-meta{flex:1;min-width:0;display:block;padding:0 4px;text-align:center;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-nav .pf-sharebtn{margin:0;position:relative}
.pm-nav .icon-btn svg{width:18px;height:18px}
.pm-sc{position:absolute;top:4px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--b);color:#fff;font-size:10px;font-weight:700;line-height:16px}
.pk-sheet{display:flex;flex-direction:column;padding:14px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.pk-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.pk-head b{font-size:17px;font-weight:600}.pk-head b span{color:var(--muted);font-weight:400;margin-left:4px}
#pkQ{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);padding:0 12px;margin-bottom:8px}
.pk-list{display:grid;gap:2px;overflow-y:auto;min-height:0}
.pk-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:8px;border-radius:12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-height:56px}

.pk-row .chip-i .pi{width:18px;height:18px}
/* ---------- Телефон: одно меню — нижняя панель + лист «Ещё» ---------- */
@media (max-width:640px){
  .side-btn,#side,#sideBack{display:none!important}

  .view-name{display:block;border-left:0;padding-left:2px;color:var(--ink);font-size:17px;font-weight:600}
  .more-sheet{padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 16px)}

  .more-sheet .side-me b{font-size:15px}
  .more-sheet .mlist{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
  .more-sheet .mlist button{flex-direction:column;justify-content:center;gap:7px;padding:14px 4px;min-height:78px;border-radius:14px;background:var(--surface-2);font-size:13px;text-align:center}

  .more-sheet .mlist button[aria-current="page"]{background:var(--ink);color:var(--surface)}
  .more-sheet .mlist button[aria-current="page"] svg{color:var(--surface)}
  .m-spaces{display:grid;gap:8px;margin-top:16px}
  .m-splist{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 2px}
  .m-splist::-webkit-scrollbar{display:none}
  .m-sp{flex:none;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 6px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
  .m-sp.cur{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);font-weight:600}
}

/* ---------- Светлая тема: слои фона (подложка серая, блоки белые) ---------- */
.grp .scroll:has(table.cx){background:var(--tbl-bg,transparent);border:1px solid var(--tbl-bd,transparent);border-radius:var(--radius)}
:root{--tbl-bd:#E9ECEF}
.pc-list:has(.mc){background:var(--tbl-bg,transparent);border:1px solid var(--tbl-bd,transparent);border-radius:var(--radius);padding:0 12px}
.top{background:var(--top-bg,var(--surface))}
@media (min-width:641px){.top{background:var(--top-bg,color-mix(in srgb,var(--bg) 86%,transparent));backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}}
.side{background:var(--side-bg,linear-gradient(180deg,color-mix(in srgb,var(--space,var(--brand)) 14%,var(--surface)),color-mix(in srgb,var(--space,var(--brand)) 6%,var(--surface))))}
@media (min-width:1101px){
  body.side-pinned .side{top:0;left:0;bottom:0;border-radius:0;border:0;border-right:1px solid var(--side-bd,color-mix(in srgb,var(--space,var(--brand)) 30%,var(--line)))}
}
.side-nav button[aria-current="page"]{background:var(--surface)}
/* плашки статусов: пастельный фон, тёмный текст */
.pill.st-pill.s-red{background:var(--pl-r-bg,color-mix(in srgb,currentColor 12%,transparent));color:var(--pl-r,var(--r))}
.pill.st-pill.s-blue{background:var(--pl-b-bg,color-mix(in srgb,currentColor 12%,transparent));color:var(--pl-b,var(--b))}
.pill.st-pill.s-green{background:var(--pl-g-bg,color-mix(in srgb,currentColor 12%,transparent));color:var(--pl-g,var(--w))}
.pill.st-pill.s-maint{background:var(--pl-m-bg,color-mix(in srgb,currentColor 12%,transparent));color:var(--pl-m,var(--m))}
.pill.st-pill.s-gray{background:var(--pl-n-bg,color-mix(in srgb,currentColor 12%,transparent));color:var(--pl-n,var(--muted))}
.pill.st-pill.s-yellow{background:var(--pl-y-bg,color-mix(in srgb,currentColor 12%,transparent));color:var(--pl-y,var(--y))}
.pill.st-pill.s-done{background:var(--pl-d-bg,color-mix(in srgb,currentColor 12%,transparent));color:var(--pl-d,var(--g))}
.pill.st-pill:where(.s-red,.s-blue,.s-green,.s-maint,.s-gray,.s-yellow,.s-done){border-color:var(--pl-bd,color-mix(in srgb,currentColor 38%,transparent))}
:root{--pl-bd:transparent}
/* в тёмной теме — всё как было */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fbd:initial; --seg-on:initial; --tbl-bg:initial; --tbl-bd:initial; --side-bg:initial; --side-bd:initial; --top-bg:initial; --pl-bd:initial;
  --pl-r-bg:initial; --pl-r:initial; --pl-b-bg:initial; --pl-b:initial; --pl-g-bg:initial; --pl-g:initial; --pl-m-bg:initial; --pl-m:initial;
  --pl-n-bg:initial; --pl-n:initial; --pl-y-bg:initial; --pl-y:initial; --pl-d-bg:initial; --pl-d:initial}}
:root[data-theme="dark"]{
  --fbd:initial; --seg-on:initial; --tbl-bg:initial; --tbl-bd:initial; --side-bg:initial; --side-bd:initial; --top-bg:initial; --pl-bd:initial;
  --pl-r-bg:initial; --pl-r:initial; --pl-b-bg:initial; --pl-b:initial; --pl-g-bg:initial; --pl-g:initial; --pl-m-bg:initial; --pl-m:initial;
  --pl-n-bg:initial; --pl-n:initial; --pl-y-bg:initial; --pl-y:initial; --pl-d-bg:initial; --pl-d:initial}

/* ---------- Производство (компьютер): список проектов с тонкой прокруткой, «Поделиться» иконкой справа ---------- */
.pf-row .pf-item{padding-right:10px}
.pf-items{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;padding-right:6px}

.pf-items::-webkit-scrollbar-track{background:transparent}
.pf-head{align-items:flex-start;flex-wrap:nowrap}
.pf-shareic{position:relative;flex:none;width:36px;height:36px;border:1px solid var(--fbd,var(--line));background:var(--surface);border-radius:10px;color:var(--muted)}
.pf-shareic:hover{color:var(--ink)}
.pf-shareic svg{width:16px;height:16px}
.pf-shareic.on{color:var(--b)}
.pf-shareic span{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--b);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center}
.fn-head-row.pf-top{margin:0}
@media (min-width:861px){.fn-head-row.pf-top{display:none}}
.pf{margin-top:6px}

/* ---------- Телефон: чистый вид (шапка с иконками, фильтры в шторке, карточки) ---------- */
.pava.m36{width:36px;height:36px;font-size:12.5px;border-radius:11px}
.m-only{display:none}
:root{--card-bd:#EEF0F2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card-bd:initial}}
:root[data-theme="dark"]{--card-bd:initial}
@media (max-width:640px){
  .top{min-height:56px;padding:0 6px 0 16px;gap:0 4px}
  .top .brand{display:none}
  .view-name{order:-1;margin-right:auto;padding:0;font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
  .top-actions{gap:0;padding:6px 0}
  .top .icon-btn{width:40px;height:40px;position:relative}
  .top .icon-btn svg{width:20px;height:20px}
  body[data-view="matrix"] .m-list,body[data-view="kanban"] .m-list{display:grid;place-items:center}
  #mSearch[aria-pressed="true"]{color:var(--brand)}
  .m-badge{position:absolute;top:4px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--brand);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center}
  /* «+» в шапке вместо круглой кнопки */
  #newBtn{position:static;width:40px;height:40px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--ink);box-shadow:none;font-size:0;display:grid;place-items:center}
  #newBtn::before{content:"";width:20px;height:20px;background:currentColor;
    -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>') center/contain no-repeat;
            mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>') center/contain no-repeat}
  #filters{display:none!important}
  main{padding:4px 16px calc(env(safe-area-inset-bottom,0px) + 92px)}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}
  .m-search{display:flex;gap:4px;align-items:center;margin:4px 0 4px}
  .m-search input{flex:1;height:44px;border:1px solid var(--fbd,var(--line));border-radius:12px;background:var(--surface);color:var(--ink);padding:0 14px}
  /* заголовки категорий */
  .grp > h2{font-size:12.5px!important;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 12px;padding:0 2px;display:flex;align-items:center;gap:6px}
  .grp > h2 span{font-weight:600;opacity:.75}
  .grp > h2 .cat-dot,.grp > h2 .catd{display:none}
  .grp{margin-top:24px}
  main > .grp:first-child,.m-search + .grp{margin-top:8px}
  /* карточки проектов */
  .pc-list:has(.mc){background:none;border:0;border-radius:0;padding:0;gap:10px}
  .pc-list .mc,.pc-list .mc:last-child{background:var(--surface);border:1px solid var(--card-bd,var(--line));border-radius:16px;box-shadow:none}
  .mc .mc-main{padding:14px 14px 13px;gap:10px}
  .mc-top{display:flex;align-items:center;gap:12px;min-width:0}
  .mc-top .pill{flex:none;align-self:flex-start;margin-top:1px}
  .mc-top .mc-tt{flex:1;min-width:0;display:grid;gap:2px}
  .mc-top .mc-tt b{font-size:16px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
  .mc-top .mc-tt small{font-size:12px;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-hp{font-style:normal;color:var(--r)}
  .mc-mid{display:flex;align-items:center;gap:6px;min-width:0}
  .mc-mid .tprog{margin:0;min-width:0;flex:0 1 auto;overflow:hidden}
  .mc-mid .tp-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .mc-age{flex:none;font-size:12px;color:var(--muted);white-space:nowrap}.mc-age.slow{color:var(--y)}
  .top #bell{border:0;background:transparent;box-shadow:none}
  .mc-bot{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted)}
  .mc-bot svg{width:13px;height:13px;flex:none}
  .mc-bot.dl-over{color:var(--r)}.mc-bot.dl-warn{color:var(--y)}.mc-bot.dl-client{color:var(--b)}.mc-bot.dl-m{color:var(--m)}.mc-bot.dl-done{color:var(--g)}
}
/* шторка фильтров */
.fs-sheet{display:flex;flex-direction:column;padding:14px 0 0}
.fs-head{display:flex;justify-content:space-between;align-items:center;padding:0 18px 10px}
.fs-head b{font-size:18px;font-weight:700}
.fs-body{overflow-y:auto;padding:0 18px;display:grid;gap:20px;min-height:0}
.fs-body h3{margin:0 0 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fs-chips{display:flex;flex-wrap:wrap;gap:8px}
.fs-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--fbd,var(--line));background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.fs-chip small{color:var(--muted);font-size:12.5px}
.fs-chip[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2);font-weight:600}
.fs-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:12px;background:var(--surface-2)}

.fs-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.fs-foot{padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid var(--line);margin-top:14px}
.fs-foot .primary{width:100%;height:48px;border-radius:12px;font-size:15px}

/* ---------- Телефон: тот же чистый стиль на остальных экранах ---------- */
@media (max-width:640px){
  :root{--radius:16px}
  /* заголовок раздела уже в шапке — не повторяем; пояснения прячем */
  .fn-head-row{margin:4px 0 14px;gap:8px}
  .fn-head-row > .td-title,.fn-head-row > .mine-h,.fn-sum,.kb-tip{display:none}
  .seg-toggle{max-width:100%;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
  .seg-toggle::-webkit-scrollbar{display:none}
  .seg-toggle button{flex:none;white-space:nowrap}
  .fn-head-row select,.kb-head select{height:42px;border-radius:12px;flex:1 1 180px;min-width:0;background:var(--surface);border:1px solid var(--fbd,var(--line))}
  /* подзаголовки блоков — как заголовки категорий */
  .dt-h,.kb .col > h3,.panel > h3,.panel > h2{font-size:12.5px!important;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .dt-h{margin:20px 2px 12px}
  /* карточки: белые, скругление 16, мягкая рамка, без теней */
  .panel,.stat,.dt-proj-sec,.member,.pm-head,.pf-col{border-radius:16px;border:1px solid var(--card-bd,var(--line));box-shadow:none}
  .panel,.stat{background:var(--surface)}
  .dt-proj-sec{background:var(--surface);padding:12px 14px;margin:0 0 10px;border-top:1px solid var(--card-bd,var(--line))}
  /* канбан: колонка почти на всю ширину, листаются свайпом */
  .kb{gap:12px;margin:0 -16px;padding:0 16px 12px;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none}
  .kb::-webkit-scrollbar{display:none}
  .kb .col{flex:0 0 calc(100vw - 48px);width:calc(100vw - 48px);background:transparent;border:0;padding:0;scroll-snap-align:start;min-height:0}
  .kb .col > h3{display:flex;align-items:center;gap:8px;margin:0 2px 12px}
  .kb .card{background:var(--surface);border:1px solid var(--card-bd,var(--line));border-radius:16px;padding:14px;box-shadow:none;margin-bottom:10px}
  .kb .card .t{font-size:16px;font-weight:700;line-height:1.3}
  .kb .card .t .pava{width:36px;height:36px;font-size:12.5px;border-radius:11px;margin-right:10px}
  .kb .card .meta{font-size:12.5px}
  .kb .card .meta.subnow + .meta{display:none}
  .kb .col-add{flex:0 0 auto;align-self:flex-start}
  .dt-proj-sec .dt-fold{flex-wrap:wrap;align-items:center;row-gap:2px;text-align:left}
  .dt-proj-sec .dt-fold b{font-size:16px;font-weight:700;flex:1;min-width:0}
  .dt-proj-sec .dt-fold small{flex-basis:100%;padding-left:52px;font-size:12px;color:var(--muted)}
  .dt-proj-sec .dt-fold .pava{width:30px;height:30px;font-size:11px;border-radius:9px}
  .dt-proj-sec .dt-due{font-size:12.5px}
}

/* материалы исполнителя и запрос на переход */
.tflags{display:flex;gap:12px;align-items:center}

svg.clip{width:14px;height:14px;flex:none}

.pf-matn svg{width:12px;height:12px}
.pf-tickwrap{display:grid;gap:4px}
.pf-mat{display:inline-flex;align-items:center;gap:6px;justify-self:start;border:0;background:none;padding:2px 4px;font:inherit;font-size:12.5px;color:var(--link);cursor:pointer}
.mats{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.mat{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.gate{display:grid;gap:6px;margin-top:8px}
.gate-btn{width:100%;justify-content:center}

<script>
// =====================================================================
//  ДЕМО-РЕЖИМ: данные хранятся в браузере. Для работы с сервером замените
//  функции из блока ACTIONS на вызовы API (см. README).
// =====================================================================
// Пространства: отдельные наборы проектов в одном аккаунте. Основное — data/users/<id>,
// остальные — data/users/<id>/spaces/list/<пространство>/items. Текущее помнит браузер.
const SPACE_KEY = 'kz-space';
// Руководитель в чужой команде работает в основном пространстве владельца (data/users/<владелец>).
// Какое открыто — помнит браузер (kz-org); «свои проекты» выбраны явно — kz-org-own.
const ORG_KEY = 'kz-org', ORG_OWN_KEY = 'kz-org-own';
const ORG = (() => { try { const v = localStorage.getItem(ORG_KEY) || ''; return /^[0-9a-f-]{36}$/i.test(v) ? v : ''; } catch(e) { return ''; } })();
const SPACE = (() => { if (ORG) return ''; try { const v = localStorage.getItem(SPACE_KEY) || ''; return /^s[a-z0-9]{4,24}$/.test(v) ? v : ''; } catch(e) { return ''; } })();
const KEY = ORG ? `agency-pipeline-demo-v2-o-${ORG}` : SPACE ? `agency-pipeline-demo-v2-${SPACE}` : 'agency-pipeline-demo-v2';
const spacePath = (uid, sp) => sp ? `data/users/${uid}/spaces/list/${sp}/items` : `data/users/${uid}`;
// «Я» в данных: у владельца — запись 'me', у руководителя — его запись в команде владельца
let ME = (() => { try { return (ORG && localStorage.getItem(`agency-pipeline-demo-v2-o-${ORG}-me`)) || 'me'; } catch(e) { return 'me'; } })();
const STATUS = { not_started:'Не начат', in_progress:'В работе', client_review:'На согласовании у клиента', done:'Завершён' };
const RISK = [['red','Просрочено'],['yellow','Горит'],['blue','У клиента'],['green','В графике'],['maint','На ведении'],['gray','Не стартовали'],['done','Завершены']];
const WEIGHT = { red:5, yellow:4, blue:3, green:2, maint:1.5, gray:1, done:0 };
const PRI = { high:['Высокий',3], medium:['Средний',2], low:['Низкий',1] };
const ROLES = { admin:'Руководитель', pm:'Менеджер проекта', specialist:'Исполнитель' };
const DEPTS = ['Руководство','Аккаунтинг (PM)','Креатив','Дизайн','Монтаж и моушн','Продакшн','Digital и таргет','Другое'];

// ---------- даты и форматирование ----------
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((parse(a)-parse(b))/864e5);
const mondayOf = s => addDays(s, -((parse(s).getDay()+6)%7));
const fmt = s => s ? parse(s).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}) : '—';
const plural = (n,a,b,c) => { n=Math.abs(n)%100; const k=n%10; if(n>10&&n<20) return c; if(k>1&&k<5) return b; if(k===1) return a; return c; };
const days = n => `${n} ${plural(n,'день','дня','дней')}`;
const money = n => (n==null || n==='') ? 'бюджет не указан' : n >= 1e6 ? `${(n/1e6).toLocaleString('ru-RU',{maximumFractionDigits:1})} млн ₽` : `${Math.round(n/1e3).toLocaleString('ru-RU')} тыс. ₽`;
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- светофор (та же логика, что в backend/src/schedule.js) ----------
function health(s, now = new Date()){
  if (isMaint(s)){
    if (s.status !== 'in_progress') return { key:'gray', label:'Не начат', note:'после воронки' };
    const rt = s.rtasks || []; const t0 = today(); const over = rt.filter(r => r.due_date && r.due_date < t0).length;
    if (over) return { key:'red', label:'Просрочено', note:`регулярных задач просрочено: ${over}` };
    if (rt.some(r => r.due_date && r.due_date <= addDays(t0, 1))) return { key:'yellow', label:'Ведение', note:'есть задача на сегодня или завтра' };
    return { key:'maint', label:'Ведение', note:rt.length ? `регулярных задач: ${rt.length}` : 'бессрочно' };

function addLog(p, text){ p.log.unshift({ at:new Date().toISOString(), user:ME, text }); }
// Проект на ведении: в конце цепочки — бессрочный системный этап «Ведение / Поддержка» (s.system = 'maint').
// Пока воронка не пройдена, он «не начат»; когда пройдена — «в работе», и проект не закрывается.
function syncMaint(p){
  if (!p || p._ext) return;
  let ms = p.stages.find(isMaint); const real = p.stages.filter(x => !isMaint(x));
  if (!p.is_maintenance){
    if (ms){ p.stages = real; p.stages.forEach((x, i) => x.position = i); addLog(p, 'Ведение выключено: этап «Ведение / Поддержка» убран'); }
    return;
  }
  const allDone = real.length > 0 && real.every(x => x.status === 'done');
  if (!ms){
    const last = real.at(-1); const st = last ? (allDone ? today() : last.due_date) : today();
    ms = { id:'m' + uid(), system:'maint', custom:true, name:'Ведение / Поддержка', days:0, approval:false, assignee_id:null, status:'not_started',
      started_at:null, completed_at:null, planned_start:st, due_date:st, subs:[], rtasks:[] };
    p.stages.push(ms);
  }
  if (p.stages.at(-1) !== ms){ p.stages = [...p.stages.filter(x => x !== ms), ms]; }
  p.stages.forEach((x, i) => x.position = i);
  const want = allDone ? 'in_progress' : 'not_started';
  if (ms.status !== want){
    ms.status = want; ms.completed_at = null;
    if (want === 'in_progress'){ ms.started_at = ms.started_at || today(); addLog(p, 'Воронка пройдена: проект перешёл на этап «Ведение / Поддержка»'); }
  }
}
function syncState(p){ syncMaint(p); const open = p.stages.some(s => s.status !== 'done'); if (!open) p.state='completed'; else if (p.state==='completed') p.state='active'; }
function shiftFrom(p, pos, delta){
  let n = 0;
  p.stages.forEach(s => { if (s.position > pos && s.status !== 'done'){ s.planned_start = addDays(s.planned_start, delta); s.due_date = addDays(s.due_date, delta); n++; } });
  return n;
}
// Живой пересчёт сроков. Незавершённые этапы выстраиваются от фактического конца предыдущего:
//  • идущий этап не двигаем — его срок показывает, опаздываем ли мы; но если он просрочен, следующие начнутся не раньше сегодня;
//  • этап закрыли раньше — следующие подтягиваются; не начатый этап не может стартовать в прошлом.
// Длительность каждого этапа сохраняется. Дедлайн клиента (p.deadline) не меняется — по нему видно отставание.
function replan(p, now = today()){
  if (!p || p._ext || p.state === 'archived' || !p.stages?.length) return false;
  let cursor = p.start_date, changed = false;
  for (const s of [...p.stages].sort((a, b) => a.position - b.position)){
    if (s.status === 'done'){ cursor = s.completed_at || s.due_date; continue; }
    if (s.status === 'in_progress' || s.status === 'client_review'){ cursor = s.due_date > now ? s.due_date : now; continue; }
    const dur = stageDur(s);
    const start = [cursor, p.start_date, now].reduce((m, d) => d > m ? d : m);
    const due = addDays(start, dur);
    if (s.planned_start !== start || s.due_date !== due){ s.planned_start = start; s.due_date = due; changed = true; }
    cursor = due;
  }
  return changed;
}
const replanAll = () => db.projects.reduce((n, p) => replan(p) ? n + 1 : n, 0);

function completeStage(p, s){

// PATCH /api/stages/:id { status }
function setStatus(p, s, status){

// Уместить план в финальный дедлайн: оставшиеся этапы сжимаются пропорционально (минимум 1 день на этап)
function fitToDeadline(p){
  if (!p.deadline) return;
  const left = p.stages.filter(s => s.status !== 'done').sort((a, b) => a.position - b.position);
  if (!left.length) return;
  const anchor = left[0].status === 'not_started' ? [left[0].planned_start, today()].reduce((m, d) => d > m ? d : m) : left[0].planned_start;
  const avail = diffDays(p.deadline, anchor), durs = left.map(stageDur), total = durs.reduce((a, b) => a + b, 0);
  if (avail < left.length){ toast(`До дедлайна ${days(Math.max(0, avail))}, а этапов ${left.length}: даже по дню на этап не уложиться. Перенесите дедлайн.`); return; }
  if (avail >= total){ toast('План уже укладывается в дедлайн'); return; }
  const next = durs.map(d => Math.max(1, Math.floor(d * avail / total)));
  for (let i = next.length - 1, extra = avail - next.reduce((a, b) => a + b, 0); extra > 0; i = (i - 1 + next.length) % next.length){ next[i]++; extra--; }
  for (let i = next.length - 1, over = next.reduce((a, b) => a + b, 0) - avail; over > 0; i = (i - 1 + next.length) % next.length){ if (next[i] > 1){ next[i]--; over--; } }

  left.forEach((s, i) => { if (s.status === 'not_started') s.planned_start = cur; s.due_date = addDays(s.status === 'not_started' ? cur : s.planned_start, next[i]); s.days = next[i]; cur = s.due_date; });

// фото проекта: обрезаем по центру в квадрат 160×160 и сжимаем — хранится прямо в проекте и видно всем участникам
async function squareImage(file, side = 160){
  const src = await createImageBitmap(file);
  const k = Math.min(src.width, src.height), c = document.createElement('canvas'); c.width = c.height = side;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, side, side);
  g.drawImage(src, (src.width - k) / 2, (src.height - k) / 2, k, k, 0, 0, side, side);
  let q = 0.86, url = c.toDataURL('image/jpeg', q);
  while (url.length > 60000 && q > 0.4){ q -= 0.12; url = c.toDataURL('image/jpeg', q); }
  return url;
}
document.addEventListener('change', async e => {
  if (e.target.id !== 'pImg') return; const p = projById(ui.open); const f = e.target.files?.[0]; e.target.value = '';
  if (!p || !f || p._ext) return;
  if (!/^image\//.test(f.type)){ toast('Это не картинка'); return; }
  try { p.image = await squareImage(f); addLog(p, 'Фото проекта обновлено'); commit(); renderDrawer(); toast('Фото проекта сохранено'); }
  catch(err) { toast('Не удалось обработать картинку. Попробуйте JPG или PNG.'); }
});

  if (ui.group === 'none') return [{ title:'Все проекты', items:list }];

// Срочность срока: over — просрочено, hot — 0–3 дня, warn — 4–7 дней, ok — больше недели
function urg(date){

  const d = diffDays(date, today());
  const k = d < 0 ? 'over' : d <= 3 ? 'hot' : d <= 7 ? 'warn' : 'ok';
  const txt = d < 0 ? `просрочено на ${days(-d)}` : d === 0 ? 'сегодня' : d === 1 ? 'завтра' : `через ${days(d)}`;
  return { k, d, txt };
}

// загрузка одного или нескольких файлов в «Сдачу работы»
async function uploadMats(t, files){
  files = [...(files || [])]; if (!files.length || !t) return;
  const F = window.claude?.use ? await window.claude.use('files').catch(() => null) : null;
  if (!F || !cloud.uid){ toast('Файлы можно прикреплять, когда вы вошли в аккаунт'); return; }
  const big = files.filter(f => f.size > F.maxSize); files = files.filter(f => f.size <= F.maxSize);
  if (big.length) toast(`Больше 50 МБ: ${big.map(f => f.name).join(', ')}. Загрузите в облако и добавьте ссылку`);
  const added = [], failed = [];
  ui.matUp = t.id; renderTaskModal();
  for (const file of files){
    try { const path = await F.upload(`${cloud.uid}/p/${t.project_id}/${uid()}-${safeFileName(file.name)}`, file); added.push({ id:uid(), kind:'file', path, name:file.name, size:file.size, by:meKey(), byName:actorName(), at:new Date().toISOString() }); }
    catch(err) { failed.push(`${file.name} — ${uploadErr(err)}`); }
  }
  ui.matUp = null;
  const tt = taskById(t.id) || t;
  if (added.length){ tt.mats = [...(tt.mats || []), ...added]; const p = projById(tt.project_id);

  renderTaskModal();
  if (failed.length) toast(`Не загрузились: ${failed.join('; ')}`); else if (added.length > 1) toast(`Загружено файлов: ${added.length}`);
}

function ticksHtml(p, key){
  const tk = key === 'green' ? 'prog' : key; const n = p.stages.length; const c = currentStage(p); const at = c ? p.stages.indexOf(c) : n;
  const bars = p.stages.map((s, i) => `<i class="${s.status === 'done' ? 'on' : i === at ? 'cur' : ''}" title="${i + 1}. ${esc(s.name)}"></i>`).join('');
  const txt = c ? `<span class="tp-n"><b>${at + 1}/${n}</b> ${esc(c.name)}</span>` : `<span class="tp-n"><b>${n}/${n}</b> Все этапы пройдены</span>`;
  return `<div class="tprog t-${tk}" role="img" aria-label="Этап ${c ? at + 1 : n} из ${n}${c ? ': ' + esc(c.name) : ''}"><span class="ticks">${bars}</span>${txt}</div>`;
}
const stPill = (key, label) => `<span class="pill st-pill s-${key}">${STATUS_ICO[key] || STATUS_ICO.gray}${label}</span>`;
function renderCompact(list){
  app.innerHTML = groupsFor(list).map(g => {
    const rows = g.items.map(p => {
      const c = currentStage(p);
      const h = c ? health(c) : { key:'done', label:'Завершён', note:'' };
      const n = p.stages.length;
      const stage = c ? esc(c.name) : 'Все этапы пройдены';
      // Прогресс: один сегмент на этап; сданные — акцентные, текущий — цветом статуса, будущие — пустые
      const doneN = p.stages.filter(s => s.status === 'done').length;
      const pct = Math.round(doneN / n * 100);
      const segs = p.stages.map(s => `<i class="pseg p-${s.status === 'done' ? 'done' : (c && s.id === c.id ? h.key : 'todo')}" title="${esc(s.name)}"></i>`).join('');
      const progress = ticksHtml(p, !c ? 'done' : h.key);
      const tm = getProjectTimeMetrics(p);
      return `<tr class="r-${h.key}" data-open="${p.id}"${c ? ` data-stage="${c.id}"` : ''} tabindex="0">
        <td title="${esc(p.name)}"><span class="cx-name">${projAva(p, 'sm')}<span class="cx-nt">${esc(p.name)}${p.priority==='high' ? '<span class="hp">Высокий</span>' : ''}<small>${esc(p.client)}</small></span></span></td>
        <td>${tm.isOverdue && h.key !== 'red' ? stPill('red', 'Просрочен') : stPill(h.key, h.label)}</td>
        <td>${progress}</td>
        <td class="start">${startCell(p, tm)}</td>
        <td class="due">${deadlineCell(p, tm)}</td></tr>`;
    }).join('');
    return `<section class="grp"><h2>${catDot(g.cat)}${esc(g.title)} <span>${g.items.length}</span></h2>
      <div class="scroll"><table class="cx"><colgroup><col class="c1"><col class="c3"><col class="c7"><col class="c6"><col class="c4"></colgroup>
      <thead><tr><th>Проект</th><th>Статус</th><th>Этап</th><th>Старт</th><th>Срок</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }).join('');
}

// кто отвечает за этап: свой ответственный, иначе исполнитель проекта (так же, как показано в матрице)
const stageWho = (p, s) => s.assignee_id || p.worker_id || null;
function workload(){
  const t = today();
  const active = db.projects.filter(p => p.state === 'active');
  const start = mondayOf(t);
  const weeks = Array.from({length:6}, (_,i) => ({ from:addDays(start, i*7), to:addDays(start, i*7+6) }));
  // загрузка = активные проекты, где человек назначен: PM, исполнитель проекта, ответственный за этап или подэтап
  const involved = (p, u) => p.pm_id === u.id || p.worker_id === u.id || p.stages.some(s => s.assignee_id === u.id)
    || (db.tasks || []).some(x => x.project_id === p.id && x.assignee_id === u.id);
  const rows = db.users.map(u => {
    const projs = active.filter(p => involved(p, u));
    const by = { red:0, yellow:0, blue:0, green:0 }; let soon = 0;
    projs.forEach(p => { if (p.start_date > t) soon++; else { const k = projectRisk(p); by[by[k] != null ? k : 'green']++; } });
    // по неделям: проект занимает человека от старта до расчётного финиша (просроченный — до сегодня)
    const heat = weeks.map(w => projs.filter(p => { const e = plannedEnd(p); const end = e < t ? t : e; return p.start_date <= w.to && end >= w.from; }).length);
    return { u, cur:projs.length, by, soon, heat, inProj:projs.length, pmOf:active.filter(p => p.pm_id === u.id).length };
  });
  const unassigned = [];
  active.forEach(p => p.stages.forEach(s => {
    if (!stageWho(p, s) && s.status !== 'done' && diffDays(s.planned_start, t) <= 14) unassigned.push({ p, s });
  }));
  unassigned.sort((a,b) => a.s.planned_start.localeCompare(b.s.planned_start));
  return { rows, weeks, unassigned, active };
}
function loadState(r){
  const cap = r.u.capacity || 1;
  if (r.cur > cap) return ['over', 'Перегружен'];
  if (r.cur === cap) return ['full', 'Полная загрузка'];
  if (r.cur === 0) return ['free', 'Свободен'];
  return ['free', `Свободно мест: ${cap - r.cur}`];
}

  const allStages = W.active.flatMap(p => p.stages);
  const inWork = allStages.filter(s => s.status === 'in_progress' || s.status === 'client_review');
  const overdue = inWork.filter(s => health(s).key === 'red').length;
  const overloaded = W.rows.filter(r => r.cur > (r.u.capacity || 1)).length;
  const budget = W.active.reduce((m,p) => m + (+p.budget || 0), 0);
  const scale = Math.max(1, ...rows.map(r => Math.max(r.cur, r.u.capacity || 1)));

    ${onlyMe ? `<div class="note-box"><p>В команде пока только вы. Пригласите сотрудников и назначьте их на этапы, чтобы увидеть, кто перегружен, а у кого есть свободное время.</p><button class="primary" data-invite>Пригласить в команду</button></div>` : ''}
    <section class="panel">

        <div class="field"><label for="iDept">Отдел</label><select id="iDept">${DEPTS.map(d => `<option ${d==='Креатив'?'selected':''}>${d}</option>`).join('')}</select></div>
