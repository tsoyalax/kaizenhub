const ui = { view:'matrix', prodMode:'project', prodTpl:'t1', prodOpen:{}, q:'', pms:[], clients:[], risk:'', sort:'risk', group:'template', kbTpl:'t1', dept:'',
  open:null, focusStage:null, tplSel:null, draft:null };
const $ = s => document.querySelector(s);
const app = $('#app'), layer = $('#layer');

function baseOk(p){
  if (p.state === 'archived') return false;
  if (ui.pms.length && !ui.pms.includes(p.pm_id)) return false;
  if (ui.clients.length && !ui.clients.includes(p.client)) return false;
  if (ui.q){
    const q = ui.q.toLowerCase();
    const hay = [p.name, p.client, nameOf(p.pm_id), p.worker_id ? nameOf(p.worker_id) : '', ...p.stages.map(s => s.assignee_id ? nameOf(s.assignee_id) : '')].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function riskOk(p){
  const r = projectRisk(p);
  if (ui.risk === 'done') return r === 'done';
  if (r === 'done') return false;
  return !ui.risk || r === ui.risk;
}
const SORTS = {
  risk:     (a,b) => WEIGHT[projectRisk(b)] - WEIGHT[projectRisk(a)] || plannedEnd(a).localeCompare(plannedEnd(b)),
  finish:   (a,b) => plannedEnd(a).localeCompare(plannedEnd(b)),
  deadline: (a,b) => (a.deadline || '9999').localeCompare(b.deadline || '9999'),
  priority: (a,b) => PRI[b.priority][1] - PRI[a.priority][1] || WEIGHT[projectRisk(b)] - WEIGHT[projectRisk(a)],
  budget:   (a,b) => (b.budget ?? -1) - (a.budget ?? -1),
  name:     (a,b) => a.name.localeCompare(b.name, 'ru')
};
const visible = () => db.projects.filter(p => baseOk(p) && riskOk(p)).sort(SORTS[ui.sort]);
const anyFilter = () => ui.q || ui.pms.length || ui.clients.length || ui.risk;

function renderFilters(){
  const show = ui.view === 'matrix' || ui.view === 'kanban';
  $('#filters').hidden = !show;
  const hot = hotStages();
  $('#bellCount').innerHTML = hot.length ? `<span class="badge">${hot.length}</span>` : '';
  if (!show) return;
  $('#groupWrap').hidden = ui.view !== 'matrix';
  $('#density').hidden = ui.view !== 'matrix';
  $('#density').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.density === density()));
  $('#sort').value = ui.sort; $('#group').value = ui.group;
  if ($('#q').value !== ui.q) $('#q').value = ui.q;
  $('#reset').hidden = !anyFilter();

  const pool = db.projects.filter(baseOk);
  const activeCount = pool.filter(p => p.state === 'active').length;
  $('#chips').innerHTML = `<button class="chip" data-risk="" aria-pressed="${!ui.risk}"><span class="sw all"></span>Все активные <b>${activeCount}</b></button>` +
    RISK.map(([k,label]) => {
      const n = pool.filter(p => projectRisk(p) === k).length;
      return `<button class="chip" data-risk="${k}" aria-pressed="${ui.risk===k}" title="Показать только: ${label.toLowerCase()}"><span class="sw ${k}"></span>${label} <b>${n}</b></button>`;
    }).join('');

  const live = db.projects.filter(p => p.state !== 'archived');
  const pmIds = [...new Set(live.map(p => p.pm_id))].filter(userById);
  const clientCounts = live.reduce((m,p) => (m[p.client] = (m[p.client]||0) + 1, m), {});
  const clientsSorted = Object.keys(clientCounts).sort((a,b) => clientCounts[b] - clientCounts[a]);
  $('#tags').innerHTML =
    (pmIds.length ? `<span class="tlabel">PM:</span>` + pmIds.map(id => `<button class="tag" data-tag-pm="${id}" aria-pressed="${ui.pms.includes(id)}">${esc(short(id))}<small>${live.filter(p=>p.pm_id===id).length}</small></button>`).join('') : '') +
    (clientsSorted.length ? `<span class="tlabel">Клиенты:</span>` + clientsSorted.map(c => `<button class="tag" data-tag-client="${esc(c)}" aria-pressed="${ui.clients.includes(c)}">${esc(c)}<small>${clientCounts[c]}</small></button>`).join('') : '');
}

function render(){
  if (GUEST) ui.view = 'mine';
  document.body.dataset.view = ui.view;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.view === ui.view ? 'page' : 'false'));
  $('#mineTab').hidden = !GUEST && !ext.projects.length && ui.view !== 'mine';
  renderFilters();
  ({ matrix:renderMatrix, kanban:renderKanban, production:renderProduction, mine:() => renderProjectFocus(true), reports:renderReports, load:renderLoad, team:renderTeam, templates:renderTemplates })[ui.view]();
  if (ui.open) renderDrawer();
  renderMobileNav();
}

// ---------- Матрица ----------
function groupsFor(list){
  if (ui.group === 'template') return db.templates.map(t => ({ title:t.name, tpl:t, items:list.filter(p => p.template_id === t.id) })).filter(g => g.items.length);
  if (ui.group === 'none') return [{ title:'Все проекты', items:list }];
  const keyOf = { pm:p => p.pm_id, client:p => p.client, priority:p => p.priority }[ui.group];
  const titleOf = { pm:k => 'PM: ' + nameOf(k), client:k => k, priority:k => PRI[k][0] + ' приоритет' }[ui.group];
  let keys = [...new Set(list.map(keyOf))];
  if (ui.group === 'priority') keys.sort((a,b) => PRI[b][1] - PRI[a][1]);
  return keys.map(k => ({ title:titleOf(k), items:list.filter(p => keyOf(p) === k) }));
}
function renderMatrix(){
  const list = visible();
  if (!db.projects.some(p => p.state !== 'archived')){ app.innerHTML = `<div class="empty">Проектов пока нет. Запустите первый по готовому шаблону.<br><button class="primary" id="emptyCreate">Новый проект</button></div>`; return; }
  if (IS_PHONE.matches) return renderPhoneList(list);
  if (!list.length){ app.innerHTML = `<div class="empty">Под фильтры не попал ни один проект.<br><button class="primary" id="emptyReset">Сбросить фильтры</button></div>`; return; }
  if (density() === 'compact') return renderCompact(list);
  const dimOn = ui.risk && ui.risk !== 'done';
  app.innerHTML = groupsFor(list).map(g => {
    const cols = Math.max(g.tpl ? g.tpl.stages.length : 0, ...g.items.map(p => p.stages.length));
    const head = Array.from({length:cols}, (_,i) => `<th><span class="num">${i+1}</span>${g.tpl ? esc(g.tpl.stages[i]?.name ?? '') : 'Этап'}</th>`).join('');
    const body = g.items.map(p => {
      const cur = currentStage(p); const end = plannedEnd(p); const late = p.deadline && end > p.deadline;
      const cells = Array.from({length:cols}, (_,i) => {
        const s = p.stages[i];
        if (!s) return `<td><div class="cell blank"></div></td>`;
        const h = health(s);
        const dim = dimOn && h.key !== ui.risk ? ' dim' : '';
        return `<td><button class="cell s-${h.key}${cur && cur.id===s.id ? ' cur':''}${dim}" data-open="${p.id}" data-stage="${s.id}" title="${esc(s.name)}: ${esc(STATUS[s.status])}">
          ${g.tpl ? '' : `<span class="sn">${esc(s.name)}</span>`}
          <span class="st">${h.label}</span><span class="dl">${h.note}</span>
          <span class="who${whoId(p, s) ? '' : ' none'}">${esc(short(whoId(p, s)))}</span></button></td>`;
      }).join('');
      return `<tr><th class="pcol"><button class="prow" data-open="${p.id}"><b>${esc(p.name)}${p.priority==='high' ? '<span class="hp">Высокий</span>' : ''}</b>
        <small>${esc(p.client)}, PM ${esc(short(p.pm_id))}${execTxt(p)}</small>
        <small class="${late ? 'late' : p.state === 'completed' ? '' : 'ut-' + urg(p.deadline || end).k}">Финиш ${fmt(end)}${late ? `, позже дедлайна ${fmt(p.deadline)}` : p.state === 'completed' ? '' : `, ${urg(p.deadline || end).txt}`}</small></button></th>${cells}</tr>`;
    }).join('');
    return `<section class="grp"><h2>${esc(g.title)} <span>${g.items.length}</span></h2>
      <div class="scroll"><table class="mx"><thead><tr><th class="pcol">Проект</th>${head}</tr></thead><tbody>${body}</tbody></table></div></section>`;
  }).join('');
}

// ---------- Главная на телефоне: карточка на проект ----------
const IS_PHONE = matchMedia('(max-width:640px)');
IS_PHONE.addEventListener?.('change', () => { if (typeof db !== 'undefined' && db) render(); });
const RISK_RU = { red:'Просрочено', yellow:'Горит', blue:'У клиента', green:'В графике', gray:'Не стартовал', done:'Завершён' };
// Срочность срока: over — просрочено, hot — 0–3 дня, warn — 4–7 дней, ok — больше недели
function urg(date){
  if (!date) return { k:'ok', d:null, txt:'' };
  const d = diffDays(date, today());
  const k = d < 0 ? 'over' : d <= 3 ? 'hot' : d <= 7 ? 'warn' : 'ok';
  const txt = d < 0 ? `просрочено на ${days(-d)}` : d === 0 ? 'сегодня' : d === 1 ? 'завтра' : `через ${days(d)}`;
  return { k, d, txt };
}
const CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>';
function ring(pct, key){
  const r = 20, c = 2 * Math.PI * r;
  return `<svg class="ring rk-${key}" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="${r}" class="ring-bg"/><circle cx="24" cy="24" r="${r}" class="ring-fg" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}" transform="rotate(-90 24 24)"/><text x="24" y="28.5" text-anchor="middle">${pct}%</text></svg>`;
}
function renderPhoneList(list){
  ui.mxOpen = ui.mxOpen || {};
  // шапка: сводка по статусам, плитки работают как фильтр
  const pool = db.projects.filter(baseOk).filter(p => p.state === 'active');
  const cnt = k => pool.filter(p => projectRisk(p) === k).length;
  const week = pool.filter(p => { const c = currentStage(p); return c && c.status !== 'not_started' && urg(c.due_date).k !== 'ok'; }).length;
  const tiles = [['red','Просрочено'],['yellow','Горит'],['blue','У клиента'],['green','В графике']].map(([k, l]) =>
    `<button class="tile t-${k}" data-htile="${k}" aria-pressed="${ui.risk === k}"><b>${cnt(k)}</b><span>${l}</span></button>`).join('');
  const hero = `<section class="hero">
    <div class="hero-top"><div><small>${new Date().toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' })}</small>
      <h2>${pool.length} ${plural(pool.length, 'проект', 'проекта', 'проектов')} в работе</h2></div>
      ${week ? `<span class="hero-week">${CLOCK}${week} ${plural(week, 'срок', 'срока', 'сроков')} на неделе</span>` : ''}</div>
    <div class="tiles">${tiles}</div>
    ${ui.risk ? `<button class="hero-reset" data-htile="">Показать все проекты</button>` : ''}
  </section>`;
  const card = p => {
    const c = currentStage(p); const h = c ? health(c) : { key:'done', label:'Завершён', note:'' };
    const risk = projectRisk(p); const n = p.stages.length; const doneN = p.stages.filter(s => s.status === 'done').length;
    const end = plannedEnd(p); const late = p.deadline && end > p.deadline; const open = !!ui.mxOpen[p.id];
    const pg = projectProgress(p); const pct = pg.total ? pg.pct : Math.round(doneN / n * 100);
    const worst = risk !== h.key && risk !== 'done' && risk !== 'gray' ? p.stages.find(s => health(s).key === risk) : null;
    const segs = p.stages.map(s => { const k = s.status === 'done' ? 'done' : health(s).key; return `<i class="pseg p-${k === 'done' ? 'done' : (c && s.id === c.id) || k === 'red' ? k : 'todo'}"></i>`; }).join('');
    // срок этапа
    let stageChip = '';
    if (c && c.status === 'not_started'){ const u = urg(c.planned_start); stageChip = `<span class="dchip u-plan">${CLOCK}старт ${u.d <= 0 ? 'сегодня' : u.txt}</span>`; }
    else if (c){ const u = urg(c.due_date); stageChip = `<span class="dchip u-${u.k}">${CLOCK}${u.k === 'over' ? u.txt : `сдать ${u.txt}`}</span>`; }
    // срок проекта: дедлайн, если задан, иначе расчётный финиш
    const target = p.state === 'completed' ? null : (p.deadline || end); const tu = urg(target);
    const due = target ? `<span class="dchip big u-${late ? 'over' : tu.k}">${FLAG}${p.deadline ? 'Дедлайн' : 'Финиш'} ${fmt(target)} · ${tu.txt}</span>` : '<span class="dchip u-ok">Проект завершён</span>';
    const stages = open ? `<ol class="pc-stages">${p.stages.map((s, i) => { const sh = health(s); const isCur = c && s.id === c.id; const su = s.status === 'done' || s.status === 'not_started' ? null : urg(s.due_date);
        return `<li><button class="pc-st${isCur ? ' cur' : ''}" data-open="${p.id}" data-stage="${s.id}"><i class="sw ${sh.key}"></i>
          <span class="pc-sn"><b>${i + 1}. ${esc(s.name)}</b><small>${esc(short(whoId(p, s)))}</small></span>
          <span class="pc-ss s-${sh.key}t">${sh.label}<small class="${su ? 'ut-' + su.k : ''}">${sh.note}</small></span></button></li>`; }).join('')}</ol>` : '';
    return `<article class="pc pc2 r-${risk}">
      <button class="pc-main" data-open="${p.id}"${c ? ` data-stage="${c.id}"` : ''}>
        <span class="pc-tags"><span class="pc-badge b-${risk}">${RISK_RU[risk]}</span>${p.priority === 'high' ? '<span class="hp">Высокий приоритет</span>' : ''}</span>
        <span class="pc-head"><span class="pc-ttl"><b>${esc(p.name)}</b><small class="pc-sub">${esc(p.client)} · PM ${esc(short(p.pm_id))}${execTxt(p, ' · ')}</small></span>${ring(pct, risk)}</span>
        <span class="pc-stagebox">
          <span class="pc-lbl">${c ? `Этап ${c.position + 1} из ${n}` : 'Этапы'}</span>
          <b class="pc-sname">${c ? esc(c.name) : 'Все этапы пройдены'}</b>
          ${c ? `<span class="pc-row">${stageChip}<span class="pc-who">${whoId(p, c) ? esc(short(whoId(p, c))) : '<span class="pc-none">без ответственного</span>'}</span></span>` : ''}
          <span class="pbar" role="img" aria-label="Пройдено ${doneN} из ${n} этапов">${segs}</span>
        </span>
        ${worst ? `<span class="pc-warn">Этап ${worst.position + 1} «${esc(worst.name)}»: ${health(worst).note.toLowerCase()}</span>` : ''}
        <span class="pc-foot2">${due}${late ? `<small class="late">по плану финиш ${fmt(end)}, на ${days(diffDays(end, p.deadline))} позже</small>` : ''}</span>
      </button>
      <button class="pc-more" data-mxtoggle="${p.id}" aria-expanded="${open}">${open ? 'Скрыть этапы' : `Все этапы · ${doneN} из ${n} сдано`}</button>
      ${stages}
    </article>`;
  };
  app.innerHTML = hero + (list.length ? '' : `<div class="empty">Под фильтры не попал ни один проект.<br><button class="primary" id="emptyReset">Сбросить фильтры</button></div>`) + groupsFor(list).map(g => `<section class="grp"><h2>${esc(g.title)} <span>${g.items.length}</span></h2><div class="pc-list">${g.items.map(card).join('')}</div></section>`).join('');
}
document.addEventListener('click', e => { const t = e.target.closest('[data-htile]'); if (!t) return; const k = t.dataset.htile; ui.risk = ui.risk === k ? '' : k; render(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-mxtoggle]'); if (!t) return;
  ui.mxOpen = ui.mxOpen || {}; ui.mxOpen[t.dataset.mxtoggle] = !ui.mxOpen[t.dataset.mxtoggle]; render();
});

// ---------- Производство на телефоне: лента проектов + этапы сверху вниз ----------
function renderFocusPhone({ mine, p, list, all, role, canEdit, cur, pg, curStage, curSub }){
  const key = mine ? 'myProject' : 'prodProject';
  const idx = list.findIndex(x => x.id === p.id);
  const prev = idx > 0 ? list[idx - 1] : null, next = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;
  const chips = list.map(x => {
    const c = currentStage(x); const r = projectRisk(x); const xp = projectProgress(x);
    return `<button class="pm-chip${x.id === p.id ? ' on' : ''}" data-pfsel="${x.id}" aria-current="${x.id === p.id}">
      <span class="pm-cn"><i class="sw ${r}"></i>${esc(x.name)}</span>
      <small>${c ? `${c.position + 1}/${x.stages.length} · ${esc(c.name)}` : 'Все этапы пройдены'}</small>
      <span class="pf-mini" aria-hidden="true"><i style="width:${xp.pct}%"></i></span></button>`;
  }).join('');
  const prevBoard = app.querySelector('.pm-board')?.scrollLeft || 0;
  const cols = p.stages.map(s => {
    const h = health(s); const isCur = s.id === cur.stageId; const passed = s.status === 'done';
    const subs = s.subs || []; const doneN = subs.filter(x => subDone(p, s, x)).length;
    const cards = subs.map(x => {
      const t = taskFor(p.id, s.id, x.id); const pr = t ? taskProgress(t) : null; const done = subDone(p, s, x);
      const here = isCur && x.id === cur.subId;
      return `<button class="pf-card${done ? ' done' : ''}${here ? ' here' : ''}" data-pfsub="${s.id}|${x.id}" aria-label="Подэтап ${esc(x.name)}${here ? ', проект сейчас здесь' : ''}">
        ${here ? '<span class="pf-here">Сейчас здесь</span>' : ''}<b>${esc(x.name)}</b>
        <small>${esc(short(whoId(p, s, t)))}</small>
        ${pr ? `<span class="tk-bar"><i style="width:${pr.pct}%"></i></span><small>${pr.total ? `${pr.n} из ${pr.total} выполнено` : 'Чек-лист пуст'}</small>`
             : `<small>${done ? 'Отмечен выполненным' : 'Нет чек-листа: нажмите, чтобы создать задачу'}</small>`}</button>`;
    }).join('');
    return `<section class="pf-col${isCur ? ' cur' : ''}${passed ? ' passed' : ''}" data-pmcol="${s.id}" aria-label="Этап ${s.position + 1}. ${esc(s.name)}">
      <header><div><b>${s.position + 1}. ${esc(s.name)}</b>${isCur ? '<span class="pf-now">Текущий этап</span>' : ''}</div>
        <small><i class="sw ${h.key}"></i>${h.key === 'red' ? h.note : h.label + (s.status !== 'done' ? `, ${h.note.toLowerCase()}` : '')}. Подэтапы ${doneN}/${subs.length}</small></header>
      <div class="pf-cards">${cards || '<p class="hint">Подэтапов нет</p>'}</div>
      ${canEdit ? `<form class="pf-add" data-pfadd="${s.id}"><input placeholder="Добавить подэтап" aria-label="Новый подэтап этапа ${esc(s.name)}"><button class="ghost" aria-label="Добавить">+</button></form>` : ''}
    </section>`;
  }).join('');
  const steps = p.stages.map(s => `<button class="pm-step${s.status === 'done' ? ' done' : ''}${s.id === cur.stageId ? ' cur' : ''} h-${health(s).key}" data-pmgo="${s.id}" aria-label="Этап ${s.position + 1}. ${esc(s.name)}">${s.status === 'done' ? '✓' : s.position + 1}</button>`).join('');
  app.innerHTML = `${mine ? '<div class="fn-head-row"><h2 class="mine-h">Мои проекты</h2><button class="ghost" id="joinOpen">Открыть по ссылке</button></div>' : `<div class="fn-head-row">${prodSwitch()}</div>`}
    <div class="pm-switch">
      ${all.length > 6 ? `<input type="search" id="pfQ" placeholder="Найти проект" value="${esc(ui.pfQ || '')}" aria-label="Поиск проекта">` : ''}
      <div class="pm-strip" role="tablist" aria-label="Проекты">${chips || '<p class="hint">Ничего не найдено</p>'}</div>
    </div>
    <div class="pm-head">
      <div class="pm-nav">
        <button class="icon-btn" ${prev ? `data-pfsel="${prev.id}"` : 'disabled'} aria-label="Предыдущий проект"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="pm-title"><h2>${mine ? esc(p.name) : `<button class="link-plain" data-open="${p.id}">${esc(p.name)}</button>`}</h2>
          <small>${idx + 1} из ${list.length} · ${mine ? `ваша роль: ${ROLE_RU[role].toLowerCase()}` : `${esc(p.client)} · PM ${esc(short(p.pm_id))}${execTxt(p, ' · ')} · финиш ${fmt(plannedEnd(p))}`}</small></div>
        <button class="icon-btn" ${next ? `data-pfsel="${next.id}"` : 'disabled'} aria-label="Следующий проект"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <div class="pm-acts">${!mine ? `<button class="ghost pf-sharebtn" data-share="${p.id}">${SHARE_ICON} Поделиться${shareCount(p) ? ` · ${shareCount(p)}` : ''}</button>` : ''}</div>
    </div>
    <div class="pm-steps" role="group" aria-label="Перейти к этапу">${steps}</div>
    <div class="pf-board pm-board">${cols}</div>`;
  // доска: при смене проекта — к текущему этапу, при перерисовке — на месте

// ---------- Загрузка команды ----------
function workload(){
  const t = today();
  const active = db.projects.filter(p => p.state === 'active');
  const start = mondayOf(t);
  const weeks = Array.from({length:6}, (_,i) => ({ from:addDays(start, i*7), to:addDays(start, i*7+6) }));
  const rows = db.users.map(u => {
    const mine = [];
    active.forEach(p => p.stages.forEach(s => { if (s.assignee_id === u.id && s.status !== 'done') mine.push({ p, s, h:health(s) }); }));
    const cur = mine.filter(x => x.s.status === 'in_progress' || x.s.status === 'client_review');
    const by = { red:0, yellow:0, blue:0, green:0 }; cur.forEach(x => by[x.h.key]++);
    const upcoming = mine.filter(x => x.s.status === 'not_started' && diffDays(x.s.planned_start, t) <= 14).length;
    const heat = weeks.map(w => mine.filter(x => {
      const end = x.s.status !== 'not_started' && x.s.due_date < t ? t : x.s.due_date; // просроченное всё ещё в работе
      return x.s.planned_start <= w.to && end >= w.from;
    }).length);
    return { u, cur:cur.length, by, upcoming, heat, pmOf:active.filter(p => p.pm_id === u.id).length };
  });
  const unassigned = [];
  active.forEach(p => p.stages.forEach(s => {
    if (!s.assignee_id && s.status !== 'done' && diffDays(s.planned_start, t) <= 14) unassigned.push({ p, s });
  }));
  unassigned.sort((a,b) => a.s.planned_start.localeCompare(b.s.planned_start));
  return { rows, weeks, unassigned, active };
}
function loadState(r){
  const cap = r.u.capacity || 1;
  if (r.cur > cap) return ['over', 'Перегружен'];
  if (r.cur === cap) return ['full', 'Полная загрузка'];
  if (r.cur === 0) return ['free', 'Свободен'];
  return ['free', `Свободно мест: ${cap - r.cur}`];
}
function renderLoad(){
  const W = workload();

  const inWork = allStages.filter(s => s.status === 'in_progress' || s.status === 'client_review');
  const overdue = inWork.filter(s => health(s).key === 'red').length;

  const budget = W.active.reduce((m,p) => m + (+p.budget || 0), 0);
  const scale = Math.max(1, ...rows.map(r => Math.max(r.cur + r.upcoming, r.u.capacity || 1)));
  const depts = [...new Set(db.users.map(u => u.dept))];

      <div class="trackwrap"><div class="track">${segs}</div><span class="cap" style="left:calc(${cap/scale*100}% - 1px)" title="Норма: ${cap}"></span></div>
      <div class="lstat"><b>${r.cur} из ${cap}</b><span class="${cls}">${txt}</span>${r.upcoming ? `<br><span class="hint">ещё ${r.upcoming} в ближайшие 2 недели</span>` : ''}</div>
    </div>`;
  }).join('');

  const heatRows = rows.map(r => {

    return `<tr><th class="name">${esc(short(r.u.id))}</th>${r.heat.map(n => `<td class="${n===0?'':n<cap?'h1':n===cap?'h2':'h3'}">${n || ''}</td>`).join('')}</tr>`;
  }).join('');

  const onlyMe = db.users.length === 1;
  app.innerHTML = `<div class="dash">
    <div class="stats">
      <div class="stat"><b>${W.active.length}</b><span>активных проектов</span></div>
      <div class="stat"><b>${inWork.length}</b><span>этапов в работе</span></div>
      <div class="stat ${overdue?'alert':''}"><b>${overdue}</b><span>этапов просрочено</span></div>
      <div class="stat ${W.unassigned.length?'alert':''}"><b>${W.unassigned.length}</b><span>этапов без ответственного</span></div>

      return rs.length ? `<ul class="d-reports">${rs.map(r => { const t = computeReport(r).totals;

  </aside>`;

// ---------- Уведомления ----------
function hotStages(){
  const out = [];
  db.projects.filter(p => p.state === 'active').forEach(p => p.stages.forEach(s => {
    const h = health(s); if (h.key === 'red' || h.key === 'yellow' || (h.key === 'blue' && h.hours < 48)) out.push({ p, s, h });
  }));
  return out.sort((a,b) => a.h.hours - b.h.hours);
}
function openBell(){
  const list = hotStages();
  layer.innerHTML = `<div class="backdrop" data-close style="background:transparent"></div>
  <div class="pop" role="dialog" aria-label="Уведомления"><h3>Горящие и просроченные этапы</h3>
  ${list.length ? list.map(({p,s,h}) => `<button class="ntf" data-open="${p.id}" data-stage="${s.id}"><span class="sw ${h.key==='blue'?'yellow':h.key}"></span>
    <span><b>${esc(p.name)}</b><small>${esc(s.name)}: ${h.note}. ${esc(short(whoId(p, s)))}</small></span></button>`).join('')
  : '<p class="hint" style="padding:0 8px">Все этапы идут по графику</p>'}</div>`;
}

// ---------- Подтверждение (вместо window.confirm, который блокируется на опубликованной странице) ----------
function askConfirm({ title, text, ok, danger = true }){
  return new Promise(resolve => {
    const box = $('#confirmBox');
    box.innerHTML = `<div class="cfm-back"></div>
      <div class="modal cfm" role="alertdialog" aria-modal="true" aria-labelledby="cfmT" aria-describedby="cfmD">
        <h2 id="cfmT">${esc(title)}</h2><p class="lead" id="cfmD">${esc(text)}</p>
        <div class="actions"><button class="ghost" id="cfmNo">Отмена</button><button class="primary${danger ? ' btn-danger' : ''}" id="cfmOk">${esc(ok)}</button></div>
      </div>`;
    const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); e.preventDefault(); done(false); } };
    const done = v => { document.removeEventListener('keydown', onKey, true); box.innerHTML = ''; resolve(v); };
    document.addEventListener('keydown', onKey, true);
    box.querySelector('#cfmNo').onclick = () => done(false);
    box.querySelector('.cfm-back').onclick = () => done(false);
    box.querySelector('#cfmOk').onclick = () => done(true);
    box.querySelector('#cfmNo').focus();
  });
}

}

// ---------- разбор чисел, дат, таблиц ----------
function parseNum(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).replace(/[\s\u00a0\u202f]/g, '').replace(/[^\d,.\-]/g, '');
  if (!s || s === '-') return null;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc > -1) s = /,\d{1,2}$/.test(s) ? s.replace(',', '.') : s.replace(/,/g, '');
  const n = parseFloat(s); return isFinite(n) ? n : null;
}
function parseDateAny(v){
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return iso(v);
  if (typeof v === 'number' && v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 864e5)); return iso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if ((m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})/))) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  return null;
}
async function readTable(file){
  await loadScript(XLSX_URL);
  const buf = await file.arrayBuffer(); let wb;
  if (/\.(csv|txt)$/i.test(file.name)){
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('\uFFFD')) text = new TextDecoder('windows-1251').decode(buf);   // выгрузки из 1С и Битрикс24
    const first = text.split(/\r?\n/)[0] || '';
    const FS = [';', '\t', ','].sort((a,b) => first.split(b).length - first.split(a).length)[0];
    wb = XLSX.read(text, { type:'string', FS, raw:true });
  } else wb = XLSX.read(buf, { type:'array', cellDates:true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:true, blankrows:false });
  // строка заголовков — первая, где хотя бы две ячейки с текстом
  const hi = Math.max(0, aoa.findIndex(r => r.filter(c => typeof c === 'string' && c.trim()).length >= 2));
  const headers = (aoa[hi] || []).map((h,i) => String(h || '').trim() || `Колонка ${i+1}`);
  const rows = aoa.slice(hi + 1).filter(r => r.some(c => c !== '' && c != null)).map(r => r.map(c => c instanceof Date ? iso(c) : c));
  return { headers, rows };
}
const detectCol = (headers, re) => { const i = headers.findIndex(h => re.test(h)); return i >= 0 ? i : null; };
const CRM_FIELDS = [
  ['date','Дата', /(дата|date|создан|created|закрыт|closed)/i],
  ['amount','Сумма сделки', /(сумма|бюджет|выручк|amount|revenue|price|стоимост|оплат|value)/i],
  ['status','Статус / этап', /(статус|этап|stage|status|воронк|pipeline)/i],
  ['source','Источник / канал', /(источник|utm.?source|source|канал|channel|utm)/i]
];
const SPEND_FIELDS = [
  ['source','Площадка', /(площадк|платформ|platform|source|источник|канал|network)/i],
  ['campaign','Кампания', /(кампани|campaign|объявлен|ad set|группа|ad name)/i],
  ['spend','Расход', /(расход|spend|cost|затрат|потрачен|amount spent|стоимость)/i],
  ['impressions','Показы', /(показ|impression)/i],
  ['clicks','Клики', /(клик|click)/i],
  ['leads','Лиды / результаты', /(лид|lead|конверс|conversion|результат|result)/i]
];
const WON_RE = /(успешн|оплач|оплат|won|выигр|продаж|заключ|paid|реализовано|closed.?won)/i;
const LOST_RE = /(не реализ|отказ|lost|проигр|закрыто и не|нецелев|спам)/i;

// ---------- каналы ----------
const CHANNELS = [
  [/(facebook|\bfb\b|meta|instagram|insta|инстаграм|фейсбук)/i,'Facebook / Instagram'],
  [/(google|adwords|gads|youtube|гугл)/i,'Google Ads'],
  [/(yandex|яндекс|директ|direct)/i,'Яндекс Директ'],
  [/(\bvk\b|вк\b|вконтакте|mytarget|vk ads)/i,'VK Реклама'],
  [/(tiktok|тикток)/i,'TikTok Ads'],
  [/(telegram|телеграм|\btg\b)/i,'Telegram Ads']
];
function canonChannel(s){
  const t = String(s ?? '').trim();
  if (!t) return 'Без источника';
  for (const [re, n] of CHANNELS) if (re.test(t)) return n;
  return t.length > 40 ? t.slice(0, 40) + '…' : t;
}

// ---------- расчёт ----------
const ratio = (a, b) => b ? a / b : null;
function crmRows(rep){
  const c = rep.crm; if (!c) return [];
  const { date, amount, status, source } = c.map;
  const won = new Set(c.won || []);
  return c.raw.map(r => {
    const st = status != null ? String(r[status] ?? '').trim() : '';
    const a = amount != null ? (parseNum(r[amount]) || 0) : 0;
    return { d: date != null ? parseDateAny(r[date]) : null, a, src: source != null ? r[source] : '', won: status != null ? won.has(st) : a > 0 };
  }).filter(r => (!rep.from || !r.d || r.d >= rep.from) && (!rep.to || !r.d || r.d <= rep.to));
}
function computeReport(rep){
  const margin = (rep.margin ?? 100) / 100;
  const rows = crmRows(rep);
  const bySrc = rep.crm?.map?.source != null;
  const map = new Map();
  const ch = k => { if (!map.has(k)) map.set(k, { name:k, spend:0, impressions:0, clicks:0, adLeads:0, leads:0, sales:0, revenue:0 }); return map.get(k); };
  rows.forEach(r => { if (!bySrc) return; const c = ch(canonChannel(r.src)); c.leads++; if (r.won){ c.sales++; c.revenue += r.a; } });
  rep.spend.forEach(e => {
    const c = ch(canonChannel(e.source || e.campaign));
    c.spend += +e.spend || 0; c.impressions += +e.impressions || 0; c.clicks += +e.clicks || 0; c.adLeads += +e.leads || 0;
  });
  const won = rows.filter(r => r.won);
  const T = { spend:0, impressions:0, clicks:0, adLeads:0, leads:rows.length, sales:won.length, revenue:won.reduce((m,r) => m + r.a, 0) };
  rep.spend.forEach(e => { T.spend += +e.spend || 0; T.impressions += +e.impressions || 0; T.clicks += +e.clicks || 0; T.adLeads += +e.leads || 0; });
  const hasCrm = !!rep.crm;
  const kpi = (c, withRevenue) => ({
    romi: withRevenue && c.spend ? (c.revenue * margin - c.spend) / c.spend : null,
    roas: withRevenue ? ratio(c.revenue, c.spend) : null,
    cpl: c.spend ? ratio(c.spend, (hasCrm && (withRevenue || c.leads)) ? c.leads : c.adLeads) : null,
    cpa: withRevenue && c.spend ? ratio(c.spend, c.sales) : null,
    cr: withRevenue ? ratio(c.sales, c.leads) : null,
    ctr: ratio(c.clicks, c.impressions), crClick: ratio(c.leads || c.adLeads, c.clicks), aov: withRevenue ? ratio(c.revenue, c.sales) : null
  });
  const channels = [...map.values()].map(c => ({ ...c, ...kpi(c, bySrc), revenue: bySrc ? c.revenue : null, sales: bySrc ? c.sales : null }))
    .sort((a,b) => (b.spend + (b.revenue || 0)) - (a.spend + (a.revenue || 0)));
  const notices = [];
  if (hasCrm && !bySrc) notices.push('В выгрузке CRM не выбрана колонка источника: выручка посчитана общей суммой, ROMI по каналам недоступен.');
  if (bySrc) channels.forEach(c => {
    if (c.spend > 0 && c.leads === 0) notices.push(`«${c.name}»: есть расход, но нет лидов в CRM. Проверьте UTM-метки и названия источников.`);
    if (c.spend === 0 && c.leads > 0) notices.push(`«${c.name}»: ${c.leads} ${plural(c.leads,'лид','лида','лидов')} без расходов — органика или неучтённая реклама.`);
  });
  const undated = rep.crm?.map?.date != null ? rows.filter(r => !r.d).length : 0;
  if (undated) notices.push(`${undated} ${plural(undated,'строка','строки','строк')} CRM без даты: включены без фильтра по периоду.`);
  return { totals:{ ...T, ...kpi(T, hasCrm) }, channels, notices, hasCrm, hasSpend: rep.spend.length > 0, bySrc };
}

// ---------- форматирование ----------
const CUR = ['₽', '$', '€', '₸'];
const money2 = (n, cur) => n == null ? '—' : `${Math.round(n).toLocaleString('ru-RU')} ${cur}`;
const money1 = (n, cur) => n == null ? '—' : `${n < 100 ? n.toLocaleString('ru-RU',{maximumFractionDigits:1}) : Math.round(n).toLocaleString('ru-RU')} ${cur}`;
const pctf = (n, digits = 0) => n == null ? '—' : `${(n * 100).toLocaleString('ru-RU',{maximumFractionDigits:digits})}%`;
const nf = n => n == null ? '—' : Math.round(n).toLocaleString('ru-RU');
function mdLite(text){
  const out = []; let list = false;
  String(text || '').split('\n').forEach(line => {
    const l = line.trim().replace(/\*\*/g, '');
    if (/^[-•*]\s+/.test(l)){ if (!list){ out.push('<ul>'); list = true; } out.push(`<li>${esc(l.replace(/^[-•*]\s+/, ''))}</li>`); return; }
    if (list){ out.push('</ul>'); list = false; }
    if (/^#{1,4}\s+/.test(l)) out.push(`<h4>${esc(l.replace(/^#{1,4}\s+/, ''))}</h4>`);
    else if (l) out.push(`<p>${esc(l)}</p>`);
  });
  if (list) out.push('</ul>');
  return out.join('');
}

// ---------- графики (SVG, цвета из темы через CSS-классы) ----------
const cut = (s, n = 20) => s.length > n ? s.slice(0, n) + '…' : s;
function chartSpendRevenue(chs, cur){
  const list = chs.filter(c => c.spend || c.revenue).slice(0, 8);
  if (!list.length) return '';
  const max = Math.max(...list.map(c => Math.max(c.spend, c.revenue || 0))) || 1;
  const rowH = 50, W = 640, L = 180, R = 112, bw = W - L - R;
  const bars = list.map((c,i) => {
    const y = 12 + i * rowH; const ws = c.spend / max * bw, wr = (c.revenue || 0) / max * bw;
    return `<text x="${L - 10}" y="${y + 20}" text-anchor="end" class="ch-lbl">${esc(cut(c.name))}</text>
      <rect x="${L}" y="${y + 2}" width="${Math.max(ws, c.spend ? 2 : 0)}" height="14" rx="3" class="ch-spend"/><text x="${L + ws + 6}" y="${y + 13}" class="ch-val">${money2(c.spend, cur)}</text>
      ${c.revenue != null ? `<rect x="${L}" y="${y + 20}" width="${Math.max(wr, c.revenue ? 2 : 0)}" height="14" rx="3" class="ch-rev"/><text x="${L + wr + 6}" y="${y + 31}" class="ch-val">${money2(c.revenue, cur)}</text>` : ''}`;
  }).join('');
  return `<figure class="chart"><figcaption>Расход и выручка по каналам <span><i class="lg lg-spend"></i>расход <i class="lg lg-rev"></i>выручка</span></figcaption>
    <svg viewBox="0 0 ${W} ${list.length * rowH + 14}" role="img" aria-label="Расход и выручка по каналам">${bars}</svg></figure>`;
}
function chartRomi(chs){
  const list = chs.filter(c => c.romi != null).slice(0, 8);
  if (!list.length) return '';
  const max = Math.max(...list.map(c => Math.abs(c.romi))) || 1; const neg = list.some(c => c.romi < 0);
  const rowH = 32, W = 640, L = 180, R = 70, bw = W - L - R, zero = neg ? L + bw / 2 : L, span = neg ? bw / 2 - 40 : bw;
  const bars = list.map((c,i) => {
    const y = 10 + i * rowH; const w = Math.abs(c.romi) / max * span; const x = c.romi < 0 ? zero - w : zero;
    return `<text x="${L - 10}" y="${y + 13}" text-anchor="end" class="ch-lbl">${esc(cut(c.name))}</text>
      <rect x="${x}" y="${y + 2}" width="${Math.max(w, 2)}" height="14" rx="3" class="${c.romi < 0 ? 'ch-neg' : 'ch-pos'}"/>
      <text x="${c.romi < 0 ? x - 6 : x + w + 6}" y="${y + 13}" text-anchor="${c.romi < 0 ? 'end' : 'start'}" class="ch-val">${pctf(c.romi)}</text>`;
  }).join('');
  return `<figure class="chart"><figcaption>ROMI по каналам</figcaption>
    <svg viewBox="0 0 ${W} ${list.length * rowH + 14}" role="img" aria-label="ROMI по каналам"><line x1="${zero}" x2="${zero}" y1="4" y2="${list.length * rowH + 10}" class="ch-axis"/>${bars}</svg></figure>`;
}
function chartFunnel(t){
  const steps = [['Показы', t.impressions], ['Клики', t.clicks], ['Лиды', t.leads || t.adLeads], ['Продажи', t.sales]].filter(s => s[1] > 0);
  if (steps.length < 2) return '';
  const max = Math.log10(steps[0][1] + 1);
  const W = 640, rowH = 42;
  const rows = steps.map(([n, v], i) => {
    const w = Math.max(220, Math.log10(v + 1) / max * (W - 20)); const x = (W - w) / 2; const y = 6 + i * rowH;
    const k = i ? v / steps[i-1][1] : null;
    return `<rect x="${x}" y="${y}" width="${w}" height="30" rx="7" class="ch-fn${i}"/>
      <text x="${W/2}" y="${y + 19}" text-anchor="middle" class="ch-fnt${i}${i < 2 ? ' inv' : ''}">${n}: ${nf(v)}${k != null ? `, ${pctf(k, k < 0.1 ? 1 : 0)} от предыдущего` : ''}</text>`;
  }).join('');
  return `<figure class="chart"><figcaption>Воронка <span>ширина в логарифмической шкале</span></figcaption>
    <svg viewBox="0 0 ${W} ${steps.length * rowH + 8}" role="img" aria-label="Воронка от показов до продаж">${rows}</svg></figure>`;
}
function reportDashboard(rep, r){

      <tr class="tot"><td>Итого</td><td>${money2(t.spend, cur)}</td><td>${nf(leads)}</td><td>${r.hasCrm ? nf(t.sales) : '—'}</td><td>${r.hasCrm ? money2(t.revenue, cur) : '—'}</td><td>${money1(t.cpl, cur)}</td><td>${money1(t.cpa, cur)}</td><td>${pctf(t.cr, 1)}</td><td>${pctf(t.roas)}</td><td class="${romiCls}">${pctf(t.romi)}</td></tr>

const repById = id => (db.reports || []).find(r => r.id === id);
function newReport(projectId){

    crm:null, spend:[], imports:[], summary:'', summary_at:null, created_at:new Date().toISOString(), updated_at:new Date().toISOString() };

function touch(rep){ rep.updated_at = new Date().toISOString(); }
// Автопривязка: ищем проект по имени файла, названиям кампаний и клиенту
function autoAttach(rep, hints){
  if (rep.project_id) return;
  const hay = norm(hints.join(' '));
  const cand = db.projects.filter(p => p.state !== 'archived')
    .map(p => ({ p, score: (hay.includes(norm(p.name)) ? 2 : 0) + (p.client && hay.includes(norm(p.client)) ? 1 : 0) }))
    .filter(x => x.score).sort((a,b) => b.score - a.score)[0];
  if (cand){ rep.project_id = cand.p.id; addLog(cand.p, `AI-отчёт «${rep.title}» привязан к проекту автоматически`); toast(`Отчёт привязан к проекту «${cand.p.name}»`); }
}
function setCrm(rep, file, table){
  const h = table.headers; const map = {};
  CRM_FIELDS.forEach(([k,, re]) => map[k] = detectCol(h, re));
  if (map.date != null && map.date === map.amount) map.amount = null;
  rep.crm = { file:file.name, headers:h, raw:table.rows.slice(0, 20000), map, won:[] };
  refreshStatuses(rep, true);
  if (map.date != null){                               // период — по датам выгрузки
    const ds = rep.crm.raw.map(r => parseDateAny(r[map.date])).filter(Boolean).sort();
    if (ds.length){ rep.from = ds[0]; rep.to = ds.at(-1); }
  }
  rep.imports.push({ type:'crm', name:file.name, at:new Date().toISOString() });
  autoAttach(rep, [file.name]);
}
function refreshStatuses(rep, autoWon){
  const c = rep.crm; if (!c) return;
  if (c.map.status == null){ c.statuses = []; return; }
  const counts = new Map();
  c.raw.forEach(r => { const s = String(r[c.map.status] ?? '').trim(); if (s) counts.set(s, (counts.get(s) || 0) + 1); });
  c.statuses = [...counts].sort((a,b) => b[1] - a[1]).slice(0, 40).map(([name, count]) => ({ name, count }));
  if (autoWon) c.won = c.statuses.filter(s => WON_RE.test(s.name) && !LOST_RE.test(s.name)).map(s => s.name);
}
function addSpendRows(rep, rows, meta){
  const importId = uid();
  rows.forEach(x => rep.spend.push({ id:uid(), importId, source:x.source || meta.platform || '', campaign:String(x.campaign ?? '').trim(),
    spend: parseNum(x.spend) ?? 0, impressions: parseNum(x.impressions), clicks: parseNum(x.clicks), leads: parseNum(x.leads) }));
  rep.imports.push({ id:importId, type:meta.type, name:meta.name, platform:meta.platform || '', currency:meta.currency || '', at:new Date().toISOString(), warnings:meta.warnings || [], total:meta.total ?? null });
  autoAttach(rep, [meta.name || '', ...rows.map(x => x.campaign || '')]);
  return importId;
}

const SHOT_PROMPT = platform => `На изображениях — скриншоты рекламного кабинета${platform ? ` (${platform})` : ' (Facebook Ads, Google Ads, Яндекс Директ, VK Реклама или другого)'}: таблица кампаний, групп или объявлений с расходами и показателями.
Извлеки строки таблицы. Верни ТОЛЬКО JSON без пояснений и без markdown:
{"platform":"Facebook Ads | Google Ads | Яндекс Директ | VK Реклама | TikTok Ads | другое название","currency":"RUB | USD | EUR | KZT | …","period":"период отчёта, если виден, иначе пустая строка","rows":[{"campaign":"название","spend":число,"impressions":число или null,"clicks":число или null,"leads":число или null}],"total_spend":число или null,"warnings":["что не удалось прочитать или в чём есть сомнение"]}
Правила: числа без пробелов, символов валют и разделителей тысяч, десятичная часть через точку; «1,2 тыс.» = 1200, «1,2 млн» = 1200000. Строку «Итого / Total / Всего» не включай в rows — её расход положи в total_spend. leads — колонка «Результаты», «Лиды», «Конверсии» или «Conversions»; если её нет — null. Не придумывай значения, которых не видно на изображении. Если одна и та же строка видна на нескольких скриншотах — включи её один раз.`;
async function recognizeShots(rep, files, platform){
  const sample = await getSample();
  if (!sample) throw { code:'images_unavailable' };
  const lim = await sample.limits().catch(() => null);
  if (!lim?.images) throw { code:'images_unavailable' };
  const imgs = [...files].filter(f => lim.images.mediaTypes.includes(f.type)).slice(0, lim.images.maxCount);
  if (!imgs.length) throw { code:'image_rejected' };
  const res = await sample.json(SHOT_PROMPT(platform), { images:imgs, modelTier:'default', cache:false });
  const rows = (res?.rows || []).filter(x => x && (x.campaign || parseNum(x.spend) != null));
  if (!rows.length) throw { message:'На скриншоте не нашлось строк с расходами. Пришлите таблицу кампаний крупнее.' };
  const curMap = { RUB:'₽', USD:'$', EUR:'€', KZT:'₸' };
  const sum = rows.reduce((m,x) => m + (parseNum(x.spend) || 0), 0);
  const total = parseNum(res.total_spend);
  const warnings = [...(res.warnings || [])].filter(Boolean).map(String);
  if (total && Math.abs(sum - total) / total > 0.01)
    warnings.push(`Сумма строк (${nf(sum)}) не совпадает с итогом кабинета (${nf(total)}): часть строк могла не попасть на скриншот.`);
  return addSpendRows(rep, rows.map(x => ({ ...x, source: res.platform || platform })),
    { type:'image', name:[...files].map(f => f.name).join(', '), platform: res.platform || platform, currency: curMap[res.currency] || res.currency || '', warnings, total });
}

Требования: по-русски, 150–250 слов, деловой тон без воды. Четыре раздела, каждый заголовок на отдельной строке:

function fillDemo(rep){
  let x = 7; const rnd = () => (x = (x * 16807) % 2147483647) / 2147483647;
  const from = addDays(today(), -30); rep.from = from; rep.to = today();
  const srcs = [['facebook / cpc', 0.38, 0.12, 52000], ['google / cpc', 0.27, 0.17, 61000], ['yandex / cpc', 0.25, 0.07, 47000], ['organic', 0.10, 0.2, 55000]];
  const headers = ['Дата создания', 'Название сделки', 'Этап сделки', 'Бюджет', 'utm_source'];
  const rows = [];
  for (let i = 0; i < 240; i++){
    let k = rnd(), s = srcs.at(-1); for (const t of srcs){ if (k < t[1]){ s = t; break; } k -= t[1]; }
    const won = rnd() < s[2], lost = !won && rnd() < 0.6;
    rows.push([addDays(from, Math.floor(rnd() * 30)), `Заявка ${1000 + i}`, won ? 'Успешно реализовано' : lost ? 'Закрыто и не реализовано' : 'Переговоры',

  rep.spend = rep.spend.filter(e => !e.demo);

}

async function handleFile(input){
  const rep = repById(ui.repId); const files = input.files; const file = files?.[0]; if (!rep || !file) return;
  if (input.id === 'shotFile'){
    ui.repBusy = { ...(ui.repBusy || {}), shots:true }; ui.shotErr = ''; render();
    try {
      const n0 = rep.spend.length;
      await recognizeShots(rep, files, ui.shotPlatform || '');
      touch(rep); toast(`Распознано строк: ${rep.spend.length - n0}. Сверьте цифры в таблице.`);
    } catch(e) { ui.shotErr = sampleErr(e); }
    ui.repBusy.shots = false; commit(); return;
  }
  try {
    if (input.id === 'crmFile'){ ui.repBusy = { ...(ui.repBusy || {}), crm:'Читаю файл…' }; render(); }
    const table = await readTable(file);
    if (!table.rows.length) throw new Error('В файле не нашлось строк с данными');
    if (input.id === 'crmFile'){ setCrm(rep, file, table); toast(`Загружено строк: ${table.rows.length}`); }
    else {
      const map = {}; SPEND_FIELDS.forEach(([k,, re]) => map[k] = detectCol(table.headers, re));
      if (map.spend == null) throw new Error('Не нашлась колонка с расходом. Назовите её «Расход» или «Spend».');
      const guess = canonChannel(file.name);
      const plat = guess !== cut(file.name.trim(), 40) ? guess : (ui.shotPlatform || '');
      const rows = table.rows.map(r => Object.fromEntries(SPEND_FIELDS.map(([k]) => [k, map[k] != null ? r[map[k]] : null])))
        .filter(x => parseNum(x.spend) != null && !/^(итого|всего|total)/i.test(String(x.campaign || '')));
      addSpendRows(rep, rows, { type:'file', name:file.name, platform:plat });
      toast(`Импортировано строк расходов: ${rows.length}`);
    }
    touch(rep);
  } catch(e) { toast(e.message || 'Не удалось прочитать файл'); }
  if (ui.repBusy) ui.repBusy.crm = ''; commit();
}

const demoPreset = name => TASK_PRESETS[norm(name)] || { c:GENERIC_CHECK };   // только для демо-данных
// ---------- Шаблоны карточек подэтапов ----------
//  db.cardTpls[«процесс|подэтап»] = { d, reg, vid, c:[пункты], sub, at } — по нему создаются новые карточки этого подэтапа.
//  Нет шаблона — карточка создаётся пустой, без чек-листа.
const cardKey = (tplId, subName) => `${tplId || '*'}|${norm(subName)}`;
function cardTplFor(p, subName){
  const T = db.cardTpls || {}; const k = cardKey(p?.template_id, subName);
  if (T[k]) return T[k];
  const same = Object.entries(T).filter(([key]) => key.endsWith('|' + norm(subName))).sort((a, b) => String(b[1].at).localeCompare(String(a[1].at)));
  return same[0]?.[1] || null;
}
const taskPreset = (name, p) => { const c = p && !p._ext ? cardTplFor(p, name) : null; return c ? { d:c.d || '', c:c.c || [], reg:c.reg || '', vid:c.vid || '' } : { d:'', c:[] }; };
function saveCardTpl(p, subName, t){
  if (!p || p._ext || !subName) return;
  db.cardTpls = db.cardTpls || {};
  db.cardTpls[cardKey(p.template_id, subName)] = { sub:subName, d:t.description || '', reg:t.regulation_link || '', vid:t.video_url || '', c:t.checklist.map(i => i.text), at:new Date().toISOString() };
}
// Один раз: уже заполненные карточки подэтапов становятся шаблонами (демо-заготовки пропускаем)
function migrateCardTpls(){
  if (db.cardTplsInit) return;
  db.cardTpls = db.cardTpls || {};
  const best = new Map();
  (db.tasks || []).forEach(t => {
    const p = db.projects.find(x => x.id === t.project_id); const s = p?.stages.find(x => x.id === t.stage_id);
    const sub = s?.subs?.find(x => x.id === t.substage_id); if (!sub) return;
    const items = t.checklist.map(i => i.text); const pr = demoPreset(sub.name);
    const isDemo = (t.description || '') === (pr.d || '') && items.join('\n') === (pr.c || []).join('\n') && !t.regulation_link && !t.video_url;
    if (isDemo || (!items.length && !t.description && !t.regulation_link && !t.video_url)) return;
    const k = cardKey(p.template_id, sub.name); const score = items.length * 10 + (t.description || '').length;
    if (!db.cardTpls[k] && (!best.has(k) || best.get(k).score < score)) best.set(k, { score, p, sub, t });
  });
  best.forEach(({ p, sub, t }) => saveCardTpl(p, sub.name, t));
  db.cardTplsInit = true;
}
const taskById = id => (db.tasks || []).find(t => t.id === id) || ext.tasks.find(t => t.id === id);
const taskFor = (pid, sid, subId) => (projById(pid)?._ext ? ext.tasks : (db.tasks || [])).find(t => t.project_id === pid && t.stage_id === sid && t.substage_id === subId);
function taskProgress(t){
  const total = t.checklist.length, n = t.checklist.filter(i => i.done).length;
  return { n, total, pct: total ? Math.round(n / total * 100) : 0, done: total > 0 && n === total };
}
const meName = () => userById(ME)?.name || 'Вы';
function makeTask({ project_id, stage_id, substage_id = null, title, description = '', assignee_id = null, checklist = [] }){
  return { id:uid(), project_id, stage_id, substage_id, title, description, regulation_link:'', result_link:'', video_url:'',
    assignee_id, checklist: checklist.map((x,i) => ({ id:uid(), text:x, done:false, position:i, completed_at:null, completed_by:null })),
    completed_at:null, created_at:new Date().toISOString() };
}
// Прогресс задачи → подэтап. Возвращает true, если подэтап поменялся.
function syncTaskToSub(t){
  const p = projById(t.project_id); const s = p?.stages.find(x => x.id === t.stage_id);
  const { done, total } = taskProgress(t);
  if (!total){ t.completed_at = null; return false; }   // пустой чек-лист не открывает и не закрывает подэтап
  const was = !!t.completed_at;
  t.completed_at = done ? (t.completed_at || new Date().toISOString()) : null;
  if (p && done !== was) addLog(p, `Задача «${t.title}»: ${done ? 'чек-лист выполнен на 100%' : 'снова в работе'}`);
  const x = s?.subs?.find(y => y.id === t.substage_id);
  if (!x || x.done === done) return false;
  x.done = done;
  if (done && s.status === 'not_started' && currentStage(p)?.id === s.id && p.start_date <= today()){ s.status = 'in_progress'; s.started_at = today(); }
  addLog(p, `Подэтап «${x.name}» (${s.name}) ${done ? 'закрыт задачей' : 'снова открыт: в задаче есть невыполненные пункты'}`);
  if (done && s.status !== 'done' && s.subs.every(y => y.done)) setTimeout(() => toast(`Все подэтапы «${s.name}» выполнены. Этап можно закрыть в карточке проекта.`), 50);
  return true;
}
// Создать задачи для подэтапов этапа, у которых их ещё нет
function tasksFromSubs(p, s){
  let n = 0;
  (s.subs || []).forEach(x => {
    if (taskFor(p.id, s.id, x.id)) return;
    const pr = taskPreset(x.name, p);
    const t = makeTask({ project_id:p.id, stage_id:s.id, substage_id:x.id, title:x.name, description:pr.d || '', assignee_id:s.assignee_id, checklist:pr.c });
    t.regulation_link = pr.reg || ''; t.video_url = pr.vid || '';
    if (x.done) t.checklist.forEach(i => { i.done = true; i.completed_at = new Date().toISOString(); i.completed_by = meName(); });
    syncTaskToSub(t); (p._ext ? ext.tasks : db.tasks).push(t); n++;
  });
  if (n) addLog(p, `Созданы задачи по подэтапам этапа «${s.name}»: ${n}`);
  return n;
}
function seedDemoTasks(){
  db.projects.filter(p => p.demo && p.state === 'active').forEach(p => {
    const s = currentStage(p); if (!s) return;
    (s.subs || []).forEach(x => {
      const pr = demoPreset(x.name);
      const t = makeTask({ project_id:p.id, stage_id:s.id, substage_id:x.id, title:x.name, description:pr.d || '', assignee_id:s.assignee_id, checklist:pr.c });
      const k = x.done ? t.checklist.length : s.status === 'not_started' ? 0 : Math.floor(Math.random() * (t.checklist.length - 1));
      t.checklist.forEach((i, j) => { if (j < k){ i.done = true; i.completed_at = new Date(Date.now() - (k - j) * 36e5).toISOString(); i.completed_by = 'Демо'; } });
      t.completed_at = taskProgress(t).done ? new Date().toISOString() : null;
      db.tasks.push(t);
    });
  });
}

const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';
function videoEmbed(url){
  const u = String(url || '').trim(); let m;
  if (!u) return null;
  if (u.startsWith('blob:')) return { kind:'video', src:u };
  if (!safeUrl(u)) return null;
  if ((m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/))) return { kind:'iframe', src:`https://www.youtube-nocookie.com/embed/${m[1]}` };
  if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return { kind:'iframe', src:`https://player.vimeo.com/video/${m[1]}` };
  if ((m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return { kind:'iframe', src:`https://drive.google.com/file/d/${m[1]}/preview` };
  if ((m = u.match(/loom\.com\/share\/(\w+)/))) return { kind:'iframe', src:`https://www.loom.com/embed/${m[1]}` };
  if (/\.(mp4|webm|mov|m4v|ogg)(\?|#|$)/i.test(u)) return { kind:'video', src:u };
  return { kind:'link', src:u };
}

function saveTaskDraft(){
  const t = taskById(ui.taskId); const d = ui.taskDraft; if (!t || !d) return;

  if (!d.title.trim()) return err('Укажите название');
  for (const [k, label] of [['regulation_link','регламент'],['video_url','видео']]) if (d[k].trim() && !safeUrl(d[k])) return err(`Ссылка на ${label} должна начинаться с http:// или https://`);
  const p = projById(t.project_id);
  const old = new Map(t.checklist.map(i => [i.id, i]));
  Object.assign(t, { title:d.title.trim(), substage_id:d.substage_id || null, assignee_id: p._ext ? t.assignee_id : (d.assignee_id || null),
    description:d.description.trim(), regulation_link:d.regulation_link.trim(), video_url:d.video_url.trim() });
  t.checklist = d.items.filter(i => i.text.trim()).map((i, k) => {
    const o = i.id && old.get(i.id);
    return o ? { ...o, text:i.text.trim(), position:k } : { id:uid(), text:i.text.trim(), done:false, position:k, completed_at:null, completed_by:null };
  });
  syncTaskToSub(t);
  const subX = p.stages.find(x => x.id === t.stage_id)?.subs?.find(x => x.id === t.substage_id);
  if (d.asTpl && subX) saveCardTpl(p, subX.name, t);
  addLog(p, `Подэтап «${t.title}» отредактирован${d.asTpl && subX ? ' и сохранён как шаблон' : ''}`);
  ui.taskDraft = null; ui.localVideo && URL.revokeObjectURL(ui.localVideo); ui.localVideo = null;
  save(); render(); renderTaskModal(); toast(d.asTpl && subX ? 'Сохранено. Шаблон карточки обновлён' : 'Подэтап сохранён');
}

// =====================================================================
//  ПРОИЗВОДСТВО → «ПРОЕКТ»: фокусная доска одного проекта.
//  Слева список проектов, справа колонки = этапы проекта, карточки = подэтапы.
//  Подсветка «Сейчас здесь»: текущий этап по Матрице и первый незакрытый подэтап в нём.
//  Next.js + Supabase версия: production-board/ (ProductionWorkspace).

function productionCursor(p){
  const s = currentStage(p);
  if (!s) return { stageId:null, subId:null };
  const sub = (s.subs || []).find(x => !subDone(p, s, x));
  return { stageId:s.id, subId:sub?.id || null };
}
// Подэтап закрыт: если у него есть задача — по её чек-листу, иначе по отметке в воронке
function subDone(p, s, x){ const t = taskFor(p.id, s.id, x.id); return t && t.checklist.length ? taskProgress(t).done : !!x.done; }
function projectProgress(p){
  let n = 0, total = 0;
  p.stages.forEach(s => (s.subs || []).forEach(x => { total++; if (subDone(p, s, x)) n++; }));
  return { n, total, pct: total ? Math.round(n / total * 100) : 0 };
}

function renderProjectFocus(mine = false){
  const key = mine ? 'myProject' : 'prodProject';
  const all = (mine ? ext.projects : db.projects).filter(p => p.state !== 'archived')
    .sort((a,b) => (a.state === 'completed') - (b.state === 'completed') || WEIGHT[projectRisk(b)] - WEIGHT[projectRisk(a)]);
  const q = norm(ui.pfQ || '');
  const list = all.filter(p => !q || norm(p.name).includes(q) || norm(p.client).includes(q));

// =====================================================================
//  ОБЛАЧНОЕ СОХРАНЕНИЕ В АККАУНТЕ CLAUDE
//  Данные лежат в личном разделе data/users/<id> хранилища приложения:
//  его видит только владелец аккаунта. localStorage остаётся кэшем,
//  чтобы приложение открывалось мгновенно и работало при обрыве связи.
//  Каждая сущность — отдельный документ (meta, p_*, t_*, r_*); большие
//  делятся на части по ~60 тыс. символов (лимит документа 256 КБ).
// =====================================================================
const cloud = { status:'local', col:null, ready:false, hashes:new Map(), timer:null, pending:false, writing:false, dirty:false, lastSaved:null, err:'' };
const CHUNK = 60000;
const cloudCanon = b => JSON.stringify([b.k, b.kind, b.base ?? null, b.part ?? null, b.of ?? null, b.v ?? null, b.json]);
const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };

function cloudDocs(){
  const out = new Map();
  const put = (key, kind, obj) => {
    const json = JSON.stringify(obj);
    if (json.length <= CHUNK){ out.set(key, { k:key, kind, json }); return; }
    const n = Math.ceil(json.length / CHUNK), v = hashStr(json);
    for (let i = 0; i < n; i++){ const k = i ? `${key}~${i}` : key; out.set(k, { k, kind, base:key, part:i, of:n, v, json:json.slice(i * CHUNK, (i + 1) * CHUNK) }); }
  };
  put('meta', 'meta', { ver:db.ver, onboarded:db.onboarded, users:db.users, templates:db.templates, prefs:db.prefs || {}, cardTpls:db.cardTpls || {}, cardTplsInit:!!db.cardTplsInit, savedAt:db.savedAt || Date.now(),
    order:{ projects:db.projects.map(p => p.id), reports:(db.reports || []).map(r => r.id) } });
  db.projects.forEach(p => put('p_' + p.id, 'project', p));
  (db.tasks || []).forEach(t => put('t_' + t.id, 'task', t));
  (db.reports || []).forEach(r => put('r_' + r.id, 'report', r));
  return out;
}
// Собираем данные из документов; если какая-то большая сущность пришла не целиком — ждём следующего снимка
function cloudAssemble(docs){
  const ent = new Map();
  for (const [k, b] of docs){
    const base = b.base || k; const e = ent.get(base) || { kind:b.kind, parts:[], of:b.of || 1, v:b.v };
    e.parts[b.part || 0] = b; ent.set(base, e);
  }
  const out = { meta:null, projects:[], tasks:[], reports:[] };
  for (const e of ent.values()){
    if (e.parts.length < e.of || [...Array(e.of).keys()].some(i => !e.parts[i] || e.parts[i].v !== e.v)) return null;
    let obj; try { obj = JSON.parse(e.parts.map(p => p.json).join('')); } catch(err) { return null; }
    if (e.kind === 'meta') out.meta = obj; else if (e.kind === 'project') out.projects.push(obj);
    else if (e.kind === 'task') out.tasks.push(obj); else if (e.kind === 'report') out.reports.push(obj);
  }
  if (!out.meta) return null;
  const byOrder = (list, ids) => list.sort((a,b) => { const i = ids.indexOf(a.id), j = ids.indexOf(b.id); return (i < 0 ? 1e9 : i) - (j < 0 ? 1e9 : j); });
  byOrder(out.projects, out.meta.order?.projects || []); byOrder(out.reports, out.meta.order?.reports || []);
  return out;
}
function cloudApply(r){
  Object.assign(db, { ver:r.meta.ver, onboarded:r.meta.onboarded, users:r.meta.users, templates:r.meta.templates, prefs:r.meta.prefs, cardTpls:r.meta.cardTpls || {}, cardTplsInit:!!r.meta.cardTplsInit, savedAt:r.meta.savedAt,
    projects:r.projects, tasks:r.tasks, reports:r.reports });
  migrate(); if (!db.cardTplsInit){ migrateCardTpls(); scheduleCloud(); }
  if (ui.open && !projById(ui.open)) closeLayer();
  if (db.onboarded && layer.querySelector('#mForm')) layer.innerHTML = '';
  if (ui.taskId){ if (taskById(ui.taskId)) renderTaskModal(); else closeTask(); }
  if (typeof syncSharedSubs === 'function') syncSharedSubs();
  render();
}
function scheduleCloud(){
  if (!cloud.col || !cloud.ready) return;
  cloud.pending = true; clearTimeout(cloud.timer);
  cloud.timer = setTimeout(flushCloud, 1200);
  setCloudStatus('saving');
}
async function flushCloud(){
  if (!cloud.col) return;
  clearTimeout(cloud.timer);
  if (cloud.writing){ cloud.dirty = true; return; }
  cloud.writing = true; cloud.pending = false; setCloudStatus('saving');
  try {
    const docs = cloudDocs();
    for (const [k, body] of docs){
      const s = cloudCanon(body);
      if (cloud.hashes.get(k) === s) continue;
      await cloud.col.doc(k).set(body); cloud.hashes.set(k, s);       // по одной записи на документ
    }
    for (const k of [...cloud.hashes.keys()]) if (!docs.has(k)){ await cloud.col.doc(k).delete(); cloud.hashes.delete(k); }
    db.syncedOnce = true; localSave();
    cloud.lastSaved = new Date(); cloud.retry = 0; setCloudStatus('saved');
  } catch(e) {
    const msg = { quota_exceeded:'Хранилище аккаунта заполнено. Удалите старые отчёты или проекты.',
      invalid_argument:'Аккаунт не может сохранять данные в этом приложении (нужен доступ уровня «Участник» или выше).',
      resource_exhausted:'Слишком частые сохранения, повторю через минуту.', revoked:'Доступ к хранилищу отозван.' }[e?.code];
    setCloudStatus('error', msg || 'Не удалось сохранить в аккаунт. Данные сохранены в браузере, повторю попытку.');
    if (['unavailable','resource_exhausted'].includes(e?.code) || !e?.code){ cloud.retry = (cloud.retry || 0) + 1; if (cloud.retry <= 5) setTimeout(flushCloud, Math.min(60000, 3000 * 2 ** cloud.retry) + Math.random() * 1500); }
  }
  cloud.writing = false;
  if (cloud.dirty){ cloud.dirty = false; flushCloud(); }
}
function onCloudSnapshot(snap){
  const docs = new Map(snap.docs.map(d => [d.id, d.data()]));
  if (!cloud.ready){
    if (snap.metadata?.fromCache) return;                         // ждём ответа сервера, а не кэша
    cloud.ready = true;
    if (!docs.size){                                              // в аккаунте пусто — переносим данные из браузера
      flushCloud().then(() => { if (db.onboarded && cloud.status === 'saved') toast('Данные из этого браузера сохранены в вашем аккаунте'); });
      return;
    }
    const remote = cloudAssemble(docs);
    if (!remote){ cloud.ready = false; return; }                  // часть документов ещё в пути
    docs.forEach((b, k) => cloud.hashes.set(k, cloudCanon(b)));
    if (db.syncedOnce && (db.savedAt || 0) > (remote.meta.savedAt || 0)){ flushCloud(); return; }   // здесь есть несохранённые правки
    if (!db.syncedOnce && db.onboarded){ try { localStorage.setItem(KEY + '-backup', JSON.stringify(db)); } catch(e) {} }
    cloudApply(remote); db.syncedOnce = true; localSave();
    cloud.lastSaved = new Date(remote.meta.savedAt || Date.now()); setCloudStatus('saved');
    return;
  }
  // изменения с другого устройства или вкладки
  if (snap.metadata?.hasPendingWrites) return;
  let changed = false;
  for (const [k, b] of docs){ const s = cloudCanon(b); if (cloud.hashes.get(k) !== s){ cloud.hashes.set(k, s); changed = true; } }
  for (const k of [...cloud.hashes.keys()]) if (!docs.has(k)){ cloud.hashes.delete(k); changed = true; }
  if (!changed || cloud.pending || cloud.writing) return;        // свои несохранённые правки важнее: их запишет flush
  const remote = cloudAssemble(docs); if (!remote) return;
  cloudApply(remote); localSave();
  cloud.lastSaved = new Date(); setCloudStatus('saved');
}
const CLOUD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H8a5 5 0 1 1 1.1-9.9A6 6 0 0 1 20.5 11a4 4 0 0 1-3 8Z"/></svg>';
function cloudText(){

// =====================================================================
//  ОБЩИЙ ДОСТУП К ПРОЕКТАМ (шеринг и роли) + Realtime между владельцем и исполнителем
//  Проект, которым поделились, хранится в общем разделе хранилища приложения:
//    sp/<projectId>              — проект, владелец, участники (только id аккаунтов и роли)
//    sp/<projectId>/tasks/<id>   — подэтапы с чек-листами (отдельно, чтобы отметки двух людей не затирали друг друга)
//  Владелец и участники подписаны на эти документы: отметка исполнителя появляется у владельца сразу.
//  Права ролей проверяет интерфейс; строгая проверка на уровне базы — в Supabase-версии (RLS).
// =====================================================================
const ext = { projects:[], tasks:[] };                       // проекты, которыми поделились со мной
const shared = { subs:new Map(), hashes:new Map(), timer:null, writing:false, dirty:false, pending:false, ready:false };
const ROLES_SHARE = [['worker','Исполнитель'], ['lead','Руководитель']];
// сравниваем содержимое, а не порядок ключей, в котором хранилище вернуло документ
const sharedCanon = (path, b) => path.includes('/tasks/') ? String(b.json) : JSON.stringify([b.ownerId ?? null, (b.members || []).map(m => `${m.id}:${m.role}`).sort(), b.json]);
const trimLog = p => ({ ...p, _ext:undefined, share:undefined, log:(p.log || []).slice(0, 150) });
function mergeLogs(a = [], b = []){
  const seen = new Set(); return [...a, ...b].filter(l => { const k = l.at + '|' + l.text; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((x, y) => String(y.at).localeCompare(String(x.at))).slice(0, 500);
}
const shareCount = p => (p?.share?.members?.length || 0) + (p?.share?.guests?.length || 0);
const ownShared = () => db.projects.filter(p => (shareCount(p) || p.share?.links?.length) && p.state !== 'archived');
function sharedBodies(){
  const out = new Map();
  const add = (p, ownerId, members) => {
    let json = JSON.stringify(trimLog(p));
    if (json.length > 200000) json = JSON.stringify({ ...trimLog(p), log:(p.log || []).slice(0, 20) });
    out.set(`sp/${p.id}`, { ownerId, members, memberIds:members.map(m => m.id), json });
    const tasks = (p._ext ? ext.tasks : db.tasks).filter(t => t.project_id === p.id);
    tasks.forEach(t => out.set(`sp/${p.id}/tasks/${t.id}`, { json:JSON.stringify(t) }));
  };
  ownShared().forEach(p => add(p, cloud.uid, p.share.members || []));
  ext.projects.forEach(p => add(p, p._ext.ownerId, p._ext.members));
  return out;
}
function scheduleShared(){
  if (!cloud.store || !cloud.uid) return;
  shared.pending = true; clearTimeout(shared.timer); shared.timer = setTimeout(flushShared, 700);
}
async function flushShared(){
  if (!cloud.store) return;
  if (shared.writing){ shared.dirty = true; return; }
  shared.writing = true; shared.pending = false;
  try {
    const bodies = sharedBodies();
    for (const [path, body] of bodies){
      const s = sharedCanon(path, body); if (shared.hashes.get(path) === s) continue;
      await cloud.store.doc(path).set(body); shared.hashes.set(path, s);
    }
    // задачи, удалённые в проектах, и проекты, у которых убрали всех участников
    const live = new Set([...ownShared().map(p => p.id), ...ext.projects.map(p => p.id)]);
    for (const path of [...shared.hashes.keys()]){
      if (bodies.has(path)) continue;
      const pid = path.split('/')[1]; const own = db.projects.some(p => p.id === pid);
      // чужой проект, к которому пропал доступ, не трогаем: просто забываем
      if ((own && !live.has(pid)) || (live.has(pid) && path.includes('/tasks/'))) await cloud.store.doc(path).delete();
      shared.hashes.delete(path);
    }
    syncSharedSubs();
  } catch(e) {
    toast(e?.code === 'invalid_argument' || e?.code === 'not_granted'
      ? 'Не удалось сохранить общий проект: у вашего доступа к приложению нет права на изменения'
      : 'Не удалось синхронизировать общий проект, повторю попытку');
    if (!['invalid_argument','not_granted','revoked'].includes(e?.code)) setTimeout(flushShared, 4000);
  }
  shared.writing = false;
  if (shared.dirty){ shared.dirty = false; flushShared(); }
}
// Подписки на общие проекты: свои расшаренные (документ + задачи) и проекты, где я участник
function syncSharedSubs(){
  if (!cloud.store) return;
  const want = new Set([...ownShared().map(p => p.id), ...ext.projects.map(p => p.id)]);
  for (const [pid, un] of shared.subs) if (!pid.startsWith('__') && !want.has(pid)){ un.forEach(f => f()); shared.subs.delete(pid); }
  for (const pid of want){
    if (shared.subs.has(pid)) continue;
    const uns = [];
    if (projById(pid) && !projById(pid)._ext){                     // мой проект: слушаем документ проекта (правки исполнителя)
      uns.push(cloud.store.doc(`sp/${pid}`).onSnapshot(snap => onSharedProject(pid, snap), () => {}));
      uns.push(cloud.store.collection(`sp/${pid}/joins`).onSnapshot(snap => onJoins(pid, snap), () => {}));   // кто вошёл по ссылке
    }
    uns.push(cloud.store.collection(`sp/${pid}/tasks`).onSnapshot(snap => onSharedTasks(pid, snap), () => {}));
    shared.subs.set(pid, uns);
  }
}
function onSharedProject(pid, snap){
  if (!snap.exists || snap.metadata?.hasPendingWrites) return;
  const body = snap.data(); const s = sharedCanon(`sp/${pid}`, body);
  if (shared.hashes.get(`sp/${pid}`) === s) return;
  shared.hashes.set(`sp/${pid}`, s);
  if (shared.pending || shared.writing) return;                 // свои несохранённые правки уйдут следом
  const remote = JSON.parse(body.json); const i = db.projects.findIndex(p => p.id === pid); if (i < 0) return;
  const local = db.projects[i];
  db.projects[i] = { ...remote, share:local.share, log:mergeLogs(local.log, remote.log) };
  afterSharedApply();
}
function onSharedTasks(pid, snap){
  if (snap.metadata?.hasPendingWrites) return;
  const p = projById(pid); if (!p) return;
  const list = p._ext ? ext.tasks : db.tasks;
  const remote = snap.docs.map(d => ({ path:`sp/${pid}/tasks/${d.id}`, body:d.data() }));
  let changed = false;
  for (const r of remote){ const s = sharedCanon(r.path, r.body); if (shared.hashes.get(r.path) !== s){ shared.hashes.set(r.path, s); changed = true; } }
  const ids = new Set(remote.map(r => r.path));
  for (const k of [...shared.hashes.keys()]) if (k.startsWith(`sp/${pid}/tasks/`) && !ids.has(k)){ shared.hashes.delete(k); changed = true; }
  if (!changed || shared.pending || shared.writing) return;
  const tasks = remote.map(r => JSON.parse(r.body.json));
  const rest = list.filter(t => t.project_id !== pid);
  if (p._ext) ext.tasks = [...rest, ...tasks]; else db.tasks = [...rest, ...tasks];
  afterSharedApply();
}
function afterSharedApply(){
  localSave(); if (typeof scheduleCloud === 'function') scheduleCloud();
  if (ui.taskId){ if (taskById(ui.taskId)) renderTaskModal(); else closeTask(); }
  if (ui.open && projById(ui.open)) renderDrawer();
  render();
}
// Проекты, где я участник: (1) меня добавили из организации — мой id в memberIds;
// (2) я открыл ссылку-приглашение — проект записан в моём личном списке data/users/<id>/links/joined
const mine = { q:new Map(), j:new Map(), jsubs:new Map() };
function watchMine(){
  if (shared.subs.has('__mine')) return;
  const un = cloud.store.collection('sp').where('memberIds', 'array-contains', cloud.uid).onSnapshot(snap => {
    mine.q = new Map();
    snap.docs.forEach(d => {
      const b = d.data(); if (b.ownerId === cloud.uid) return;
      const me = (b.members || []).find(m => m.id === cloud.uid); if (me) mine.q.set(d.id, { b, role:me.role });
    });
    rebuildExt();
  }, () => {});
  shared.subs.set('__mine', [un]);
  const un2 = cloud.store.collection(`data/users/${cloud.uid}/links/joined`).onSnapshot(snap => {
    const pids = new Set(snap.docs.map(d => d.id));
    for (const [pid, uns] of mine.jsubs) if (!pids.has(pid)){ uns.forEach(f => f()); mine.jsubs.delete(pid); mine.j.delete(pid); }
    for (const pid of pids){
      if (mine.jsubs.has(pid)) continue;
      const st = { b:null, join:undefined }; mine.j.set(pid, st);
      mine.jsubs.set(pid, [
        cloud.store.doc(`sp/${pid}`).onSnapshot(x => { if (x.metadata?.hasPendingWrites) return; st.b = x.exists ? x.data() : null; rebuildExt(); }, () => {}),
        cloud.store.doc(`sp/${pid}/joins/${cloud.uid}`).onSnapshot(x => { st.join = x.exists ? x.data() : null; rebuildExt(); }, () => {}),
      ]);
    }
    rebuildExt();
  }, () => {});
  shared.subs.set('__mineLinks', [un2]);
}
function rebuildExt(){
  const src = new Map(mine.q);
  for (const [pid, st] of mine.j){
    if (src.has(pid) || !st.b || !st.join || st.b.ownerId === cloud.uid) continue;   // нет проекта или владелец закрыл мне доступ
    src.set(pid, { b:st.b, role:st.join.role || 'worker', link:true });
  }
  const next = [];
  for (const [pid, { b, role, link }] of src){
    const path = `sp/${pid}`; const s = sharedCanon(path, b);
    const old = ext.projects.find(p => p.id === pid);
    if (old && old._ext.role === role && (shared.hashes.get(path) === s || shared.pending || shared.writing)){ next.push(old); continue; }
    shared.hashes.set(path, s);
    let p; try { p = JSON.parse(b.json); } catch(e) { continue; }
    p._ext = { ownerId:b.ownerId, role, members:b.members || [], link:!!link };
    if (old) p.log = mergeLogs(old.log, p.log);
    next.push(p);
  }
  const gone = ext.projects.filter(p => !next.some(n => n.id === p.id)).map(p => p.id);
  ext.projects = next; ext.tasks = ext.tasks.filter(t => !gone.includes(t.project_id));
  if (gone.length && ui.view === 'mine' && gone.includes(ui.myProject)) toast('Доступ к проекту закрыт владельцем');
  syncSharedSubs(); afterSharedApply();
  if (ext.projects.length && !ui.mineSeen && !GUEST){ ui.mineSeen = true; toast(`С вами поделились проектами: ${ext.projects.length}. Они во вкладке «Мои проекты»`); }
}

async function acceptInvite(code){

  if (!code) return err('Не нашёл в ссылке код приглашения. Скопируйте ссылку целиком.');

  try {
    const inv = await cloud.store.doc(`inv/${code}`).get();
    if (!inv.exists) return err('Ссылка недействительна: владелец отключил её или она скопирована не полностью.');
    const { pid, ownerId, role } = inv.data();
    if (ownerId === cloud.uid){ toast('Это ссылка на ваш собственный проект. Отправьте её коллеге.'); return; }
    const jr = cloud.store.doc(`sp/${pid}/joins/${cloud.uid}`);

      ? 'Не получилось открыть проект: у вашего доступа к приложению нет права на изменения. Попросите владельца открыть приложение с уровнем «Участник» (Contributor).'

function onJoins(pid, snap){
  const p = db.projects.find(x => x.id === pid); if (!p) return;
  const list = snap.docs.map(d => ({ id:d.id, role:d.data().role || 'worker', at:d.data().at || '' }));
  const key = l => (l || []).map(g => g.id + ':' + g.role).sort().join(',');
  if (key(list) === key(p.share?.guests)) return;
  const fresh = list.filter(g => !(p.share?.guests || []).some(x => x.id === g.id));

async function createLink(pid, role){
  const p = projById(pid); if (!p || p._ext) return;

  const code = newCode(); const at = new Date().toISOString();
  p.share.links.push({ code, role, at }); addLog(p, 'Создана ссылка-приглашение'); save();
  for (let i = 0; i < 30 && !shared.hashes.has(`sp/${pid}`); i++){ if (!shared.writing) await flushShared(); else await new Promise(r => setTimeout(r, 250)); }
  try {
    if (!shared.hashes.has(`sp/${pid}`)) throw { code:'unavailable' };
    await cloud.store.doc(`inv/${code}`).set({ pid, ownerId:cloud.uid, role, at });
    renderShareLinks(); copyLink(code);

    p.share.links = p.share.links.filter(l => l.code !== code); save(); renderShareLinks();
